version: "3.8"

services:
  # ── Nally App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nally
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
        required: false
    volumes:
      - nally_data:/app/data
      - nally_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,httpx; p=os.getenv('PORT','10000'); httpx.get(f'http://localhost:{p}/health').raise_for_status()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nally

  # ── Embed API (separate Free instance, MiniLM ONNX 20MB 384d) ──
  # NALLY main stays lean (<300MB) — model lives here. Free 512MB fits MiniLM ONNX 120MB RAM.
  # Uses NALLY_INTERNAL_TOKEN for Bearer auth. Local: docker compose --profile with-embed up
  # On Render: deploy embed-api/ as separate Web Service (Free), set EMBED_API_KEY same token.
  embed-api:
    build:
      context: ./embed-api
      dockerfile: Dockerfile
    container_name: nally-embed
    ports:
      - "8000:8000"
    environment:
      - EMBED_MODEL=${EMBED_MODEL:-all-MiniLM-L6-v2}
      - EMBED_API_KEY=${NALLY_EMBED_API_KEY:-${NALLY_INTERNAL_TOKEN:-}}
      - PORT=8000
      - HF_HOME=/app/.cache/hf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - nally
    profiles:
      - with-embed

  # ── Redis (optional, for caching + rate limiting) ─────
  redis:
    image: redis:7-alpine
    container_name: nally-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nally
    profiles:
      - with-redis

volumes:
  nally_data:
    driver: local
  nally_logs:
    driver: local
  redis_data:
    driver: local

networks:
  nally:
    driver: bridge

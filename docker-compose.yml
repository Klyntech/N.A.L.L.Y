version: "3.8"

services:
  # ── Nally App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nally
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
        required: false
    volumes:
      - nally_data:/app/data
      - nally_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,httpx; p=os.getenv('PORT','10000'); httpx.get(f'http://localhost:{p}/health').raise_for_status()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nally

  # ── Redis (optional, for caching + rate limiting) ─────
  redis:
    image: redis:7-alpine
    container_name: nally-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nally
    profiles:
      - with-redis

volumes:
  nally_data:
    driver: local
  nally_logs:
    driver: local
  redis_data:
    driver: local

networks:
  nally:
    driver: bridge

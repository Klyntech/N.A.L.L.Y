[project]
name = "nally"
version = "1.0.0"
description = "Personal AI assistant inspired by Jarvis"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["nally", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E722",   # bare except (used intentionally in router.py catch-all handlers)
    "E731",   # lambda assignment (router pattern matcher)
    "B008",   # function call in default argument (FastAPI Depends)
    "B905",   # zip without strict= (needs Python 3.10+)
    "B904",   # raise ... from err (not always helpful)
    "SIM105", # contextlib.suppress (readability tradeoff)
    "SIM102", # combine if statements (readability tradeoff)
    "SIM108", # ternary operator (readability tradeoff)
    "SIM110", # any/all (readability tradeoff)
    "SIM113", # enumerate (not always applicable)
    "SIM115", # context manager for open() (not always applicable)
    "SIM117", # nested with statements (readability tradeoff)
    "E741",   # ambiguous variable name (math contexts)
    "UP035",  # import from collections.abc (not always needed)
    "UP045",  # X | None vs Optional[X] (both fine)
    "UP006",  # dict vs Dict (both fine)
    "RUF001", # ambiguous dash character (intentional in regex)
    "RUF005", # iterable unpacking (not always clearer)
    "RUF006", # store ensure_future ref (fire-and-forget pattern)
    "RUF013", # implicit Optional (existing code pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["nally"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "windows: marks tests that only run on Windows",
    "integration: marks tests requiring external services",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]

[tool.coverage.run]
source = ["nally"]
omit = [
    "nally/web/*",
    "tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]

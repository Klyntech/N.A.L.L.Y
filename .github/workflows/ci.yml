name: CI

on:
  push:
    branches: [master, "refactor/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  doc-freshness:
    name: Doc Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for stale doc references
        run: |
          echo "Checking docs for references to deleted files/modules..."
          STALE=0
          for pattern in \
            "nally/voice" \
            "voice_call\.py" \
            "run_tg_call" \
            "run_tg_user" \
            "livekit_agent" \
            "pytgcalls" \
            "faster-whisper" \
            "piper-tts" \
            "ELEVENLABS" \
            "DEEPGRAM_API" \
            "LIVEKIT_" \
            "NALLY_TTS_BACKEND" \
            "NALLY_VOICE_CALLS" \
            "BARGEIN_" \
            "voice_tmp"; do
            matches=$(grep -rn "$pattern" docs/ README.md SOUL.md CONTRIBUTING.md --exclude-dir=archive --exclude=CHANGELOG.md 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "⚠️  Found stale reference to '$pattern':"
              echo "$matches"
              STALE=1
            fi
          done
          if [ "$STALE" -eq 1 ]; then
            echo ""
            echo "❌ Stale doc references found. Update docs to match current codebase."
            echo "   (Historical files like CHANGELOG.md and docs/archive/ are excluded.)"
            exit 1
          fi
          echo "✅ No stale doc references found."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

name: One-time Ruff cleanup

on:
  push:
    branches: [stableforABSU]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableforABSU
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.0
      - name: Apply Ruff fixes and format
        run: |
          ruff check . --fix --unsafe-fixes || true
          ruff format .
          ruff check . || true
      - name: Commit changes and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ruff-autofix-once.yml
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Resolve remaining Ruff lint violations"
            git push origin HEAD:stableforABSU
          fi

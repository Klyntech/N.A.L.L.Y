name: One-time Ruff cleanup

on:
  push:
    branches: [stableforABSU]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message == 'Run one-time Ruff cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stableforABSU
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply safe fixes and formatting
        run: |
          ruff check . --fix || true
          ruff format .

      - name: Commit cleanup and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ruff-autofix-once.yml
          git add -u
          git commit -m "Apply safe Ruff fixes and formatting"
          git push origin stableforABSU

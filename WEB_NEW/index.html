<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.A.L.L.Y</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --iris: #7C6AEF;
      --iris-glow: rgba(124,106,239,0.35);
      --teal: #3ECFB8;
      --green: #34D399;
    }
    html, body { background: #0a0a0a; height: 100%; width: 100%; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
    #root { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 40px; }

    /* ─── Orb Keyframes ─────────────────────────── */
    @keyframes orbSpinCW {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg) scale(1.02); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbSpinCCW {
      0% { transform: rotate(360deg); }
      50% { transform: rotate(180deg) scale(0.98); }
      100% { transform: rotate(0deg); }
    }
    @keyframes orbCorePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px var(--iris-glow)) drop-shadow(0 0 35px rgba(124,106,239,0.2)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 35px var(--iris-glow)) drop-shadow(0 0 60px rgba(124,106,239,0.4)); }
    }
    @keyframes orbAmbientPulse {
      0%, 100% { transform: scale(0.88); opacity: 0.3; filter: blur(55px) saturate(1.2); }
      50% { transform: scale(1.15); opacity: 0.75; filter: blur(40px) saturate(1.8); }
    }
    @keyframes orbListening {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(62,207,184,0.5)) drop-shadow(0 0 50px rgba(62,207,184,0.25)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 50px rgba(62,207,184,0.85)) drop-shadow(0 0 90px rgba(62,207,184,0.4)); }
    }
    @keyframes orbThinkingPulse {
      0%   { transform: scale(1); filter: drop-shadow(0 0 15px rgba(124,106,239,0.3)); }
      8%   { transform: scale(1.07); filter: drop-shadow(0 0 35px rgba(124,106,239,0.7)) drop-shadow(0 0 60px rgba(124,106,239,0.3)); }
      18%  { transform: scale(1); filter: drop-shadow(0 0 15px rgba(124,106,239,0.3)); }
      26%  { transform: scale(1.1); filter: drop-shadow(0 0 45px rgba(124,106,239,0.9)) drop-shadow(0 0 80px rgba(124,106,239,0.45)); }
      40%  { transform: scale(1); filter: drop-shadow(0 0 15px rgba(124,106,239,0.3)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(124,106,239,0.3)); }
    }
    @keyframes orbThinkingRingPulse {
      0%   { opacity: 0; transform: scale(1); }
      10%  { opacity: 0.6; transform: scale(1.05); }
      40%  { opacity: 0; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(1); }
    }
    @keyframes orbThinkingRipple {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.5; border-color: rgba(124,106,239,0.5); }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; border-color: rgba(124,106,239,0.1); }
    }
    @keyframes orbSpeaking {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)) drop-shadow(0 0 50px rgba(52,211,153,0.35)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 45px rgba(52,211,153,0.9)) drop-shadow(0 0 80px rgba(52,211,153,0.55)); }
    }
    @keyframes orbBreathe {
      0%   { transform: scale(0.3); opacity: 0; filter: blur(20px) brightness(0.3); }
      25%  { transform: scale(0.6); opacity: 0.5; filter: blur(8px) brightness(0.7); }
      50%  { transform: scale(0.9); opacity: 0.9; filter: blur(2px) brightness(1.1); }
      70%  { transform: scale(1.08); opacity: 1; filter: blur(0px) brightness(1.3); }
      85%  { transform: scale(0.96); opacity: 1; filter: blur(0px) brightness(1); }
      100% { transform: scale(1); opacity: 1; filter: blur(0px) brightness(1); }
    }
    @keyframes rippleExpand {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
      100% { transform: translate(-50%, -50%) scale(4); opacity: 0; border-width: 1px; }
    }
    @keyframes particleFly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
    }
    @keyframes wordPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes emphasisFlare {
      0% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)); }
      30% { transform: scale(1.15); filter: drop-shadow(0 0 60px rgba(52,211,153,1)) drop-shadow(0 0 100px rgba(52,211,153,0.6)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)); }
    }

    /* ─── Orb Classes ───────────────────────────── */
    .orb-wrapper {
      position: relative;
      width: 312px; height: 312px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
    }
    .orb-inner {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s ease-out;
    }
    .orb-inner.breathe { animation: orbBreathe 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .orb-inner.word-pulse { animation: wordPulse 0.25s ease-out; }
    .orb-inner.emphasis-flare { animation: emphasisFlare 0.4s ease-out; }
    .orb-ambient {
      position: absolute;
      width: 470px; height: 470px;
      border-radius: 50%;
      background: rgba(124,106,239,0.1);
      filter: blur(40px);
      pointer-events: none;
      transition: all 0.6s ease;
      animation: orbAmbientPulse 8s ease-in-out infinite;
    }
    .orb-ring-cw { animation: orbSpinCW 55s linear infinite; transform-origin: 250px 250px; }
    .orb-ring-ccw { animation: orbSpinCCW 60s linear infinite; transform-origin: 250px 250px; }
    .orb-reactor { animation: orbCorePulse 7s ease-in-out infinite; transform-origin: 250px 250px; }

    /* State: listening */
    .orb-state-listening .orb-reactor { animation: orbListening 1.5s ease-in-out infinite; }
    .orb-state-listening .orb-ring-cw { animation-duration: 8s; }
    .orb-state-listening .orb-ring-ccw { animation-duration: 10s; }
    /* State: thinking */
    .orb-state-thinking .orb-ring-cw { animation: orbSpinCW 2.5s linear infinite; }
    .orb-state-thinking .orb-ring-ccw { animation: orbSpinCCW 3s linear infinite reverse; }
    .orb-state-thinking .orb-reactor { animation: orbThinkingPulse 1.2s ease-in-out infinite; }
    .orb-thinking-ring-pulse {
      position: absolute; top: 50%; left: 50%;
      width: 312px; height: 312px; border-radius: 50%;
      border: 2px solid rgba(124,106,239,0.4);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none; opacity: 0;
      animation: orbThinkingRingPulse 1.2s ease-out infinite;
    }
    .orb-thinking-ripple {
      position: absolute; top: 50%; left: 50%;
      width: 120px; height: 120px; border-radius: 50%;
      border: 1.5px solid rgba(124,106,239,0.5);
      pointer-events: none;
      animation: orbThinkingRipple 1.2s ease-out infinite;
    }
    /* State: speaking */
    .orb-state-speaking .orb-reactor { animation: orbSpeaking 2s ease-in-out infinite; }
    .orb-state-speaking .orb-ring-cw { animation-duration: 20s; }
    .orb-state-speaking .orb-ring-ccw { animation-duration: 25s; }

    /* Ripple */
    .ripple {
      position: absolute;
      top: 50%; left: 50%;
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(124,106,239,0.45);
      pointer-events: none;
      animation: rippleExpand 1.5s ease-out forwards;
    }
    /* Particle */
    .particle {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFly 1s ease-out forwards;
    }

    /* ─── Status text ───────────────────────────── */
    #status-text {
      font-size: 13px;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(228,226,220,0.25);
      transition: all 0.4s ease;
      min-height: 20px;
    }
    #thought-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #thought-wrap.visible { opacity: 1; }
    #thought-wrap.collapsed #thought-content { max-height: 0; opacity: 0; padding: 0; margin: 0; overflow: hidden; }
    #thought-toggle {
      background: none; border: none; cursor: pointer;
      color: rgba(124,106,239,0.35);
      font-size: 11px; letter-spacing: 1px;
      font-family: 'Space Grotesk', sans-serif;
      display: flex; align-items: center; gap: 4px;
      transition: color 0.3s ease;
      padding: 2px 8px;
    }
    #thought-toggle:hover { color: rgba(124,106,239,0.7); }
    #thought-toggle .chevron {
      display: inline-block;
      transition: transform 0.3s ease;
      font-size: 10px;
    }
    #thought-wrap.collapsed #thought-toggle .chevron { transform: rotate(-90deg); }
    #thought-content {
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-style: italic;
      letter-spacing: 1px;
      color: rgba(124,106,239,0.55);
      text-align: center;
      max-width: 400px;
      min-height: 20px;
      max-height: 40px;
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      opacity: 1;
      padding: 2px 0;
    }



    /* ─── Chat Drawer (Desktop Window) ────────────── */
    #chat-drawer {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
      height: 480px;
      min-width: 320px;
      min-height: 260px;
      background: rgba(12,12,18,0.94);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    #chat-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }
    #chat-drawer.maximized {
      top: 0; left: 0;
      transform: none;
      width: 100vw !important;
      height: calc(100vh - 48px) !important;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* Title bar */
    .drawer-titlebar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 38px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
    }
    .drawer-titlebar:active { cursor: grabbing; }
    .titlebar-dots {
      display: flex;
      gap: 7px;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.15s ease;
    }
    .dot:hover { filter: brightness(1.3); transform: scale(1.15); }
    .dot-close { background: #ff5f57; }
    .dot-min { background: #febc2e; }
    .dot-max { background: #28c840; }
    .titlebar-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(228,226,220,0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
      flex: 1;
      text-align: center;
      pointer-events: none;
    }
    .titlebar-spacer { width: 52px; }

    /* Messages area */
    .drawer-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .drawer-messages::-webkit-scrollbar { width: 4px; }
    .drawer-messages::-webkit-scrollbar-track { background: transparent; }
    .drawer-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .drawer-msg {
      padding: 10px 16px;
      margin: 6px 0;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 75%;
      animation: msgFadeIn 0.3s ease-out;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .drawer-msg.user {
      background: rgba(124,106,239,0.15);
      color: rgba(228,226,220,0.9);
      margin-left: auto;
      border: 1px solid rgba(124,106,239,0.2);
    }
    .drawer-msg.nally {
      background: rgba(255,255,255,0.04);
      color: rgba(228,226,220,0.7);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .drawer-msg.nally .msg-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--iris);
      opacity: 0.6;
      margin-bottom: 4px;
    }

    /* Input area */
    .drawer-input-wrap {
      display: flex;
      gap: 10px;
      padding: 14px 16px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .drawer-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 16px;
      color: rgba(228,226,220,0.9);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .drawer-input:focus { border-color: rgba(124,106,239,0.4); }
    .drawer-input::placeholder { color: rgba(228,226,220,0.2); }
    .drawer-send {
      background: var(--iris);
      border: none;
      border-radius: 10px;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }
    .drawer-send svg { width: 18px; height: 18px; }
    .drawer-send:hover { background: #6a58d9; transform: scale(1.05); }

    /* Resize handles */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }
    .resize-n  { top: -4px; left: 8px; right: 8px; height: 8px; cursor: n-resize; }
    .resize-s  { bottom: -4px; left: 8px; right: 8px; height: 8px; cursor: s-resize; }
    .resize-e  { right: -4px; top: 8px; bottom: 8px; width: 8px; cursor: e-resize; }
    .resize-w  { left: -4px; top: 8px; bottom: 8px; width: 8px; cursor: w-resize; }
    .resize-ne { top: -4px; right: -4px; width: 14px; height: 14px; cursor: ne-resize; }
    .resize-nw { top: -4px; left: -4px; width: 14px; height: 14px; cursor: nw-resize; }
    .resize-se { bottom: -4px; right: -4px; width: 14px; height: 14px; cursor: se-resize; }
    .resize-sw { bottom: -4px; left: -4px; width: 14px; height: 14px; cursor: sw-resize; }
  </style>
</head>
<body>
  <div id="root">
    <div id="orb-mount"></div>
    <div id="status-text"></div>
    <div id="thought-wrap">
      <button id="thought-toggle" onclick="toggleThought()"><span class="chevron">&#9660;</span> thought</button>
      <div id="thought-content"></div>
    </div>
  </div>

  <!-- Chat Drawer -->
  <div id="chat-drawer">
    <div class="drawer-titlebar" id="drawer-titlebar">
      <div class="titlebar-dots">
        <span class="dot dot-close" onclick="closeDrawer()"></span>
        <span class="dot dot-min" onclick="minimizeDrawer()"></span>
        <span class="dot dot-max" onclick="maximizeDrawer()"></span>
      </div>
      <div class="titlebar-label">N.A.L.L.Y</div>
      <div class="titlebar-spacer"></div>
    </div>
    <div class="drawer-messages" id="chat-messages"></div>
    <div class="drawer-input-wrap">
      <input class="drawer-input" id="chat-input" type="text" placeholder="Ask Nally anything..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="drawer-send" onclick="sendChat()"><i data-lucide="send"></i></button>
    </div>
    <!-- Resize handles -->
    <div class="resize-handle resize-n" data-dir="n"></div>
    <div class="resize-handle resize-s" data-dir="s"></div>
    <div class="resize-handle resize-e" data-dir="e"></div>
    <div class="resize-handle resize-w" data-dir="w"></div>
    <div class="resize-handle resize-ne" data-dir="ne"></div>
    <div class="resize-handle resize-nw" data-dir="nw"></div>
    <div class="resize-handle resize-se" data-dir="se"></div>
    <div class="resize-handle resize-sw" data-dir="sw"></div>
  </div>


  <script>
    var root = document.getElementById('root');
    var statusEl = document.getElementById('status-text');
    var thoughtWrap = document.getElementById('thought-wrap');
    var thoughtContent = document.getElementById('thought-content');
    var thoughtCollapsed = false;

    function toggleThought() {
      thoughtCollapsed = !thoughtCollapsed;
      thoughtWrap.classList.toggle('collapsed', thoughtCollapsed);
    }

    // ─── Orb Component (Vanilla JS) ──────────────
    function createOrb(opts) {
      opts = opts || {};
      var size = opts.size || 312;
      var state = opts.state || 'idle';
      var activated = opts.activated !== false;

      var wrapper = document.createElement('div');
      wrapper.className = 'orb-wrapper';
      wrapper.style.width = size + 'px';
      wrapper.style.height = size + 'px';

      var inner = document.createElement('div');
      inner.className = 'orb-inner orb-state-' + state;
      if (activated) inner.classList.add('breathe');

      var ambient = document.createElement('div');
      ambient.className = 'orb-ambient';
      inner.appendChild(ambient);

      if (activated) {
        for (var r = 0; r < 3; r++) {
          var rip = document.createElement('div');
          rip.className = 'ripple';
          rip.style.animationDelay = (r * 0.35) + 's';
          inner.appendChild(rip);
        }
        var colors = ['#3ECFB8', '#7C6AEF', '#A78BFA'];
        for (var p = 0; p < 16; p++) {
          var angle = (p / 16) * Math.PI * 2;
          var dist = 60 + Math.random() * 80;
          var part = document.createElement('div');
          part.className = 'particle';
          part.style.setProperty('--px', Math.cos(angle) * dist + 'px');
          part.style.setProperty('--py', Math.sin(angle) * dist + 'px');
          part.style.animationDelay = (Math.random() * 0.3) + 's';
          part.style.background = colors[p % 3];
          part.style.boxShadow = '0 0 6px ' + colors[p % 3];
          inner.appendChild(part);
        }
      }

      var strokeColor, glowColor, orbFilter, reactStroke;
      switch (state) {
        case 'listening': strokeColor = '#3ECFB8'; glowColor = 'rgba(62,207,184,0.15)'; orbFilter = 'drop-shadow(0 0 25px rgba(62,207,184,0.45))'; break;
        case 'thinking': strokeColor = '#ffffff'; glowColor = 'rgba(255,255,255,0.12)'; orbFilter = 'drop-shadow(0 0 20px rgba(255,255,255,0.35))'; break;
        case 'speaking': strokeColor = '#34D399'; glowColor = 'rgba(52,211,153,0.15)'; orbFilter = 'drop-shadow(0 0 25px rgba(52,211,153,0.45))'; break;
        default: strokeColor = '#7C6AEF'; glowColor = 'rgba(124,106,239,0.1)'; orbFilter = 'drop-shadow(0 0 15px rgba(124,106,239,0.25))';
      }
      reactStroke = state === 'idle' ? '#ffffff' : strokeColor;
      ambient.style.background = glowColor;

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 500 500');
      svg.style.width = '100%';
      svg.style.height = '100%';
      svg.style.filter = orbFilter;
      svg.style.transition = 'filter 0.6s ease';

      var defs = document.createElementNS(svgNS, 'defs');
      function makeFilter(id, stdDev) {
        var f = document.createElementNS(svgNS, 'filter');
        f.setAttribute('id', id); f.setAttribute('x', '-20%'); f.setAttribute('y', '-20%');
        f.setAttribute('width', '140%'); f.setAttribute('height', '140%');
        var blur = document.createElementNS(svgNS, 'feGaussianBlur');
        blur.setAttribute('stdDeviation', stdDev); blur.setAttribute('result', 'b');
        f.appendChild(blur);
        var merge = document.createElementNS(svgNS, 'feMerge');
        var mn1 = document.createElementNS(svgNS, 'feMergeNode'); mn1.setAttribute('in', 'b');
        var mn2 = document.createElementNS(svgNS, 'feMergeNode'); mn2.setAttribute('in', 'SourceGraphic');
        merge.appendChild(mn1); merge.appendChild(mn2); f.appendChild(merge);
        return f;
      }
      defs.appendChild(makeFilter('og1', '12'));
      defs.appendChild(makeFilter('og2', '4'));
      var ft = makeFilter('otg', '4');
      ft.setAttribute('x', '-50%'); ft.setAttribute('y', '-50%');
      ft.setAttribute('width', '200%'); ft.setAttribute('height', '200%');
      defs.appendChild(ft);
      svg.appendChild(defs);

      var bgCircle = document.createElementNS(svgNS, 'circle');
      bgCircle.setAttribute('cx', '250'); bgCircle.setAttribute('cy', '250');
      bgCircle.setAttribute('r', '140'); bgCircle.setAttribute('fill', '#7C6AEF');
      bgCircle.setAttribute('fill-opacity', '0.03');
      svg.appendChild(bgCircle);

      var ringCCW = document.createElementNS(svgNS, 'circle');
      ringCCW.setAttribute('cx', '250'); ringCCW.setAttribute('cy', '250');
      ringCCW.setAttribute('r', '150'); ringCCW.setAttribute('fill', 'none');
      ringCCW.setAttribute('stroke', strokeColor); ringCCW.setAttribute('stroke-width', '10');
      ringCCW.setAttribute('filter', 'url(#og1)'); ringCCW.setAttribute('stroke-dasharray', '940 2');
      ringCCW.classList.add('orb-ring-ccw');
      ringCCW.style.transformOrigin = '250px 250px'; ringCCW.style.transition = 'stroke 0.6s ease';
      svg.appendChild(ringCCW);

      var ringCW = document.createElementNS(svgNS, 'circle');
      ringCW.setAttribute('cx', '250'); ringCW.setAttribute('cy', '250');
      ringCW.setAttribute('r', '125'); ringCW.setAttribute('fill', 'none');
      ringCW.setAttribute('stroke', reactStroke); ringCW.setAttribute('stroke-width', '5');
      ringCW.setAttribute('filter', 'url(#og2)'); ringCW.setAttribute('stroke-dasharray', '780 5');
      ringCW.classList.add('orb-reactor', 'orb-ring-cw');
      ringCW.style.transformOrigin = '250px 250px'; ringCW.style.transition = 'stroke 0.6s ease';
      svg.appendChild(ringCW);

      var text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', '250'); text.setAttribute('y', '262');
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', reactStroke);
      text.setAttribute('filter', 'url(#otg)'); text.classList.add('orb-reactor');
      text.style.fontFamily = '"Space Grotesk",sans-serif'; text.style.fontSize = '46px';
      text.style.fontWeight = '700'; text.style.letterSpacing = '6px';
      text.style.textTransform = 'uppercase'; text.style.userSelect = 'none';
      text.style.transformOrigin = '250px 250px'; text.style.transition = 'fill 0.6s ease';
      text.textContent = 'NALLY';
      svg.appendChild(text);

      var lineCoords = [[250,100,250,116],[250,384,250,400],[100,250,116,250],[384,250,400,250]];
      lineCoords.forEach(function(l) {
        var line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1',l[0]); line.setAttribute('y1',l[1]);
        line.setAttribute('x2',l[2]); line.setAttribute('y2',l[3]);
        line.setAttribute('stroke', strokeColor); line.setAttribute('stroke-width', '2');
        line.setAttribute('opacity', '0.6'); line.style.transition = 'stroke 0.6s ease';
        svg.appendChild(line);
      });

      inner.appendChild(svg);
      wrapper.appendChild(inner);

      // Mouse tilt
      if (!window.matchMedia('(pointer: coarse)').matches) {
        wrapper.addEventListener('mousemove', function(e) {
          var rect = wrapper.getBoundingClientRect();
          var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
          var dx = (e.clientX - cx) / (rect.width / 2);
          var dy = (e.clientY - cy) / (rect.height / 2);
          wrapper.style.transform = 'perspective(600px) rotateY(' + (Math.max(-1,Math.min(1,dx)) * 1.5) + 'deg) rotateX(' + (-Math.max(-1,Math.min(1,dy)) * 1.5) + 'deg)';
        });
        wrapper.addEventListener('mouseleave', function() {
          wrapper.style.transform = 'perspective(600px) rotateY(0deg) rotateX(0deg)';
        });
      }

      // ─── Apply state colors to SVG elements ────
      var thinkingEls = [];

      function applyColors(sc, gc, of, rs) {
        ambient.style.background = gc;
        svg.style.filter = of;
        ringCCW.setAttribute('stroke', sc);
        ringCW.setAttribute('stroke', rs);
        text.setAttribute('fill', rs);
        svg.querySelectorAll('line').forEach(function(l) { l.setAttribute('stroke', sc); });
      }

      function addThinkingElements() {
        removeThinkingElements();
        var rp = document.createElement('div');
        rp.className = 'orb-thinking-ring-pulse';
        inner.appendChild(rp);
        thinkingEls.push(rp);
        for (var i = 0; i < 2; i++) {
          var rip = document.createElement('div');
          rip.className = 'orb-thinking-ripple';
          rip.style.animationDelay = (i * 0.4) + 's';
          inner.appendChild(rip);
          thinkingEls.push(rip);
        }
      }

      function removeThinkingElements() {
        thinkingEls.forEach(function(el) { el.remove(); });
        thinkingEls = [];
      }

      // Public API
      return {
        el: wrapper,
        inner: inner,
        svg: svg,
        ambient: ambient,
        ringCW: ringCW,
        ringCCW: ringCCW,
        text: text,
        setState: function(newState) {
          state = newState;
          inner.className = 'orb-inner orb-state-' + state;
          if (activated) inner.classList.add('breathe');
          if (state === 'thinking') { addThinkingElements(); } else { removeThinkingElements(); }
          var sc, gc, of, rs;
          switch (state) {
            case 'listening': sc='#3ECFB8'; gc='rgba(62,207,184,0.15)'; of='drop-shadow(0 0 25px rgba(62,207,184,0.45))'; break;
            case 'thinking': sc='#ffffff'; gc='rgba(255,255,255,0.12)'; of='drop-shadow(0 0 20px rgba(255,255,255,0.35))'; break;
            case 'speaking': sc='#34D399'; gc='rgba(52,211,153,0.15)'; of='drop-shadow(0 0 25px rgba(52,211,153,0.45))'; break;
            default: sc='#7C6AEF'; gc='rgba(124,106,239,0.1)'; of='drop-shadow(0 0 15px rgba(124,106,239,0.25))';
          }
          rs = state === 'idle' ? '#ffffff' : sc;
          applyColors(sc, gc, of, rs);
        },
        // Pulse the Orb for a single word
        pulseWord: function(isEmphasis) {
          inner.classList.remove('word-pulse', 'emphasis-flare');
          void inner.offsetWidth; // force reflow
          inner.classList.add(isEmphasis ? 'emphasis-flare' : 'word-pulse');
        },
        // Burst particles outward
        burstParticles: function(count, color) {
          for (var i = 0; i < (count || 8); i++) {
            var angle = (i / count) * Math.PI * 2;
            var dist = 40 + Math.random() * 60;
            var part = document.createElement('div');
            part.className = 'particle';
            part.style.setProperty('--px', Math.cos(angle) * dist + 'px');
            part.style.setProperty('--py', Math.sin(angle) * dist + 'px');
            part.style.animationDelay = '0s';
            part.style.background = color || '#34D399';
            part.style.boxShadow = '0 0 8px ' + (color || '#34D399');
            inner.appendChild(part);
            (function(el) { setTimeout(function() { el.remove(); }, 1100); })(part);
          }
        }
      };
    }

    // ─── Mount Orb ───────────────────────────────
    var orb = createOrb({ size: 312, state: 'idle', activated: true });
    document.getElementById('orb-mount').appendChild(orb.el);

    // ─── Think Function ──────────────────────────
    // think("Searching files...")  — shows text, sets thinking state
    // think(null)                  — clears thought, returns to idle
    var _thinkTimers = [];
    function think(text) {
      _thinkTimers.forEach(clearTimeout);
      _thinkTimers = [];
      if (text === null || text === undefined) {
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        orb.setState('idle');
        statusEl.textContent = '';
        statusEl.style.color = 'rgba(228,226,220,0.25)';
        return;
      }
      orb.setState('thinking');
      statusEl.textContent = 'Thinking';
      statusEl.style.color = 'rgba(124,106,239,0.4)';
      thoughtContent.textContent = '';
      thoughtWrap.classList.add('visible');
      // Typewriter effect
      var i = 0;
      var typeTimer = setInterval(function() {
        if (i < text.length) {
          thoughtContent.textContent += text[i];
          i++;
        } else {
          clearInterval(typeTimer);
        }
      }, 30);
      _thinkTimers.push(typeTimer);
    }

    // ─── Simulated Speaking Engine ───────────────
    // speak("Hello! This is Nally... How are you?")
    // Pulses the Orb in sync with each word.
    // ! and ? trigger emphasis flares.
    // , and . trigger brief pauses.
    var _speakTimers = [];
    var thinkPhrases = [
      "Processing your request...",
      "Analyzing input...",
      "Connecting to server...",
      "Retrieving data...",
      "Formulating response...",
      "Almost ready...",
    ];
    function speak(text) {
      _speakTimers.forEach(clearTimeout);
      _speakTimers = [];

      // Thinking phase with real-time thought
      var phrase = thinkPhrases[Math.floor(Math.random() * thinkPhrases.length)];
      think(phrase);

      var thinkTime = 600 + Math.random() * 600;
      var t = setTimeout(function() {
        // Clear thought, switch to speaking
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        orb.setState('speaking');
        statusEl.textContent = 'Speaking';
        statusEl.style.color = 'rgba(52,211,153,0.5)';

        // Split into tokens: words + punctuation
        var tokens = text.match(/[\w']+|[^\w\s]|\s+/g) || [];
        var delay = 0;

        for (var i = 0; i < tokens.length; i++) {
          var token = tokens[i];
          var isWord = /[\w']/.test(token);
          var isEmphasis = /[!?]/.test(token);
          var isPause = /[.,;:]/.test(token);
          var isSpace = /^\s+$/.test(token);

          if (isWord) {
            (function(w, d, emph) {
              var timer = setTimeout(function() {
                orb.pulseWord(emph);
                // Burst particles on emphasis words
                if (emph) orb.burstParticles(6, '#34D399');
              }, d);
              _speakTimers.push(timer);
            })(token, delay, isEmphasis);
            // Word duration: ~180ms base, longer for long words
            delay += Math.max(120, token.length * 45);
          } else if (isEmphasis) {
            // Emphasis punctuation: extra pause + flare
            (function(d) {
              var timer = setTimeout(function() {
                orb.pulseWord(true);
                orb.burstParticles(10, '#34D399');
              }, d);
              _speakTimers.push(timer);
            })(delay);
            delay += 300;
          } else if (isPause) {
            delay += 200; // comma/period pause
          } else if (isSpace) {
            delay += 30; // tiny gap between words
          }
        }

        // Done speaking
        var doneTimer = setTimeout(function() {
          orb.setState('idle');
          statusEl.textContent = '';
          statusEl.style.color = 'rgba(228,226,220,0.25)';
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
        }, delay + 200);
        _speakTimers.push(doneTimer);
      }, thinkTime);
      _speakTimers.push(t);
    }

    // ─── Chat Drawer (Desktop Window) ─────────────
    var chatDrawer = document.getElementById('chat-drawer');
    var chatMessages = document.getElementById('chat-messages');
    var chatInput = document.getElementById('chat-input');
    var titlebar = document.getElementById('drawer-titlebar');
    var drawerOpen = false;
    var isMaximized = false;
    var savedBounds = null;

    function toggleDrawer() {
      drawerOpen = !drawerOpen;
      chatDrawer.classList.toggle('open', drawerOpen);
      if (drawerOpen) {
        chatDrawer.style.top = '50%';
        chatDrawer.style.left = '50%';
        chatDrawer.style.transform = 'translate(-50%, -50%)';
        setTimeout(function() { chatInput.focus(); }, 300);
      }
    }
    function closeDrawer() {
      drawerOpen = false;
      chatDrawer.classList.remove('open', 'maximized');
      isMaximized = false;
    }
    function minimizeDrawer() {
      chatDrawer.classList.remove('open');
      drawerOpen = false;
    }
    function maximizeDrawer() {
      if (isMaximized) {
        chatDrawer.classList.remove('maximized');
        if (savedBounds) {
          chatDrawer.style.top = savedBounds.top;
          chatDrawer.style.left = savedBounds.left;
          chatDrawer.style.width = savedBounds.width;
          chatDrawer.style.height = savedBounds.height;
          chatDrawer.style.transform = 'none';
        }
        isMaximized = false;
      } else {
        savedBounds = {
          top: chatDrawer.style.top || '50%',
          left: chatDrawer.style.left || '50%',
          width: chatDrawer.style.width || '560px',
          height: chatDrawer.style.height || '480px',
        };
        chatDrawer.classList.add('maximized');
        isMaximized = true;
      }
    }

    // Double-click title bar to maximize/restore
    titlebar.addEventListener('dblclick', function(e) {
      if (e.target.classList.contains('dot')) return;
      maximizeDrawer();
    });

    // ─── Drag ─────────────────────────────────────
    var dragState = { active: false, offsetX: 0, offsetY: 0 };

    titlebar.addEventListener('mousedown', function(e) {
      if (e.target.classList.contains('dot')) return;
      if (isMaximized) return;
      dragState.active = true;
      var rect = chatDrawer.getBoundingClientRect();
      dragState.offsetX = e.clientX - rect.left;
      dragState.offsetY = e.clientY - rect.top;
      chatDrawer.style.transform = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragState.active) return;
      var x = e.clientX - dragState.offsetX;
      var y = e.clientY - dragState.offsetY;
      chatDrawer.style.left = x + 'px';
      chatDrawer.style.top = y + 'px';
    });

    document.addEventListener('mouseup', function() {
      dragState.active = false;
    });

    // ─── Resize ───────────────────────────────────
    var resizeState = { active: false, dir: '', startX: 0, startY: 0, startW: 0, startH: 0, startL: 0, startT: 0 };

    document.querySelectorAll('.resize-handle').forEach(function(handle) {
      handle.addEventListener('mousedown', function(e) {
        if (isMaximized) return;
        e.preventDefault();
        e.stopPropagation();
        var rect = chatDrawer.getBoundingClientRect();
        resizeState.active = true;
        resizeState.dir = handle.dataset.dir;
        resizeState.startX = e.clientX;
        resizeState.startY = e.clientY;
        resizeState.startW = rect.width;
        resizeState.startH = rect.height;
        resizeState.startL = rect.left;
        resizeState.startT = rect.top;
        chatDrawer.style.transform = 'none';
      });
    });

    document.addEventListener('mousemove', function(e) {
      if (!resizeState.active) return;
      var dx = e.clientX - resizeState.startX;
      var dy = e.clientY - resizeState.startY;
      var dir = resizeState.dir;
      var minW = 320, minH = 260;
      var newW = resizeState.startW, newH = resizeState.startH;
      var newL = resizeState.startL, newT = resizeState.startT;

      if (dir.includes('e')) newW = Math.max(minW, resizeState.startW + dx);
      if (dir.includes('w')) { newW = Math.max(minW, resizeState.startW - dx); newL = resizeState.startL + (resizeState.startW - newW); }
      if (dir.includes('s')) newH = Math.max(minH, resizeState.startH + dy);
      if (dir.includes('n')) { newH = Math.max(minH, resizeState.startH - dy); newT = resizeState.startT + (resizeState.startH - newH); }

      chatDrawer.style.width = newW + 'px';
      chatDrawer.style.height = newH + 'px';
      chatDrawer.style.left = newL + 'px';
      chatDrawer.style.top = newT + 'px';
    });

    document.addEventListener('mouseup', function() {
      resizeState.active = false;
    });

    // ─── Chat Logic ───────────────────────────────
    function addChatMsg(text, isNally) {
      var msg = document.createElement('div');
      msg.className = 'drawer-msg ' + (isNally ? 'nally' : 'user');
      if (isNally) {
        var label = document.createElement('div');
        label.className = 'msg-label';
        label.textContent = 'NALLY';
        msg.appendChild(label);
      }
      var body = document.createElement('div');
      body.textContent = text;
      msg.appendChild(body);
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    var responses = [
      "I hear you. Let me think about that.",
      "Interesting. Give me a moment.",
      "On it. Processing your request now.",
      "Got it. I'll look into that for you.",
      "Roger that. Working on it.",
    ];

    function sendChat() {
      var text = chatInput.value.trim();
      if (!text) return;
      addChatMsg(text, false);
      chatInput.value = '';

      var phrase = thinkPhrases[Math.floor(Math.random() * thinkPhrases.length)];
      think(phrase);

      setTimeout(function() {
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        var reply = responses[Math.floor(Math.random() * responses.length)];
        addChatMsg(reply, true);
        speak(reply);
      }, 1200 + Math.random() * 800);
    }

    // Orb click toggles drawer
    orb.el.addEventListener('click', function() {
      toggleDrawer();
    });

    // Escape to close
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && drawerOpen) closeDrawer();
    });

    // ─── Uptime Counter ──────────────────────────
    var startTime = Date.now();
    setInterval(function() {
      var elapsed = Math.floor((Date.now() - startTime) / 1000);
      var m = Math.floor(elapsed / 60);
      var h = Math.floor(m / 60);
      var s = elapsed % 60;
      var el = document.getElementById('dash-uptime');
      if (el) {
        el.textContent = h > 0 ? h + 'h ' + (m % 60) + 'm' : m + 'm ' + s + 's';
      }
    }, 1000);

    // ─── Init Lucide Icons ───────────────────────
    lucide.createIcons();
  </script>
</body>
</html>

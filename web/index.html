<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.A.L.L.Y</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark-dimmed.min.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/orb.css">
  <link rel="stylesheet" href="/static/css/drawer.css">
  <link rel="stylesheet" href="/static/css/toolcards.css">
  <link rel="stylesheet" href="/static/css/mobile.css">
  <link rel="stylesheet" href="/static/css/settings.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/diff.css">
  <link rel="stylesheet" href="/static/css/trace.css">
  <link rel="stylesheet" href="/static/css/command.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <script src="/static/marked.min.js"></script>
  <script src="/static/purify.min.js"></script>
  <script src="/static/nally-ws.js"></script>
</head>
<body>
  <!-- Command Palette -->
  <div class="cmd-overlay" id="command-palette">
    <div class="cmd-palette">
      <div class="cmd-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="cmd-input" id="cmd-input" placeholder="Search or type a command..." autofocus>
      </div>
      <div class="cmd-results" id="cmd-results"></div>
      <div class="cmd-hint">
        <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
        <span><kbd>Enter</kbd> select</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- Login Overlay -->
  <div id="login-overlay">
    <div class="login-glow"></div>
    <div class="login-box">
      <h2>N.A.L.L.Y</h2>
      <div class="login-version">v1.1.0</div>
      <input type="password" id="login-token-input" placeholder="Access token" autofocus>
      <button>Connect</button>
      <div class="login-err" id="login-err">Invalid token</div>
    </div>
    <div class="login-hint">Press <kbd>Enter</kbd> to connect</div>
  </div>

  <!-- Root (Orb + Status + Thought) -->
  <div id="root">
    <div id="orb-mount"></div>
    <div id="status-text"></div>
    <div id="thought-wrap">
      <button id="thought-toggle"><span class="chevron">&#9660;</span> thought</button>
      <div id="thought-content"></div>
    </div>
  </div>

  <!-- Chat Drawer -->
  <div id="chat-drawer">
    <div class="drawer-titlebar" id="drawer-titlebar">
      <button class="mobile-back" id="mobile-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="titlebar-dots">
        <span class="dot dot-close"></span>
        <span class="dot dot-min"></span>
        <span class="dot dot-max"></span>
      </div>
      <div class="titlebar-label">N.A.L.L.Y</div>
      <div class="titlebar-spacer"></div>
      <button class="titlebar-clear" title="Clear chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
    </div>
    <div class="drawer-messages" id="chat-messages"></div>
    <div class="drawer-input-wrap">
      <textarea class="drawer-input" id="chat-input" rows="1" placeholder="Ask Nally anything..."></textarea>
      <button class="drawer-mic" id="mic-btn" title="Toggle voice input"><i data-lucide="mic"></i></button>
      <button class="drawer-send"><i data-lucide="send"></i></button>
    </div>
    <div class="resize-handle resize-n" data-dir="n"></div>
    <div class="resize-handle resize-s" data-dir="s"></div>
    <div class="resize-handle resize-e" data-dir="e"></div>
    <div class="resize-handle resize-w" data-dir="w"></div>
    <div class="resize-handle resize-ne" data-dir="ne"></div>
    <div class="resize-handle resize-nw" data-dir="nw"></div>
    <div class="resize-handle resize-se" data-dir="se"></div>
    <div class="resize-handle resize-sw" data-dir="sw"></div>
  </div>

  <!-- Diff Viewer Panel -->
  <div id="diff-panel">
    <div class="diff-header">
      <div class="diff-header-left">
        <div class="diff-header-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 12h14"/></svg></div>
        <span class="diff-header-title">File Diff</span>
        <span class="diff-header-file" id="diff-file"></span>
      </div>
      <button class="diff-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="diff-body" id="diff-body"></div>
    <div class="diff-footer">
      <div class="diff-stats" id="diff-stats"></div>
      <button class="diff-minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
  </div>

  <!-- Settings Overlay + Dropdown -->
  <div class="settings-overlay" id="settings-overlay"></div>
  <div class="settings-dropdown" id="settings-dropdown">
    <div class="settings-section open" data-section="mcp">
      <div class="settings-head">
        <span class="settings-head-title">MCP / Plugins</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body"><div class="svc-grid" id="svc-grid"></div></div>
    </div>
    <div class="settings-section" data-section="theme">
      <div class="settings-head">
        <span class="settings-head-title">Themes / Appearance</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Theme</span>
          <div class="theme-swatches">
            <button class="theme-swatch active" data-theme="midnight" style="background:#7C6AEF" title="Midnight"></button>
            <button class="theme-swatch" data-theme="emerald" style="background:#34D399" title="Emerald"></button>
            <button class="theme-swatch" data-theme="crimson" style="background:#EF4444" title="Crimson"></button>
            <button class="theme-swatch" data-theme="ocean" style="background:#38BDF8" title="Ocean"></button>
            <button class="theme-swatch" data-theme="gold" style="background:#F59E0B" title="Gold"></button>
          </div>
        </div>
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Compact</span>
          <label class="settings-toggle">
            <input type="checkbox" id="compact-toggle">
            <span class="settings-toggle-track"></span>
          </label>
        </div>
      </div>
    </div>
    <div class="settings-section" data-section="api">
      <div class="settings-head">
        <span class="settings-head-title">API</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Provider</span>
          <span class="settings-dropdown-value">opencode</span>
        </div>
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Model</span>
          <span class="settings-dropdown-value">mimo-v2.5-free</span>
        </div>
      </div>
    </div>
    <div class="settings-section" data-section="emergency">
      <div class="settings-head">
        <span class="settings-head-title">Emergency</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <button class="settings-emergency-btn">Stop All Operations</button>
      </div>
    </div>
    <div class="settings-section" data-section="lock">
      <div class="settings-head">
        <span class="settings-head-title">Lock Mode</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row lock-row">
          <span class="settings-dropdown-label">Lock UI</span>
          <label class="settings-toggle">
            <input type="checkbox" id="lock-toggle">
            <span class="settings-toggle-track"></span>
          </label>
        </div>
      </div>
    </div>
    <div class="settings-section" data-section="about">
      <div class="settings-head">
        <span class="settings-head-title">About</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Backend</span>
          <span class="settings-dropdown-value" id="settings-backend-status">...</span>
        </div>
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Uptime</span>
          <span class="settings-dropdown-value" id="settings-uptime">0m</span>
        </div>
      </div>
    </div>
    <div class="settings-dropdown-credit">Clinton · Klyntech</div>
  </div>

  <!-- Auth Modal -->
  <div class="auth-modal-overlay" id="auth-modal-overlay">
    <div class="auth-modal" id="auth-modal">
      <div class="auth-modal-icon" id="auth-modal-icon"></div>
      <div class="auth-modal-title" id="auth-modal-title"></div>
      <div class="auth-modal-sub" id="auth-modal-sub"></div>
      <div class="auth-modal-spinner" id="auth-modal-spinner"></div>
      <div class="auth-modal-success" id="auth-modal-success">&#10003;</div>
      <div id="auth-modal-body"></div>
    </div>
  </div>

  <!-- Settings Icons -->
  <div class="mobile-settings"><i data-lucide="settings"></i></div>
  <div class="desktop-settings"><i data-lucide="settings"></i></div>

  <!-- JS Modules (order matters: deps first) -->
  <script src="/static/js/config.js"></script>
  <script src="/static/js/state.js"></script>
  <script src="/static/js/dom.js"></script>
  <script src="/static/js/markdown.js"></script>
  <script src="/static/js/orb.js"></script>
  <script src="/static/js/think.js"></script>
  <script src="/static/js/drawer.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/toolcards.js"></script>
  <script src="/static/js/diff.js"></script>
  <script src="/static/js/trace.js"></script>
  <script src="/static/js/services.js"></script>
  <script src="/static/js/authmodal.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/sse.js"></script>
  <script src="/static/js/websocket.js"></script>
  <script src="/static/js/voice.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/command.js"></script>
  <script src="/static/js/hotkeys.js"></script>
  <script src="/static/js/sync.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>

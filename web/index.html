<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.A.L.L.Y</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/static/marked.min.js"></script>
  <script src="/static/purify.min.js"></script>
  <script src="/static/nally-ws.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* ─── Themes ──────────────────────────────── */
    :root {
      --teal: #3ECFB8;
      --green: #34D399;
    }
    body, body.theme-midnight {
      --iris: #7C6AEF;
      --iris-glow: rgba(124,106,239,0.35);
      --bg: #0a0a0a;
      --orb-speed: 4s;
      --orb-glow-a: rgba(124,106,239,0.2);
      --orb-glow-b: rgba(124,106,239,0.4);
    }
    body.theme-emerald {
      --iris: #34D399;
      --iris-glow: rgba(52,211,153,0.35);
      --bg: #080f0a;
      --orb-speed: 2s;
      --orb-glow-a: rgba(52,211,153,0.2);
      --orb-glow-b: rgba(52,211,153,0.4);
    }
    body.theme-crimson {
      --iris: #EF4444;
      --iris-glow: rgba(239,68,68,0.35);
      --bg: #0f0a0a;
      --orb-speed: 3s;
      --orb-glow-a: rgba(239,68,68,0.2);
      --orb-glow-b: rgba(239,68,68,0.4);
    }
    body.theme-ocean {
      --iris: #38BDF8;
      --iris-glow: rgba(56,189,248,0.35);
      --bg: #0a0a0f;
      --orb-speed: 5s;
      --orb-glow-a: rgba(56,189,248,0.2);
      --orb-glow-b: rgba(56,189,248,0.4);
    }
    body.theme-gold {
      --iris: #F59E0B;
      --iris-glow: rgba(245,158,11,0.35);
      --bg: #0f0d0a;
      --orb-speed: 3.5s;
      --orb-glow-a: rgba(245,158,11,0.2);
      --orb-glow-b: rgba(245,158,11,0.4);
    }

    html, body { background: var(--bg); height: 100%; width: 100%; overflow: hidden; font-family: 'Space Grotesk', sans-serif; transition: background 0.4s ease; }
    #root { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 40px; }

    /* ─── Orb Keyframes ─────────────────────────── */
    @keyframes orbSpinCW {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg) scale(1.02); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbSpinCCW {
      0% { transform: rotate(360deg); }
      50% { transform: rotate(180deg) scale(0.98); }
      100% { transform: rotate(0deg); }
    }
    @keyframes orbCorePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px var(--iris-glow)) drop-shadow(0 0 35px var(--orb-glow-a)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 35px var(--iris-glow)) drop-shadow(0 0 60px var(--orb-glow-b)); }
    }
    @keyframes orbAmbientPulse {
      0%, 100% { transform: scale(0.88); opacity: 0.3; filter: blur(55px) saturate(1.2); }
      50% { transform: scale(1.15); opacity: 0.75; filter: blur(40px) saturate(1.8); }
    }
    @keyframes orbListening {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(62,207,184,0.5)) drop-shadow(0 0 50px rgba(62,207,184,0.25)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 50px rgba(62,207,184,0.85)) drop-shadow(0 0 90px rgba(62,207,184,0.4)); }
    }
    @keyframes orbThinkingPulse {
      0%   { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
      8%   { transform: scale(1.07); filter: drop-shadow(0 0 35px var(--iris-glow)) drop-shadow(0 0 60px var(--orb-glow-a)); }
      18%  { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
      26%  { transform: scale(1.1); filter: drop-shadow(0 0 45px var(--iris-glow)) drop-shadow(0 0 80px var(--orb-glow-b)); }
      40%  { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
    }
    @keyframes orbThinkingRingPulse {
      0%   { opacity: 0; transform: scale(1); }
      10%  { opacity: 0.6; transform: scale(1.05); }
      40%  { opacity: 0; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(1); }
    }
    @keyframes orbThinkingRipple {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.5; border-color: var(--iris-glow); }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; border-color: var(--orb-glow-a); }
    }
    @keyframes orbSpeaking {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)) drop-shadow(0 0 50px rgba(52,211,153,0.35)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 45px rgba(52,211,153,0.9)) drop-shadow(0 0 80px rgba(52,211,153,0.55)); }
    }
    @keyframes orbBreathe {
      0%   { transform: scale(0.3); opacity: 0; filter: blur(20px) brightness(0.3); }
      25%  { transform: scale(0.6); opacity: 0.5; filter: blur(8px) brightness(0.7); }
      50%  { transform: scale(0.9); opacity: 0.9; filter: blur(2px) brightness(1.1); }
      70%  { transform: scale(1.08); opacity: 1; filter: blur(0px) brightness(1.3); }
      85%  { transform: scale(0.96); opacity: 1; filter: blur(0px) brightness(1); }
      100% { transform: scale(1); opacity: 1; filter: blur(0px) brightness(1); }
    }
    @keyframes rippleExpand {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
      100% { transform: translate(-50%, -50%) scale(4); opacity: 0; border-width: 1px; }
    }
    @keyframes particleFly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
    }
    @keyframes wordPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes emphasisFlare {
      0% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)); }
      30% { transform: scale(1.15); filter: drop-shadow(0 0 60px rgba(52,211,153,1)) drop-shadow(0 0 100px rgba(52,211,153,0.6)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)); }
    }

    /* ─── Orb Classes ───────────────────────────── */
    .orb-wrapper {
      position: relative;
      width: 312px; height: 312px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
    }
    .orb-inner {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s ease-out;
    }
    .orb-inner.breathe { animation: orbBreathe 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .orb-inner.word-pulse { animation: wordPulse 0.25s ease-out; }
    .orb-inner.emphasis-flare { animation: emphasisFlare 0.4s ease-out; }
    .orb-ambient {
      position: absolute;
      width: 470px; height: 470px;
      border-radius: 50%;
      background: var(--iris-glow);
      filter: blur(40px);
      pointer-events: none;
      transition: all 0.6s ease;
      animation: orbAmbientPulse 8s ease-in-out infinite;
    }
    .orb-ring-cw { animation: orbSpinCW 55s linear infinite; transform-origin: 250px 250px; }
    .orb-ring-ccw { animation: orbSpinCCW 60s linear infinite; transform-origin: 250px 250px; }
    .orb-reactor { animation: orbCorePulse var(--orb-speed) ease-in-out infinite; transform-origin: 250px 250px; }

    /* State: listening */
    .orb-state-listening .orb-reactor { animation: orbListening 1.5s ease-in-out infinite; }
    .orb-state-listening .orb-ring-cw { animation-duration: 8s; }
    .orb-state-listening .orb-ring-ccw { animation-duration: 10s; }
    /* State: thinking */
    .orb-state-thinking .orb-ring-cw { animation: orbSpinCW 2.5s linear infinite; }
    .orb-state-thinking .orb-ring-ccw { animation: orbSpinCCW 3s linear infinite reverse; }
    .orb-state-thinking .orb-reactor { animation: orbThinkingPulse 1.2s ease-in-out infinite; }
    .orb-thinking-ring-pulse {
      position: absolute; top: 50%; left: 50%;
      width: 312px; height: 312px; border-radius: 50%;
      border: 2px solid rgba(124,106,239,0.4);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none; opacity: 0;
      animation: orbThinkingRingPulse 1.2s ease-out infinite;
    }
    .orb-thinking-ripple {
      position: absolute; top: 50%; left: 50%;
      width: 120px; height: 120px; border-radius: 50%;
      border: 1.5px solid rgba(124,106,239,0.5);
      pointer-events: none;
      animation: orbThinkingRipple 1.2s ease-out infinite;
    }
    /* State: speaking */
    .orb-state-speaking .orb-reactor { animation: orbSpeaking 2s ease-in-out infinite; }
    .orb-state-speaking .orb-ring-cw { animation-duration: 20s; }
    .orb-state-speaking .orb-ring-ccw { animation-duration: 25s; }

    /* Ripple */
    .ripple {
      position: absolute;
      top: 50%; left: 50%;
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(124,106,239,0.45);
      pointer-events: none;
      animation: rippleExpand 1.5s ease-out forwards;
    }
    /* Particle */
    .particle {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFly 1s ease-out forwards;
    }

    /* ─── Status text ───────────────────────────── */
    #status-text {
      font-size: 13px;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(228,226,220,0.25);
      transition: all 0.4s ease;
      min-height: 20px;
    }
    #thought-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #thought-wrap.visible { opacity: 1; }
    #thought-wrap.collapsed #thought-content { max-height: 0; opacity: 0; padding: 0; margin: 0; overflow: hidden; }
    #thought-toggle {
      background: none; border: none; cursor: pointer;
      color: rgba(124,106,239,0.35);
      font-size: 11px; letter-spacing: 1px;
      font-family: 'Space Grotesk', sans-serif;
      display: flex; align-items: center; gap: 4px;
      transition: color 0.3s ease;
      padding: 2px 8px;
    }
    #thought-toggle:hover { color: rgba(124,106,239,0.7); }
    #thought-toggle .chevron {
      display: inline-block;
      transition: transform 0.3s ease;
      font-size: 10px;
    }
    #thought-wrap.collapsed #thought-toggle .chevron { transform: rotate(-90deg); }
    #thought-content {
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-style: italic;
      letter-spacing: 1px;
      color: rgba(124,106,239,0.55);
      text-align: center;
      max-width: 400px;
      min-height: 20px;
      max-height: 40px;
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      opacity: 1;
      padding: 2px 0;
    }



    /* ─── Chat Drawer (Desktop Window) ────────────── */
    #chat-drawer {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
      height: 480px;
      min-width: 320px;
      min-height: 260px;
      background: rgba(12,12,18,0.94);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    #chat-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }
    #chat-drawer.maximized {
      top: 0; left: 0;
      transform: none;
      width: 100vw !important;
      height: calc(100vh - 48px) !important;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* Title bar */
    .drawer-titlebar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 38px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    .drawer-titlebar:active { cursor: grabbing; }
    .titlebar-dots {
      display: flex;
      gap: 7px;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.15s ease;
    }
    .dot:hover { filter: brightness(1.3); transform: scale(1.15); }
    .dot-close { background: #ff5f57; }
    .dot-min { background: #febc2e; }
    .dot-max { background: #28c840; }
    .titlebar-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(228,226,220,0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .titlebar-spacer { width: auto; flex: 1; }
    .titlebar-clear {
      background: none; border: none; cursor: pointer;
      color: rgba(228,226,220,0.3); padding: 4px; border-radius: 4px;
      display: flex; align-items: center; transition: color 0.2s;
    }
    .titlebar-clear:hover { color: rgba(228,226,220,0.7); }

    /* Messages area */
    .drawer-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .drawer-messages::-webkit-scrollbar { width: 4px; }
    .drawer-messages::-webkit-scrollbar-track { background: transparent; }
    .drawer-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    /* ─── Chat Bubbles (Claude-style) ──────────── */
    .drawer-msg {
      padding: 12px 0;
      max-width: 100%;
      animation-duration: 0.35s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      animation-fill-mode: both;
    }
    .drawer-msg + .drawer-msg {
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .drawer-msg.user {
      animation-name: slideInRight;
      text-align: right;
    }
    .drawer-msg.nally {
      animation-name: slideInLeft;
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .drawer-msg.nally .msg-name {
      color: var(--iris);
      opacity: 0.5;
    }
    .msg-text {
      font-size: 14px;
      line-height: 1.7;
      color: rgba(228,226,220,0.8);
      word-wrap: break-word;
    }
    .drawer-msg.user .msg-text {
      color: rgba(228,226,220,0.65);
    }
    /* Markdown: headings */
    .msg-text h1, .msg-text h2, .msg-text h3, .msg-text h4 {
      color: rgba(228,226,220,0.95);
      font-weight: 600;
      margin: 14px 0 6px;
      line-height: 1.3;
    }
    .msg-text h1 { font-size: 18px; }
    .msg-text h2 { font-size: 16px; }
    .msg-text h3 { font-size: 15px; }
    .msg-text h4 { font-size: 14px; }
    /* Markdown: paragraphs */
    .msg-text p { margin: 6px 0; }
    /* Markdown: inline code */
    .msg-text code {
      background: rgba(124,106,239,0.12);
      color: rgba(167,139,250,0.9);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 13px;
      border: 1px solid rgba(124,106,239,0.15);
    }
    /* Markdown: code blocks */
    .msg-text pre {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 14px 16px;
      margin: 10px 0;
      overflow-x: auto;
      position: relative;
    }
    .msg-text pre code {
      background: none;
      border: none;
      padding: 0;
      color: rgba(228,226,220,0.85);
      font-size: 13px;
      line-height: 1.5;
    }
    /* highlight.js overrides to match dark theme */
    .msg-text pre code.hljs {
      background: none;
      padding: 0;
    }
    .msg-text pre .hljs-keyword { color: #c678dd; }
    .msg-text pre .hljs-string { color: #98c379; }
    .msg-text pre .hljs-number { color: #d19a66; }
    .msg-text pre .hljs-comment { color: #5c6370; font-style: italic; }
    .msg-text pre .hljs-function { color: #61afef; }
    .msg-text pre .hljs-title { color: #61afef; }
    .msg-text pre .hljs-built_in { color: #e5c07b; }
    .msg-text pre .hljs-type { color: #e5c07b; }
    .msg-text pre .hljs-attr { color: #d19a66; }
    .msg-text pre .hljs-variable { color: #e06c75; }
    .msg-text pre .hljs-params { color: #e06c75; }
    .msg-text pre .hljs-meta { color: #56b6c2; }
    .msg-text pre .hljs-selector-class { color: #e5c07b; }
    .msg-text pre .hljs-selector-tag { color: #e06c75; }
    .msg-text pre .hljs-addition { color: #98c379; background: rgba(152,195,121,0.1); }
    .msg-text pre .hljs-deletion { color: #e06c75; background: rgba(224,108,117,0.1); }
    .msg-text strong {
      color: rgba(228,226,220,0.95);
      font-weight: 600;
    }
    .msg-text em {
      color: rgba(228,226,220,0.7);
      font-style: italic;
    }
    .msg-text del {
      color: rgba(228,226,220,0.4);
      text-decoration: line-through;
    }
    .msg-text a {
      color: var(--iris);
      text-decoration: none;
      border-bottom: 1px solid rgba(124,106,239,0.3);
      transition: border-color 0.2s ease;
    }
    .msg-text a:hover {
      border-color: var(--iris);
    }
    /* Markdown: blockquote */
    .msg-text blockquote {
      border-left: 3px solid var(--iris);
      margin: 8px 0;
      padding: 6px 14px;
      background: rgba(124,106,239,0.06);
      border-radius: 0 6px 6px 0;
      color: rgba(228,226,220,0.65);
    }
    /* Markdown: lists */
    .msg-text ul, .msg-text ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .msg-text li {
      margin: 3px 0;
    }
    .msg-text li input[type="checkbox"] {
      margin-right: 6px;
      accent-color: var(--iris);
    }
    /* Markdown: horizontal rule */
    .msg-text hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 12px 0;
    }
    /* Markdown: tables */
    .msg-text table {
      border-collapse: collapse;
      margin: 10px 0;
      width: 100%;
      font-size: 13px;
      display: table;
    }
    .msg-text .table-wrap {
      overflow-x: auto;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .msg-text th, .msg-text td {
      padding: 7px 10px;
      text-align: left;
      white-space: nowrap;
    }
    .msg-text thead { border-bottom: 1px solid rgba(255,255,255,0.1); }
    .msg-text th {
      color: rgba(228,226,220,0.5);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .msg-text td {
      color: rgba(228,226,220,0.85);
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .msg-text tr:hover td {
      background: rgba(255,255,255,0.02);
    }

    /* Compact mode */
    body.compact .drawer-messages { padding: 8px 10px; }
    body.compact .msg-text { font-size: 12px; line-height: 1.5; }
    body.compact .msg-text pre { padding: 8px 10px; margin: 6px 0; }
    body.compact .msg-text pre code { font-size: 11px; }
    body.compact .msg-text code { font-size: 11px; padding: 1px 4px; }
    body.compact .msg-text h1 { font-size: 15px; }
    body.compact .msg-text h2 { font-size: 14px; }
    body.compact .msg-text h3 { font-size: 13px; }
    body.compact .tool-card { margin: 4px 0; }
    body.compact .tool-card-header { padding: 6px 10px; }
    body.compact .tool-card-summary { font-size: 12px; }
    body.compact .tool-card-code { font-size: 11px; padding: 6px 8px; }
    body.compact .drawer-input { padding: 8px 12px; font-size: 13px; min-height: 36px; }

    /* Lock mode — disable interactive elements */
    body.lock-mode .drawer-input { pointer-events: none; opacity: 0.4; }
    body.lock-mode .drawer-send { pointer-events: none; opacity: 0.4; }
    body.lock-mode .settings-overlay { pointer-events: auto; }
    body.lock-mode .settings-dropdown-row:not(.lock-row) { pointer-events: none; opacity: 0.4; }
    body.lock-mode .mobile-settings { pointer-events: none; opacity: 0.4; }
    body.lock-mode .desktop-settings { pointer-events: none; opacity: 0.4; }

    /* Copy button */
    .msg-copy {
      opacity: 0;
      background: none; border: none; cursor: pointer;
      color: rgba(228,226,220,0.2);
      padding: 4px;
      border-radius: 4px;
      transition: opacity 0.2s, color 0.2s, background 0.2s;
      display: inline-flex; align-items: center;
      margin-top: 6px;
    }
    .msg-copy svg { width: 14px; height: 14px; }
    .drawer-msg:hover .msg-copy { opacity: 1; }
    .msg-copy:hover { color: rgba(228,226,220,0.6); background: rgba(255,255,255,0.05); }

    /* Typing indicator — waveform */
    .typing-indicator {
      padding: 10px 0;
      animation: slideInLeft 0.3s ease-out;
    }
    .typing-indicator + .drawer-msg {
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .typing-wave {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      height: 24px;
      padding: 0 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px 14px 14px 4px;
    }
    .typing-bar {
      width: 3px;
      border-radius: 2px;
      background: rgba(124,106,239,0.55);
      animation: waveBar 1s ease-in-out infinite;
    }
    .typing-bar:nth-child(1) { animation-delay: 0s; height: 8px; }
    .typing-bar:nth-child(2) { animation-delay: 0.1s; height: 14px; }
    .typing-bar:nth-child(3) { animation-delay: 0.2s; height: 6px; }
    .typing-bar:nth-child(4) { animation-delay: 0.15s; height: 18px; }
    .typing-bar:nth-child(5) { animation-delay: 0.05s; height: 10px; }
    @keyframes waveBar {
      0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* Input area */
    .drawer-input-wrap {
      display: flex;
      gap: 10px;
      padding: 14px 16px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .drawer-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 16px;
      color: rgba(228,226,220,0.9);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
      resize: none;
      max-height: 100px;
      min-height: 42px;
      line-height: 1.4;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .drawer-input::-webkit-scrollbar { display: none; }
    .drawer-input:focus { border-color: var(--iris-glow); }
    .drawer-input::placeholder { color: rgba(228,226,220,0.2); }
    .drawer-send {
      background: var(--iris);
      border: none;
      border-radius: 10px;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--iris-glow), 0 2px 4px rgba(0,0,0,0.3);
    }
    .drawer-send svg { width: 18px; height: 18px; }
    .drawer-send:hover { filter: brightness(1.15); transform: scale(1.08); box-shadow: 0 6px 20px var(--iris-glow), 0 3px 6px rgba(0,0,0,0.4); }

    /* Resize handles */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }
    .resize-n  { top: -4px; left: 8px; right: 8px; height: 8px; cursor: n-resize; }
    .resize-s  { bottom: -4px; left: 8px; right: 8px; height: 8px; cursor: s-resize; }
    .resize-e  { right: -4px; top: 8px; bottom: 8px; width: 8px; cursor: e-resize; }
    .resize-w  { left: -4px; top: 8px; bottom: 8px; width: 8px; cursor: w-resize; }
    .resize-ne { top: -4px; right: -4px; width: 14px; height: 14px; cursor: ne-resize; }
    .resize-nw { top: -4px; left: -4px; width: 14px; height: 14px; cursor: nw-resize; }
    .resize-se { bottom: -4px; right: -4px; width: 14px; height: 14px; cursor: se-resize; }
    .resize-sw { bottom: -4px; left: -4px; width: 14px; height: 14px; cursor: sw-resize; }

    /* Tool cards — v2 */
    /* ─── Tool Card (Claude.ai style) ───────────── */
    .tool-card {
      margin: 8px 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      overflow: hidden;
      animation: slideInLeft 0.25s ease-out;
      max-width: 100%;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .tool-card.running { border-color: rgba(124,106,239,0.2); }
    .tool-card.success { border-color: rgba(52,211,153,0.15); }
    .tool-card.error   { border-color: rgba(239,68,68,0.2); }
    .tool-card.pending { border-color: rgba(251,191,36,0.2); }

    .tool-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .tool-card-header:hover { background: rgba(255,255,255,0.03); }

    .tool-card-label {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .tool-card-summary {
      font-size: 13px;
      color: rgba(228,226,220,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .tool-card-name {
      font-size: 11px;
      color: rgba(228,226,220,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-card-status {
      width: 18px; height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tool-card-spinner {
      display: block;
      width: 14px; height: 14px;
      border: 1.5px solid rgba(124,106,239,0.15);
      border-top-color: var(--iris);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tool-card-check {
      color: var(--green);
    }
    .tool-card-check svg { width: 16px; height: 16px; }

    .tool-card-chevron {
      width: 16px; height: 16px;
      color: rgba(228,226,220,0.2);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .tool-card.expanded .tool-card-chevron { transform: rotate(90deg); }

    /* Body — smooth grid animation */
    .tool-card-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }
    .tool-card.expanded .tool-card-body {
      grid-template-rows: 1fr;
    }
    .tool-card-body-inner {
      overflow: hidden;
    }

    .tool-card-detail {
      padding: 0 14px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 10px;
    }

    .tool-card-zone-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: rgba(228,226,220,0.3);
      margin-bottom: 6px;
    }

    .tool-card-code {
      font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 6px;
      padding: 8px 10px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: rgba(228,226,220,0.65);
      font-variant-ligatures: contextual;
    }
    .tool-card-code::-webkit-scrollbar { width: 4px; }
    .tool-card-code::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .tool-card-result-section {
      margin-top: 10px;
    }

    /* Approval buttons inside pending card */
    .tool-card-approve-btns {
      padding: 10px 14px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .tool-card-approve-btns button {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tool-approve-yes {
      background: var(--iris);
      border: none;
      color: white;
    }
    .tool-approve-yes:hover { background: #6a58d9; }
    .tool-approve-no {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(228,226,220,0.5);
    }
    .tool-approve-no:hover { border-color: rgba(239,68,68,0.4); color: #EF4444; }

    @keyframes toolPulse {
      0%, 100% { border-color: rgba(124,106,239,0.15); }
      50% { border-color: rgba(124,106,239,0.35); }
    }

    /* ─── Image Skeleton (shimmer loading) ──────── */
    .img-skel {
      position: relative;
      width: 100%;
      max-width: 205px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(124,106,239,0.08);
      margin: 4px 0 8px;
      animation: skelBreathe 2.5s ease-in-out infinite;
    }
    .img-skel::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        105deg,
        transparent 0%,
        transparent 35%,
        rgba(124,106,239,0.07) 45%,
        rgba(167,139,250,0.12) 50%,
        rgba(124,106,239,0.07) 55%,
        transparent 65%,
        transparent 100%
      );
      width: 200%;
      animation: shimmerSweep 1.6s ease-in-out infinite;
    }
    .img-skel::after {
      content: '';
      position: absolute; inset: -1px;
      border-radius: 12px;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(124,106,239,0.15) 10%,
        transparent 20%,
        transparent 100%
      );
      animation: shimmerSpin 3s linear infinite;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      padding: 1px;
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }
    @keyframes shimmerSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes skelBreathe {
      0%, 100% { border-color: rgba(124,106,239,0.06); box-shadow: 0 0 0 0 rgba(124,106,239,0); }
      50% { border-color: rgba(124,106,239,0.15); box-shadow: 0 0 20px -4px rgba(124,106,239,0.08); }
    }
    .img-skel.loaded {
      animation: skelFadeOut 0.5s ease forwards;
      border-color: transparent;
    }
    .img-skel.loaded::before,
    .img-skel.loaded::after {
      animation: none; opacity: 0; transition: opacity 0.3s;
    }
    .img-skel img {
      position: relative;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease;
      border-radius: 12px;
      z-index: 1;
    }
    .img-skel.loaded img {
      opacity: 1;
    }
    @keyframes skelFadeOut {
      0% { background: rgba(255,255,255,0.03); }
      100% { background: transparent; }
    }

    /* ─── Mobile Orb (FAB) ──────────────────────── */
    #orb-fab {
      display: none;
      position: fixed;
      bottom: 20px; right: 20px;
      z-index: 90;
    }

    /* Mobile back button */
    .mobile-back {
      display: none;
      background: none; border: none;
      color: rgba(228,226,220,0.5);
      cursor: pointer; padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      margin-right: 4px;
    }
    .mobile-back:hover { color: rgba(228,226,220,0.8); background: rgba(255,255,255,0.05); }

    /* Mobile settings button */
    .mobile-settings {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(228,226,220,0.4);
      cursor: pointer;
      z-index: 91;
      transition: color 0.2s ease;
    }
    .mobile-settings:hover { color: rgba(228,226,220,0.7); }
    .mobile-settings svg { width: 22px; height: 22px; }
    .mobile-settings i { display: flex; }

    /* Desktop settings button */
    .desktop-settings {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: rgba(228,226,220,0.3);
      cursor: pointer;
      z-index: 91;
      transition: all 0.2s ease;
    }
    .desktop-settings:hover { color: rgba(228,226,220,0.7); }
    .desktop-settings svg { width: 18px; height: 18px; }
    .desktop-settings i { display: flex; }

    /* ─── Settings Dropdown ──────────────────────── */
    .settings-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 99;
    }
    .settings-overlay.open { display: block; }

    .settings-dropdown {
      position: fixed;
      width: 220px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(18,18,24,0.97);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px) scale(0.96);
      transition: all 0.18s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .settings-dropdown::-webkit-scrollbar { width: 3px; }
    .settings-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .settings-dropdown.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* Desktop: above bottom-right settings icon */
    .settings-dropdown.pos-desktop {
      bottom: 56px;
      right: 20px;
      top: auto;
    }
    /* Mobile: below top-left settings icon */
    .settings-dropdown.pos-mobile {
      top: 52px;
      left: 16px;
    }

    /* Accordion sections */
    .settings-section {
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .settings-section:last-child { border-bottom: none; }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }
    .settings-head:hover { background: rgba(255,255,255,0.03); }

    .settings-head-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(228,226,220,0.6);
    }
    .settings-head-icon {
      width: 12px; height: 12px;
      color: rgba(228,226,220,0.2);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .settings-section.open .settings-head-icon {
      transform: rotate(90deg);
    }

    .settings-body {
      display: none;
      padding: 0 12px 8px;
    }
    .settings-section.open .settings-body {
      display: block;
    }

    /* Rows */
    .settings-dropdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .settings-dropdown-label {
      font-size: 12px;
      color: rgba(228,226,220,0.65);
    }
    .settings-dropdown-value {
      font-size: 11px;
      color: rgba(228,226,220,0.4);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Color dots */
    /* Theme swatches */
    .theme-swatches {
      display: flex;
      gap: 5px;
    }
    .theme-swatch {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .theme-swatch:hover { transform: scale(1.2); box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
    .theme-swatch.active { border-color: rgba(255,255,255,0.85); box-shadow: 0 0 8px var(--iris-glow), 0 2px 6px rgba(0,0,0,0.3); }

    /* Toggle */
    .settings-toggle {
      position: relative;
      width: 36px; height: 20px;
      cursor: pointer;
    }
    .settings-toggle input { display: none; }
    .settings-toggle-track {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      transition: background 0.2s;
    }
    .settings-toggle-track::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: rgba(228,226,220,0.5);
      transition: all 0.2s;
    }
    .settings-toggle input:checked + .settings-toggle-track {
      background: var(--iris);
    }
    .settings-toggle input:checked + .settings-toggle-track::after {
      transform: translateX(16px);
      background: white;
    }

    .settings-dropdown-credit {
      text-align: center;
      font-size: 10px;
      color: rgba(228,226,220,0.15);
      padding: 6px 10px 8px;
    }

    .settings-emergency-btn {
      width: 100%;
      padding: 6px 0;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 5px;
      color: #EF4444;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-emergency-btn:hover {
      background: rgba(239,68,68,0.2);
      border-color: rgba(239,68,68,0.4);
    }

    /* Service cards */
    .svc-grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .svc-card {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .svc-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .svc-card.connected { border-color: rgba(52,211,153,0.2); }
    .svc-card.coming-soon-card { opacity: 0.4; cursor: default; }
    .svc-badge.coming-soon { background: rgba(255,255,255,0.06); color: rgba(228,226,220,0.4); }

    .svc-icon {
      width: 22px; height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .svc-card:hover .svc-icon { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }

    .svc-name {
      font-size: 11px;
      color: #e4e2dc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .svc-badge {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.1);
      color: rgba(228,226,220,0.7);
      font-weight: 600;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .svc-card.connected .svc-badge {
      background: rgba(52,211,153,0.15);
      color: var(--green);
    }

    .svc-disconnect {
      position: absolute;
      top: 1px; right: 3px;
      background: none; border: none;
      color: rgba(228,226,220,0.15);
      cursor: pointer;
      font-size: 11px;
      padding: 2px;
      display: none;
      line-height: 1;
    }
    .svc-card.connected:hover .svc-disconnect { display: block; }
    .svc-disconnect:hover { color: #EF4444; }

    /* ─── Auth Modal ──────────────────────────── */
    .auth-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .auth-modal-overlay.open { display: flex; }

    .auth-modal {
      background: rgba(18,18,24,0.98);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 24px;
      width: 280px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .auth-modal-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;

    .auth-token-input {

    .auth-modal-btn {
      padding: 7px 0;
      width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--iris);
      color: white;
    }
    .auth-modal-btn:hover { filter: brightness(1.1); }
    .auth-modal-btn.secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(228,226,220,0.5);
      margin-top: 6px;
    }
    .auth-modal-btn.secondary:hover { background: rgba(255,255,255,0.1); }

    /* ─── Login Overlay ─────────────────────────── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
      opacity: 1; transition: opacity 0.3s ease;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }
    .login-glow {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      width: 300px; height: 300px; border-radius: 50%;
      background: var(--iris-glow); filter: blur(80px); opacity: 0.15;
      pointer-events: none; animation: loginPulse 4s ease-in-out infinite;
    }
    @keyframes loginPulse {
      0%, 100% { opacity: 0.1; transform: translate(-50%, -50%) scale(0.9); }
      50% { opacity: 0.2; transform: translate(-50%, -50%) scale(1.1); }
    }
    .login-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 36px 32px 28px;
      width: 360px; max-width: 90vw;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 16px 64px rgba(0,0,0,0.3);
    }
    .login-box h2 {
      font-size: 20px; color: rgba(228,226,220,0.95); margin-bottom: 4px;
      font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    }
    .login-version {
      font-size: 11px; color: rgba(228,226,220,0.2); margin-bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
    }
    .login-box input {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
      color: rgba(228,226,220,0.9); font-size: 13px; font-family: 'JetBrains Mono', monospace;
      outline: none; margin-bottom: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-box input:focus {
      border-color: var(--iris);
      box-shadow: 0 0 0 3px rgba(124,106,239,0.1);
    }
    .login-box button {
      width: 100%; padding: 11px; border-radius: 10px; border: none;
      background: var(--iris); color: white; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px;
    }
    .login-box button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .login-box button:active { transform: translateY(0); }
    .login-err {
      display: none; color: #EF4444; font-size: 12px; margin-top: 10px;
    }
    .login-hint {
      margin-top: 16px; font-size: 11px; color: rgba(228,226,220,0.2);
    }
    .login-hint kbd {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      background: rgba(255,255,255,0.06); padding: 2px 5px;
      border-radius: 3px; border: 1px solid rgba(255,255,255,0.08);
    }


    /* ─── Diff Viewer Panel (Desktop only) ──────── */
    #diff-panel {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: 420px;
      max-height: 70vh;
      background: rgba(18,18,24,0.97);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      z-index: 90;
      display: none;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    #diff-panel.open { display: flex; }
    .diff-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .diff-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .diff-header-icon {
      width: 22px; height: 22px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .diff-header-icon svg { width: 12px; height: 12px; color: var(--iris); }
    .diff-header-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(228,226,220,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .diff-header-file {
      font-size: 10px;
      color: rgba(228,226,220,0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .diff-close {
      background: none;
      border: none;
      color: rgba(228,226,220,0.3);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .diff-close:hover { background: rgba(255,255,255,0.06); color: rgba(228,226,220,0.8); }
    .diff-close svg { width: 14px; height: 14px; }
    .diff-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      font-variant-ligatures: contextual;
    }
    .diff-body::-webkit-scrollbar { width: 4px; height: 4px; }
    .diff-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .diff-line { display: block; }
    .diff-line-add { color: #34D399; background: rgba(52,211,153,0.08); }
    .diff-line-del { color: #EF4444; background: rgba(239,68,68,0.08); }
    .diff-line-hdr { color: var(--iris); font-weight: 600; margin-top: 6px; }
    .diff-line-ctx { color: rgba(228,226,220,0.4); }
    .diff-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .diff-stats {
      display: flex;
      gap: 10px;
      font-size: 10px;
      font-weight: 600;
    }
    .diff-stat-add { color: #34D399; }
    .diff-stat-del { color: #EF4444; }
    .diff-minimize {
      background: none;
      border: none;
      color: rgba(228,226,220,0.3);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .diff-minimize:hover { background: rgba(255,255,255,0.06); color: rgba(228,226,220,0.8); }
    .diff-minimize svg { width: 14px; height: 14px; }


    /* ─── Mobile Layout ─────────────────────────── */
    @media (max-width: 640px) {
      #root {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        right: 0 !important; bottom: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 0 !important;
        pointer-events: none;
      }
      #root > * { pointer-events: auto; }

      #orb-mount {
        transform: scale(0.65);
        margin: 0;
        cursor: pointer;
        pointer-events: auto;
      }
      #orb-mount .orb-wrapper {
        width: 312px !important;
        height: 312px !important;
      }

      #status-text { display: none; }
      #thought-wrap { display: none; }
      #diff-panel { display: none !important; }
      .mobile-settings { display: flex; }
      .desktop-settings { display: none; }
      #chat-drawer.open ~ .mobile-settings { display: none; }
      #chat-drawer.open ~ .settings-dropdown { opacity: 0; pointer-events: none; }
      .settings-dropdown.pos-desktop { display: none; }
      .settings-dropdown.pos-mobile { display: block; }

      #chat-drawer {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        transform: none !important;
        width: 100vw !important;
        height: 100dvh !important;
        min-width: 0 !important;
        min-height: 0 !important;
        border-radius: 0 !important;
        border: none !important;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      #chat-drawer.open {
        opacity: 1;
        pointer-events: auto;
      }

      .mobile-back { display: flex; }
      .titlebar-dots { display: none; }

      .drawer-titlebar {
        padding: 12px 14px;
        gap: 8px;
      }

      .resize-handle { display: none !important; }

      .drawer-messages {
        padding: 12px;
      }

      .drawer-input-wrap {
        padding: 10px 12px 14px;
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }
    }

    /* ─── Command Palette ─────────────────────────── */
    .cmd-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.6);
      display: none; align-items: flex-start; justify-content: center;
      padding-top: 20vh;
      backdrop-filter: blur(4px);
    }
    .cmd-overlay.open { display: flex; }
    .cmd-palette {
      width: 520px; max-width: 92vw;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .cmd-input-wrap {
      display: flex; align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 10px;
    }
    .cmd-input-wrap svg { width: 18px; height: 18px; color: rgba(255,255,255,0.3); flex-shrink: 0; }
    .cmd-input {
      flex: 1; background: none; border: none; outline: none;
      color: rgba(228,226,220,0.9); font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
    }
    .cmd-input::placeholder { color: rgba(228,226,220,0.25); }
    .cmd-results { max-height: 320px; overflow-y: auto; padding: 6px; }
    .cmd-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      transition: background 0.12s;
    }
    .cmd-item:hover, .cmd-item.active { background: rgba(255,255,255,0.06); }
    .cmd-item-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.04); flex-shrink: 0;
    }
    .cmd-item-icon svg { width: 16px; height: 16px; color: var(--iris); }
    .cmd-item-label { flex: 1; }
    .cmd-item-name { font-size: 14px; color: rgba(228,226,220,0.9); }
    .cmd-item-desc { font-size: 12px; color: rgba(228,226,220,0.35); margin-top: 1px; }
    .cmd-item-shortcut {
      font-size: 11px; color: rgba(228,226,220,0.25);
      background: rgba(255,255,255,0.04); padding: 2px 6px;
      border-radius: 4px; font-family: monospace;
    }
    .cmd-empty { padding: 24px; text-align: center; color: rgba(228,226,220,0.25); font-size: 13px; }
    .cmd-hint { padding: 8px 14px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; gap: 16px; }
    .cmd-hint span { font-size: 11px; color: rgba(228,226,220,0.25); }
    .cmd-hint kbd { font-family: monospace; background: rgba(255,255,255,0.06); padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="cmd-overlay" id="command-palette">
    <div class="cmd-palette">
      <div class="cmd-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="cmd-input" id="cmd-input" placeholder="Search or type a command..." autofocus>
      </div>
      <div class="cmd-results" id="cmd-results"></div>
      <div class="cmd-hint">
        <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
        <span><kbd>Enter</kbd> select</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <div id="login-overlay">
    <div class="login-glow"></div>
    <div class="login-box">
      <h2>N.A.L.L.Y</h2>
      <div class="login-version">v1.0</div>
      <input type="password" id="login-token-input" placeholder="Access token" autofocus>
      <button onclick="doLogin()">Connect</button>
      <div class="login-err" id="login-err">Invalid token</div>
    </div>
    <div class="login-hint">Press <kbd>Enter</kbd> to connect</div>
  </div>
  <div id="root">
    <div id="orb-mount"></div>
    <div id="status-text"></div>
    <div id="thought-wrap">
      <button id="thought-toggle" onclick="toggleThought()"><span class="chevron">&#9660;</span> thought</button>
      <div id="thought-content"></div>
    </div>
  </div>

  <!-- Chat Drawer -->
  <div id="chat-drawer">
    <div class="drawer-titlebar" id="drawer-titlebar">
      <button class="mobile-back" id="mobile-back" onclick="closeDrawer()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="titlebar-dots">
        <span class="dot dot-close" onclick="closeDrawer()"></span>
        <span class="dot dot-min" onclick="minimizeDrawer()"></span>
        <span class="dot dot-max" onclick="maximizeDrawer()"></span>
      </div>
      <div class="titlebar-label">N.A.L.L.Y</div>
      <div class="titlebar-spacer"></div>
      <button class="titlebar-clear" onclick="clearChat()" title="Clear chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
    </div>
    <div class="drawer-messages" id="chat-messages"></div>
    <div class="drawer-input-wrap">
      <textarea class="drawer-input" id="chat-input" rows="1" placeholder="Ask Nally anything..."></textarea>
      <button class="drawer-send" onclick="sendChat()"><i data-lucide="send"></i></button>
    </div>
    <!-- Resize handles -->
    <div class="resize-handle resize-n" data-dir="n"></div>
    <div class="resize-handle resize-s" data-dir="s"></div>
    <div class="resize-handle resize-e" data-dir="e"></div>
    <div class="resize-handle resize-w" data-dir="w"></div>
    <div class="resize-handle resize-ne" data-dir="ne"></div>
    <div class="resize-handle resize-nw" data-dir="nw"></div>
    <div class="resize-handle resize-se" data-dir="se"></div>
    <div class="resize-handle resize-sw" data-dir="sw"></div>
  </div>

  <!-- Diff Viewer Panel (Desktop only) -->
  <div id="diff-panel">
    <div class="diff-header">
      <div class="diff-header-left">
        <div class="diff-header-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 12h14"/></svg></div>
        <span class="diff-header-title">File Diff</span>
        <span class="diff-header-file" id="diff-file"></span>
      </div>
      <button class="diff-close" onclick="closeDiff()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="diff-body" id="diff-body"></div>
    <div class="diff-footer">
      <div class="diff-stats" id="diff-stats"></div>
      <button class="diff-minimize" onclick="minimizeDiff()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
  </div>

  <!-- Settings Panel -->
  <!-- Settings Overlay + Dropdown -->
  <div class="settings-overlay" id="settings-overlay" onclick="closeSettings()"></div>
  <div class="settings-dropdown" id="settings-dropdown">
    <!-- MCP / Plugins -->
    <div class="settings-section open" data-section="mcp">
      <div class="settings-head" onclick="toggleSection(this)">
        <span class="settings-head-title">MCP / Plugins</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="svc-grid" id="svc-grid"></div>
      </div>
    </div>

    <!-- Themes / Appearance -->
    <div class="settings-section" data-section="theme">
      <div class="settings-head" onclick="toggleSection(this)">
        <span class="settings-head-title">Themes / Appearance</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Theme</span>
          <div class="theme-swatches">
            <button class="theme-swatch active" data-theme="midnight" style="background:#7C6AEF" onclick="setTheme('midnight')" title="Midnight"></button>
            <button class="theme-swatch" data-theme="emerald" style="background:#34D399" onclick="setTheme('emerald')" title="Emerald"></button>
            <button class="theme-swatch" data-theme="crimson" style="background:#EF4444" onclick="setTheme('crimson')" title="Crimson"></button>
            <button class="theme-swatch" data-theme="ocean" style="background:#38BDF8" onclick="setTheme('ocean')" title="Ocean"></button>
            <button class="theme-swatch" data-theme="gold" style="background:#F59E0B" onclick="setTheme('gold')" title="Gold"></button>
          </div>
        </div>
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Compact</span>
          <label class="settings-toggle">
            <input type="checkbox" id="compact-toggle" onchange="setCompact(this.checked)">
            <span class="settings-toggle-track"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- API -->
    <div class="settings-section" data-section="api">
      <div class="settings-head" onclick="toggleSection(this)">
        <span class="settings-head-title">API</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Provider</span>
          <span class="settings-dropdown-value">opencode</span>
        </div>
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Model</span>
          <span class="settings-dropdown-value">mimo-v2.5-free</span>
        </div>
      </div>
    </div>

    <!-- Emergency -->
    <div class="settings-section" data-section="emergency">
      <div class="settings-head" onclick="toggleSection(this)">
        <span class="settings-head-title">Emergency</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <button class="settings-emergency-btn" onclick="emergencyStop()">Stop All Operations</button>
      </div>
    </div>

    <!-- Lock Mode -->
    <div class="settings-section" data-section="lock">
      <div class="settings-head" onclick="toggleSection(this)">
        <span class="settings-head-title">Lock Mode</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row lock-row">
          <span class="settings-dropdown-label">Lock UI</span>
          <label class="settings-toggle">
            <input type="checkbox" id="lock-toggle" onchange="setLockMode(this.checked)">
            <span class="settings-toggle-track"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- About -->
    <div class="settings-section" data-section="about">
      <div class="settings-head" onclick="toggleSection(this)">
        <span class="settings-head-title">About</span>
        <svg class="settings-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-body">
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Backend</span>
          <span class="settings-dropdown-value" id="settings-backend-status">...</span>
        </div>
        <div class="settings-dropdown-row">
          <span class="settings-dropdown-label">Uptime</span>
          <span class="settings-dropdown-value" id="settings-uptime">0m</span>
        </div>
      </div>
    </div>

    <div class="settings-dropdown-credit">Clinton · Klyntech</div>
  </div>

  <!-- Auth Modal -->
  <div class="auth-modal-overlay" id="auth-modal-overlay">
    <div class="auth-modal" id="auth-modal">
      <div class="auth-modal-icon" id="auth-modal-icon"></div>
      <div class="auth-modal-title" id="auth-modal-title"></div>
      <div class="auth-modal-sub" id="auth-modal-sub"></div>
      <div class="auth-modal-spinner" id="auth-modal-spinner"></div>
      <div class="auth-modal-success" id="auth-modal-success">&#10003;</div>
      <div id="auth-modal-body"></div>

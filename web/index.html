<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.A.L.L.Y</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/static/marked.min.js"></script>
  <script src="/static/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* ─── Themes ──────────────────────────────── */
    :root {
      --teal: #3ECFB8;
      --green: #34D399;
    }
    body, body.theme-midnight {
      --iris: #7C6AEF;
      --iris-glow: rgba(124,106,239,0.35);
      --bg: #0a0a0a;
      --orb-speed: 4s;
      --orb-glow-a: rgba(124,106,239,0.2);
      --orb-glow-b: rgba(124,106,239,0.4);
    }
    body.theme-emerald {
      --iris: #34D399;
      --iris-glow: rgba(52,211,153,0.35);
      --bg: #080f0a;
      --orb-speed: 2s;
      --orb-glow-a: rgba(52,211,153,0.2);
      --orb-glow-b: rgba(52,211,153,0.4);
    }
    body.theme-crimson {
      --iris: #EF4444;
      --iris-glow: rgba(239,68,68,0.35);
      --bg: #0f0a0a;
      --orb-speed: 3s;
      --orb-glow-a: rgba(239,68,68,0.2);
      --orb-glow-b: rgba(239,68,68,0.4);
    }
    body.theme-ocean {
      --iris: #38BDF8;
      --iris-glow: rgba(56,189,248,0.35);
      --bg: #0a0a0f;
      --orb-speed: 5s;
      --orb-glow-a: rgba(56,189,248,0.2);
      --orb-glow-b: rgba(56,189,248,0.4);
    }
    body.theme-gold {
      --iris: #F59E0B;
      --iris-glow: rgba(245,158,11,0.35);
      --bg: #0f0d0a;
      --orb-speed: 3.5s;
      --orb-glow-a: rgba(245,158,11,0.2);
      --orb-glow-b: rgba(245,158,11,0.4);
    }

    html, body { background: var(--bg); height: 100%; width: 100%; overflow: hidden; font-family: 'Space Grotesk', sans-serif; transition: background 0.4s ease; }
    #root { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 40px; }

    /* ─── Orb Keyframes ─────────────────────────── */
    @keyframes orbSpinCW {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg) scale(1.02); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbSpinCCW {
      0% { transform: rotate(360deg); }
      50% { transform: rotate(180deg) scale(0.98); }
      100% { transform: rotate(0deg); }
    }
    @keyframes orbCorePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px var(--iris-glow)) drop-shadow(0 0 35px var(--orb-glow-a)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 35px var(--iris-glow)) drop-shadow(0 0 60px var(--orb-glow-b)); }
    }
    @keyframes orbAmbientPulse {
      0%, 100% { transform: scale(0.88); opacity: 0.3; filter: blur(55px) saturate(1.2); }
      50% { transform: scale(1.15); opacity: 0.75; filter: blur(40px) saturate(1.8); }
    }
    @keyframes orbListening {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(62,207,184,0.5)) drop-shadow(0 0 50px rgba(62,207,184,0.25)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 50px rgba(62,207,184,0.85)) drop-shadow(0 0 90px rgba(62,207,184,0.4)); }
    }
    @keyframes orbThinkingPulse {
      0%   { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
      8%   { transform: scale(1.07); filter: drop-shadow(0 0 35px var(--iris-glow)) drop-shadow(0 0 60px var(--orb-glow-a)); }
      18%  { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
      26%  { transform: scale(1.1); filter: drop-shadow(0 0 45px var(--iris-glow)) drop-shadow(0 0 80px var(--orb-glow-b)); }
      40%  { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--iris-glow)); }
    }
    @keyframes orbThinkingRingPulse {
      0%   { opacity: 0; transform: scale(1); }
      10%  { opacity: 0.6; transform: scale(1.05); }
      40%  { opacity: 0; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(1); }
    }
    @keyframes orbThinkingRipple {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.5; border-color: var(--iris-glow); }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; border-color: var(--orb-glow-a); }
    }
    @keyframes orbSpeaking {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)) drop-shadow(0 0 50px rgba(52,211,153,0.35)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 45px rgba(52,211,153,0.9)) drop-shadow(0 0 80px rgba(52,211,153,0.55)); }
    }
    @keyframes orbBreathe {
      0%   { transform: scale(0.3); opacity: 0; filter: blur(20px) brightness(0.3); }
      25%  { transform: scale(0.6); opacity: 0.5; filter: blur(8px) brightness(0.7); }
      50%  { transform: scale(0.9); opacity: 0.9; filter: blur(2px) brightness(1.1); }
      70%  { transform: scale(1.08); opacity: 1; filter: blur(0px) brightness(1.3); }
      85%  { transform: scale(0.96); opacity: 1; filter: blur(0px) brightness(1); }
      100% { transform: scale(1); opacity: 1; filter: blur(0px) brightness(1); }
    }
    @keyframes rippleExpand {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
      100% { transform: translate(-50%, -50%) scale(4); opacity: 0; border-width: 1px; }
    }
    @keyframes particleFly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
    }
    @keyframes wordPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes emphasisFlare {
      0% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)); }
      30% { transform: scale(1.15); filter: drop-shadow(0 0 60px rgba(52,211,153,1)) drop-shadow(0 0 100px rgba(52,211,153,0.6)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(52,211,153,0.6)); }
    }

    /* ─── Orb Classes ───────────────────────────── */
    .orb-wrapper {
      position: relative;
      width: 312px; height: 312px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
    }
    .orb-inner {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s ease-out;
    }
    .orb-inner.breathe { animation: orbBreathe 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .orb-inner.word-pulse { animation: wordPulse 0.25s ease-out; }
    .orb-inner.emphasis-flare { animation: emphasisFlare 0.4s ease-out; }
    .orb-ambient {
      position: absolute;
      width: 470px; height: 470px;
      border-radius: 50%;
      background: var(--iris-glow);
      filter: blur(40px);
      pointer-events: none;
      transition: all 0.6s ease;
      animation: orbAmbientPulse 8s ease-in-out infinite;
    }
    .orb-ring-cw { animation: orbSpinCW 55s linear infinite; transform-origin: 250px 250px; }
    .orb-ring-ccw { animation: orbSpinCCW 60s linear infinite; transform-origin: 250px 250px; }
    .orb-reactor { animation: orbCorePulse var(--orb-speed) ease-in-out infinite; transform-origin: 250px 250px; }

    /* State: listening */
    .orb-state-listening .orb-reactor { animation: orbListening 1.5s ease-in-out infinite; }
    .orb-state-listening .orb-ring-cw { animation-duration: 8s; }
    .orb-state-listening .orb-ring-ccw { animation-duration: 10s; }
    /* State: thinking */
    .orb-state-thinking .orb-ring-cw { animation: orbSpinCW 2.5s linear infinite; }
    .orb-state-thinking .orb-ring-ccw { animation: orbSpinCCW 3s linear infinite reverse; }
    .orb-state-thinking .orb-reactor { animation: orbThinkingPulse 1.2s ease-in-out infinite; }
    .orb-thinking-ring-pulse {
      position: absolute; top: 50%; left: 50%;
      width: 312px; height: 312px; border-radius: 50%;
      border: 2px solid rgba(124,106,239,0.4);
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none; opacity: 0;
      animation: orbThinkingRingPulse 1.2s ease-out infinite;
    }
    .orb-thinking-ripple {
      position: absolute; top: 50%; left: 50%;
      width: 120px; height: 120px; border-radius: 50%;
      border: 1.5px solid rgba(124,106,239,0.5);
      pointer-events: none;
      animation: orbThinkingRipple 1.2s ease-out infinite;
    }
    /* State: speaking */
    .orb-state-speaking .orb-reactor { animation: orbSpeaking 2s ease-in-out infinite; }
    .orb-state-speaking .orb-ring-cw { animation-duration: 20s; }
    .orb-state-speaking .orb-ring-ccw { animation-duration: 25s; }

    /* Ripple */
    .ripple {
      position: absolute;
      top: 50%; left: 50%;
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(124,106,239,0.45);
      pointer-events: none;
      animation: rippleExpand 1.5s ease-out forwards;
    }
    /* Particle */
    .particle {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFly 1s ease-out forwards;
    }

    /* ─── Status text ───────────────────────────── */
    #status-text {
      font-size: 13px;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(228,226,220,0.25);
      transition: all 0.4s ease;
      min-height: 20px;
    }
    #thought-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #thought-wrap.visible { opacity: 1; }
    #thought-wrap.collapsed #thought-content { max-height: 0; opacity: 0; padding: 0; margin: 0; overflow: hidden; }
    #thought-toggle {
      background: none; border: none; cursor: pointer;
      color: rgba(124,106,239,0.35);
      font-size: 11px; letter-spacing: 1px;
      font-family: 'Space Grotesk', sans-serif;
      display: flex; align-items: center; gap: 4px;
      transition: color 0.3s ease;
      padding: 2px 8px;
    }
    #thought-toggle:hover { color: rgba(124,106,239,0.7); }
    #thought-toggle .chevron {
      display: inline-block;
      transition: transform 0.3s ease;
      font-size: 10px;
    }
    #thought-wrap.collapsed #thought-toggle .chevron { transform: rotate(-90deg); }
    #thought-content {
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-style: italic;
      letter-spacing: 1px;
      color: rgba(124,106,239,0.55);
      text-align: center;
      max-width: 400px;
      min-height: 20px;
      max-height: 40px;
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      opacity: 1;
      padding: 2px 0;
    }



    /* ─── Chat Drawer (Desktop Window) ────────────── */
    #chat-drawer {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
      height: 480px;
      min-width: 320px;
      min-height: 260px;
      background: rgba(12,12,18,0.94);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    #chat-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }
    #chat-drawer.maximized {
      top: 0; left: 0;
      transform: none;
      width: 100vw !important;
      height: calc(100vh - 48px) !important;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* Title bar */
    .drawer-titlebar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 38px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    .drawer-titlebar:active { cursor: grabbing; }
    .titlebar-dots {
      display: flex;
      gap: 7px;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.15s ease;
    }
    .dot:hover { filter: brightness(1.3); transform: scale(1.15); }
    .dot-close { background: #ff5f57; }
    .dot-min { background: #febc2e; }
    .dot-max { background: #28c840; }
    .titlebar-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(228,226,220,0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .titlebar-spacer { width: auto; flex: 1; }
    .titlebar-clear {
      background: none; border: none; cursor: pointer;
      color: rgba(228,226,220,0.3); padding: 4px; border-radius: 4px;
      display: flex; align-items: center; transition: color 0.2s;
    }
    .titlebar-clear:hover { color: rgba(228,226,220,0.7); }

    /* Messages area */
    .drawer-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .drawer-messages::-webkit-scrollbar { width: 4px; }
    .drawer-messages::-webkit-scrollbar-track { background: transparent; }
    .drawer-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    /* ─── Chat Bubbles (Claude-style) ──────────── */
    .drawer-msg {
      padding: 12px 0;
      max-width: 100%;
      animation-duration: 0.35s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      animation-fill-mode: both;
    }
    .drawer-msg + .drawer-msg {
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .drawer-msg.user {
      animation-name: slideInRight;
      text-align: right;
    }
    .drawer-msg.nally {
      animation-name: slideInLeft;
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .drawer-msg.nally .msg-name {
      color: var(--iris);
      opacity: 0.5;
    }
    .msg-text {
      font-size: 14px;
      line-height: 1.7;
      color: rgba(228,226,220,0.8);
      word-wrap: break-word;
    }
    .drawer-msg.user .msg-text {
      color: rgba(228,226,220,0.65);
    }
    /* Markdown: headings */
    .msg-text h1, .msg-text h2, .msg-text h3, .msg-text h4 {
      color: rgba(228,226,220,0.95);
      font-weight: 600;
      margin: 14px 0 6px;
      line-height: 1.3;
    }
    .msg-text h1 { font-size: 18px; }
    .msg-text h2 { font-size: 16px; }
    .msg-text h3 { font-size: 15px; }
    .msg-text h4 { font-size: 14px; }
    /* Markdown: paragraphs */
    .msg-text p { margin: 6px 0; }
    /* Markdown: inline code */
    .msg-text code {
      background: rgba(124,106,239,0.12);
      color: rgba(167,139,250,0.9);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      border: 1px solid rgba(124,106,239,0.15);
    }
    /* Markdown: code blocks */
    .msg-text pre {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 14px 16px;
      margin: 10px 0;
      overflow-x: auto;
      position: relative;
    }
    .msg-text pre code {
      background: none;
      border: none;
      padding: 0;
      color: rgba(228,226,220,0.85);
      font-size: 13px;
      line-height: 1.5;
    }
    /* highlight.js overrides to match dark theme */
    .msg-text pre code.hljs {
      background: none;
      padding: 0;
    }
    .msg-text pre .hljs-keyword { color: #c678dd; }
    .msg-text pre .hljs-string { color: #98c379; }
    .msg-text pre .hljs-number { color: #d19a66; }
    .msg-text pre .hljs-comment { color: #5c6370; font-style: italic; }
    .msg-text pre .hljs-function { color: #61afef; }
    .msg-text pre .hljs-title { color: #61afef; }
    .msg-text pre .hljs-built_in { color: #e5c07b; }
    .msg-text pre .hljs-type { color: #e5c07b; }
    .msg-text pre .hljs-attr { color: #d19a66; }
    .msg-text pre .hljs-variable { color: #e06c75; }
    .msg-text pre .hljs-params { color: #e06c75; }
    .msg-text pre .hljs-meta { color: #56b6c2; }
    .msg-text pre .hljs-selector-class { color: #e5c07b; }
    .msg-text pre .hljs-selector-tag { color: #e06c75; }
    .msg-text pre .hljs-addition { color: #98c379; background: rgba(152,195,121,0.1); }
    .msg-text pre .hljs-deletion { color: #e06c75; background: rgba(224,108,117,0.1); }
    .msg-text strong {
      color: rgba(228,226,220,0.95);
      font-weight: 600;
    }
    .msg-text em {
      color: rgba(228,226,220,0.7);
      font-style: italic;
    }
    .msg-text del {
      color: rgba(228,226,220,0.4);
      text-decoration: line-through;
    }
    .msg-text a {
      color: var(--iris);
      text-decoration: none;
      border-bottom: 1px solid rgba(124,106,239,0.3);
      transition: border-color 0.2s ease;
    }
    .msg-text a:hover {
      border-color: var(--iris);
    }
    /* Markdown: blockquote */
    .msg-text blockquote {
      border-left: 3px solid var(--iris);
      margin: 8px 0;
      padding: 6px 14px;
      background: rgba(124,106,239,0.06);
      border-radius: 0 6px 6px 0;
      color: rgba(228,226,220,0.65);
    }
    /* Markdown: lists */
    .msg-text ul, .msg-text ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .msg-text li {
      margin: 3px 0;
    }
    .msg-text li input[type="checkbox"] {
      margin-right: 6px;
      accent-color: var(--iris);
    }
    /* Markdown: horizontal rule */
    .msg-text hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 12px 0;
    }
    /* Markdown: tables */
    .msg-text table {
      border-collapse: collapse;
      margin: 10px 0;
      width: 100%;
      font-size: 13px;
      display: table;
    }
    .msg-text .table-wrap {
      overflow-x: auto;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .msg-text th, .msg-text td {
      padding: 7px 10px;
      text-align: left;
      white-space: nowrap;
    }
    .msg-text thead { border-bottom: 1px solid rgba(255,255,255,0.1); }
    .msg-text th {
      color: rgba(228,226,220,0.5);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .msg-text td {
      color: rgba(228,226,220,0.85);
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .msg-text tr:hover td {
      background: rgba(255,255,255,0.02);
    }

    /* Compact mode */
    body.compact .drawer-messages { padding: 8px 10px; }
    body.compact .msg-text { font-size: 12px; line-height: 1.5; }
    body.compact .msg-text pre { padding: 8px 10px; margin: 6px 0; }
    body.compact .msg-text pre code { font-size: 11px; }
    body.compact .msg-text code { font-size: 11px; padding: 1px 4px; }
    body.compact .msg-text h1 { font-size: 15px; }
    body.compact .msg-text h2 { font-size: 14px; }
    body.compact .msg-text h3 { font-size: 13px; }
    body.compact .tool-card { margin: 4px 0; }
    body.compact .tool-card-header { padding: 6px 10px; }
    body.compact .tool-card-summary { font-size: 12px; }
    body.compact .tool-card-code { font-size: 11px; padding: 6px 8px; }
    body.compact .drawer-input { padding: 8px 12px; font-size: 13px; }

    /* Lock mode — disable interactive elements */
    body.lock-mode .drawer-input { pointer-events: none; opacity: 0.4; }
    body.lock-mode .drawer-send { pointer-events: none; opacity: 0.4; }
    body.lock-mode .settings-overlay { pointer-events: auto; }
    body.lock-mode .settings-dropdown-row:not(.lock-row) { pointer-events: none; opacity: 0.4; }
    body.lock-mode .mobile-settings { pointer-events: none; opacity: 0.4; }
    body.lock-mode .desktop-settings { pointer-events: none; opacity: 0.4; }

    /* Copy button */
    .msg-copy {
      opacity: 0;
      background: none; border: none; cursor: pointer;
      color: rgba(228,226,220,0.2);
      padding: 4px;
      border-radius: 4px;
      transition: opacity 0.2s, color 0.2s, background 0.2s;
      display: inline-flex; align-items: center;
      margin-top: 6px;
    }
    .msg-copy svg { width: 14px; height: 14px; }
    .drawer-msg:hover .msg-copy { opacity: 1; }
    .msg-copy:hover { color: rgba(228,226,220,0.6); background: rgba(255,255,255,0.05); }

    /* Typing indicator — waveform */
    .typing-indicator {
      padding: 10px 0;
      animation: slideInLeft 0.3s ease-out;
    }
    .typing-indicator + .drawer-msg {
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .typing-wave {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      height: 24px;
      padding: 0 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px 14px 14px 4px;
    }
    .typing-bar {
      width: 3px;
      border-radius: 2px;
      background: rgba(124,106,239,0.55);
      animation: waveBar 1s ease-in-out infinite;
    }
    .typing-bar:nth-child(1) { animation-delay: 0s; height: 8px; }
    .typing-bar:nth-child(2) { animation-delay: 0.1s; height: 14px; }
    .typing-bar:nth-child(3) { animation-delay: 0.2s; height: 6px; }
    .typing-bar:nth-child(4) { animation-delay: 0.15s; height: 18px; }
    .typing-bar:nth-child(5) { animation-delay: 0.05s; height: 10px; }
    @keyframes waveBar {
      0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* Input area */
    .drawer-input-wrap {
      display: flex;
      gap: 10px;
      padding: 14px 16px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .drawer-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 16px;
      color: rgba(228,226,220,0.9);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .drawer-input:focus { border-color: var(--iris-glow); }
    .drawer-input::placeholder { color: rgba(228,226,220,0.2); }
    .drawer-send {
      background: var(--iris);
      border: none;
      border-radius: 10px;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--iris-glow), 0 2px 4px rgba(0,0,0,0.3);
    }
    .drawer-send svg { width: 18px; height: 18px; }
    .drawer-send:hover { filter: brightness(1.15); transform: scale(1.08); box-shadow: 0 6px 20px var(--iris-glow), 0 3px 6px rgba(0,0,0,0.4); }

    /* Resize handles */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }
    .resize-n  { top: -4px; left: 8px; right: 8px; height: 8px; cursor: n-resize; }
    .resize-s  { bottom: -4px; left: 8px; right: 8px; height: 8px; cursor: s-resize; }
    .resize-e  { right: -4px; top: 8px; bottom: 8px; width: 8px; cursor: e-resize; }
    .resize-w  { left: -4px; top: 8px; bottom: 8px; width: 8px; cursor: w-resize; }
    .resize-ne { top: -4px; right: -4px; width: 14px; height: 14px; cursor: ne-resize; }
    .resize-nw { top: -4px; left: -4px; width: 14px; height: 14px; cursor: nw-resize; }
    .resize-se { bottom: -4px; right: -4px; width: 14px; height: 14px; cursor: se-resize; }
    .resize-sw { bottom: -4px; left: -4px; width: 14px; height: 14px; cursor: sw-resize; }

    /* Tool cards — v2 */
    /* ─── Tool Card (Claude.ai style) ───────────── */
    .tool-card {
      margin: 8px 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      overflow: hidden;
      animation: slideInLeft 0.25s ease-out;
      max-width: 100%;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .tool-card.running { border-color: rgba(124,106,239,0.2); }
    .tool-card.success { border-color: rgba(52,211,153,0.15); }
    .tool-card.error   { border-color: rgba(239,68,68,0.2); }
    .tool-card.pending { border-color: rgba(251,191,36,0.2); }

    .tool-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .tool-card-header:hover { background: rgba(255,255,255,0.03); }

    .tool-card-label {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .tool-card-summary {
      font-size: 13px;
      color: rgba(228,226,220,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .tool-card-name {
      font-size: 11px;
      color: rgba(228,226,220,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-card-status {
      width: 18px; height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tool-card-spinner {
      display: block;
      width: 14px; height: 14px;
      border: 1.5px solid rgba(124,106,239,0.15);
      border-top-color: var(--iris);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tool-card-check {
      color: var(--green);
    }
    .tool-card-check svg { width: 16px; height: 16px; }

    .tool-card-chevron {
      width: 16px; height: 16px;
      color: rgba(228,226,220,0.2);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .tool-card.expanded .tool-card-chevron { transform: rotate(90deg); }

    /* Body — smooth grid animation */
    .tool-card-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }
    .tool-card.expanded .tool-card-body {
      grid-template-rows: 1fr;
    }
    .tool-card-body-inner {
      overflow: hidden;
    }

    .tool-card-detail {
      padding: 0 14px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 10px;
    }

    .tool-card-zone-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: rgba(228,226,220,0.3);
      margin-bottom: 6px;
    }

    .tool-card-code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.5;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 6px;
      padding: 8px 10px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: rgba(228,226,220,0.65);
    }
    .tool-card-code::-webkit-scrollbar { width: 4px; }
    .tool-card-code::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .tool-card-result-section {
      margin-top: 10px;
    }

    /* Approval buttons inside pending card */
    .tool-card-approve-btns {
      padding: 10px 14px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .tool-card-approve-btns button {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tool-approve-yes {
      background: var(--iris);
      border: none;
      color: white;
    }
    .tool-approve-yes:hover { background: #6a58d9; }
    .tool-approve-no {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(228,226,220,0.5);
    }
    .tool-approve-no:hover { border-color: rgba(239,68,68,0.4); color: #EF4444; }

    @keyframes toolPulse {
      0%, 100% { border-color: rgba(124,106,239,0.15); }
      50% { border-color: rgba(124,106,239,0.35); }
    }

    /* ─── Mobile Orb (FAB) ──────────────────────── */
    #orb-fab {
      display: none;
      position: fixed;
      bottom: 20px; right: 20px;
      z-index: 90;
    }

    /* Mobile back button */
    .mobile-back {
      display: none;
      background: none; border: none;
      color: rgba(228,226,220,0.5);
      cursor: pointer; padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      margin-right: 4px;
    }
    .mobile-back:hover { color: rgba(228,226,220,0.8); background: rgba(255,255,255,0.05); }

    /* Mobile settings button */
    .mobile-settings {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(228,226,220,0.4);
      cursor: pointer;
      z-index: 91;
      transition: color 0.2s ease;
    }
    .mobile-settings:hover { color: rgba(228,226,220,0.7); }
    .mobile-settings svg { width: 22px; height: 22px; }
    .mobile-settings i { display: flex; }

    /* Desktop settings button */
    .desktop-settings {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: rgba(228,226,220,0.3);
      cursor: pointer;
      z-index: 91;
      transition: all 0.2s ease;
    }
    .desktop-settings:hover { color: rgba(228,226,220,0.7); }
    .desktop-settings svg { width: 18px; height: 18px; }
    .desktop-settings i { display: flex; }

    /* ─── Settings Dropdown ──────────────────────── */
    .settings-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 99;
    }
    .settings-overlay.open { display: block; }

    .settings-dropdown {
      position: fixed;
      width: 220px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(18,18,24,0.97);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px) scale(0.96);
      transition: all 0.18s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .settings-dropdown::-webkit-scrollbar { width: 3px; }
    .settings-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .settings-dropdown.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* Desktop: above bottom-right settings icon */
    .settings-dropdown.pos-desktop {
      bottom: 56px;
      right: 20px;
      top: auto;
    }
    /* Mobile: below top-left settings icon */
    .settings-dropdown.pos-mobile {
      top: 52px;
      left: 16px;
    }

    /* Accordion sections */
    .settings-section {
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .settings-section:last-child { border-bottom: none; }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }
    .settings-head:hover { background: rgba(255,255,255,0.03); }

    .settings-head-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(228,226,220,0.6);
    }
    .settings-head-icon {
      width: 12px; height: 12px;
      color: rgba(228,226,220,0.2);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .settings-section.open .settings-head-icon {
      transform: rotate(90deg);
    }

    .settings-body {
      display: none;
      padding: 0 12px 8px;
    }
    .settings-section.open .settings-body {
      display: block;
    }

    /* Rows */
    .settings-dropdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .settings-dropdown-label {
      font-size: 12px;
      color: rgba(228,226,220,0.65);
    }
    .settings-dropdown-value {
      font-size: 11px;
      color: rgba(228,226,220,0.4);
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* Color dots */
    /* Theme swatches */
    .theme-swatches {
      display: flex;
      gap: 5px;
    }
    .theme-swatch {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .theme-swatch:hover { transform: scale(1.2); box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }
    .theme-swatch.active { border-color: rgba(255,255,255,0.85); box-shadow: 0 0 8px var(--iris-glow), 0 2px 6px rgba(0,0,0,0.3); }

    /* Toggle */
    .settings-toggle {
      position: relative;
      width: 36px; height: 20px;
      cursor: pointer;
    }
    .settings-toggle input { display: none; }
    .settings-toggle-track {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      transition: background 0.2s;
    }
    .settings-toggle-track::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: rgba(228,226,220,0.5);
      transition: all 0.2s;
    }
    .settings-toggle input:checked + .settings-toggle-track {
      background: var(--iris);
    }
    .settings-toggle input:checked + .settings-toggle-track::after {
      transform: translateX(16px);
      background: white;
    }

    .settings-dropdown-credit {
      text-align: center;
      font-size: 10px;
      color: rgba(228,226,220,0.15);
      padding: 6px 10px 8px;
    }

    .settings-emergency-btn {
      width: 100%;
      padding: 6px 0;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 5px;
      color: #EF4444;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-emergency-btn:hover {
      background: rgba(239,68,68,0.2);
      border-color: rgba(239,68,68,0.4);
    }

    /* Service cards */
    .svc-grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .svc-card {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .svc-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .svc-card.connected { border-color: rgba(52,211,153,0.2); }
    .svc-card.coming-soon-card { opacity: 0.4; cursor: default; }
    .svc-badge.coming-soon { background: rgba(255,255,255,0.06); color: rgba(228,226,220,0.4); }

    .svc-icon {
      width: 22px; height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .svc-card:hover .svc-icon { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2); }

    .svc-name {
      font-size: 11px;
      color: #e4e2dc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .svc-badge {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.1);
      color: rgba(228,226,220,0.7);
      font-weight: 600;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .svc-card.connected .svc-badge {
      background: rgba(52,211,153,0.15);
      color: var(--green);
    }

    .svc-disconnect {
      position: absolute;
      top: 1px; right: 3px;
      background: none; border: none;
      color: rgba(228,226,220,0.15);
      cursor: pointer;
      font-size: 11px;
      padding: 2px;
      display: none;
      line-height: 1;
    }
    .svc-card.connected:hover .svc-disconnect { display: block; }
    .svc-disconnect:hover { color: #EF4444; }

    /* ─── Auth Modal ──────────────────────────── */
    .auth-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .auth-modal-overlay.open { display: flex; }

    .auth-modal {
      background: rgba(18,18,24,0.98);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 24px;
      width: 280px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .auth-modal-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: white;
      margin: 0 auto 12px;
    }
    .auth-modal-title {
      font-size: 14px;
      font-weight: 600;
      color: rgba(228,226,220,0.9);
      margin-bottom: 4px;
    }
    .auth-modal-sub {
      font-size: 11px;
      color: rgba(228,226,220,0.35);
      margin-bottom: 16px;
    }
    .auth-modal-spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: var(--iris);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    .auth-modal-success {
      display: none;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .auth-modal-success.show { display: block; }

    .auth-token-input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: rgba(228,226,220,0.85);
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .auth-token-input:focus { border-color: var(--iris); }
    .auth-token-input::placeholder { color: rgba(228,226,220,0.2); }

    .auth-modal-btn {
      padding: 7px 0;
      width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--iris);
      color: white;
    }
    .auth-modal-btn:hover { filter: brightness(1.1); }
    .auth-modal-btn.secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(228,226,220,0.5);
      margin-top: 6px;
    }
    .auth-modal-btn.secondary:hover { background: rgba(255,255,255,0.1); }

    /* ─── Login Overlay ─────────────────────────── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
      opacity: 1; transition: opacity 0.3s ease;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }
    .login-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 32px;
      width: 340px; max-width: 90vw;
      text-align: center;
    }
    .login-box h2 { font-size: 18px; color: rgba(228,226,220,0.9); margin-bottom: 6px; font-weight: 600; }
    .login-box p { font-size: 12px; color: rgba(228,226,220,0.4); margin-bottom: 20px; }
    .login-box input {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: rgba(228,226,220,0.9); font-size: 13px; font-family: monospace;
      outline: none; margin-bottom: 12px;
    }
    .login-box input:focus { border-color: var(--iris); }
    .login-box button {
      width: 100%; padding: 10px; border-radius: 8px; border: none;
      background: var(--iris); color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: filter 0.2s;
    }
    .login-box button:hover { filter: brightness(1.15); }
    .login-box .login-err { color: #EF4444; font-size: 11px; margin-top: 8px; display: none; }


    /* ─── Diff Viewer Panel (Desktop only) ──────── */
    #diff-panel {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      width: 420px;
      max-height: 70vh;
      background: rgba(18,18,24,0.97);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      z-index: 90;
      display: none;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    #diff-panel.open { display: flex; }
    .diff-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .diff-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .diff-header-icon {
      width: 22px; height: 22px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .diff-header-icon svg { width: 12px; height: 12px; color: var(--iris); }
    .diff-header-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(228,226,220,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .diff-header-file {
      font-size: 10px;
      color: rgba(228,226,220,0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .diff-close {
      background: none;
      border: none;
      color: rgba(228,226,220,0.3);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .diff-close:hover { background: rgba(255,255,255,0.06); color: rgba(228,226,220,0.8); }
    .diff-close svg { width: 14px; height: 14px; }
    .diff-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.55;
      white-space: pre;
      overflow-x: auto;
    }
    .diff-body::-webkit-scrollbar { width: 4px; height: 4px; }
    .diff-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .diff-line { display: block; }
    .diff-line-add { color: #34D399; background: rgba(52,211,153,0.08); }
    .diff-line-del { color: #EF4444; background: rgba(239,68,68,0.08); }
    .diff-line-hdr { color: var(--iris); font-weight: 600; margin-top: 6px; }
    .diff-line-ctx { color: rgba(228,226,220,0.4); }
    .diff-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .diff-stats {
      display: flex;
      gap: 10px;
      font-size: 10px;
      font-weight: 600;
    }
    .diff-stat-add { color: #34D399; }
    .diff-stat-del { color: #EF4444; }
    .diff-minimize {
      background: none;
      border: none;
      color: rgba(228,226,220,0.3);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .diff-minimize:hover { background: rgba(255,255,255,0.06); color: rgba(228,226,220,0.8); }
    .diff-minimize svg { width: 14px; height: 14px; }


    /* ─── Mobile Layout ─────────────────────────── */
    @media (max-width: 640px) {

        position: fixed !important;
        top: 0 !important; left: 0 !important;
        right: 0 !important; bottom: 0 !important;

        height: 100dvh !important;

      #status-text { display: none; }

      #chat-drawer.open ~ .mobile-settings { display: none; }
      #chat-drawer.open ~ .settings-dropdown { opacity: 0; pointer-events: none; }
      .settings-dropdown.pos-desktop { display: none; }

      #chat-drawer {
        position: fixed !important;

    }
  </style>
</head>

  <script>
    var root = document.getElementById('root');
    var statusEl = document.getElementById('status-text');
    var thoughtWrap = document.getElementById('thought-wrap');
    var thoughtContent = document.getElementById('thought-content');
    var thoughtCollapsed = false;

    function toggleThought() {
      thoughtCollapsed = !thoughtCollapsed;
      thoughtWrap.classList.toggle('collapsed', thoughtCollapsed);
    }

    // ─── Orb Component (Vanilla JS) ──────────────
    function createOrb(opts) {
      opts = opts || {};
      var size = opts.size || 312;
      var state = opts.state || 'idle';
      var activated = opts.activated !== false;

      var wrapper = document.createElement('div');
      wrapper.className = 'orb-wrapper';
      wrapper.style.width = size + 'px';
      wrapper.style.height = size + 'px';

      var inner = document.createElement('div');
      inner.className = 'orb-inner orb-state-' + state;
      if (activated) inner.classList.add('breathe');

      var ambient = document.createElement('div');
      ambient.className = 'orb-ambient';
      inner.appendChild(ambient);

      if (activated) {
        for (var r = 0; r < 3; r++) {
          var rip = document.createElement('div');
          rip.className = 'ripple';
          rip.style.animationDelay = (r * 0.35) + 's';
          inner.appendChild(rip);
          rip.addEventListener('animationend', function() { this.remove(); });
        }
        var colors = ['#3ECFB8', '#7C6AEF', '#A78BFA'];
        for (var p = 0; p < 16; p++) {
          var angle = (p / 16) * Math.PI * 2;
          var dist = 60 + Math.random() * 80;
          var part = document.createElement('div');
          part.className = 'particle';
          part.style.setProperty('--px', Math.cos(angle) * dist + 'px');
          part.style.setProperty('--py', Math.sin(angle) * dist + 'px');
          part.style.animationDelay = (Math.random() * 0.3) + 's';
          part.style.background = colors[p % 3];
          part.style.boxShadow = '0 0 6px ' + colors[p % 3];
          inner.appendChild(part);
          part.addEventListener('animationend', function() { this.remove(); });
        }
      }

      var strokeColor, glowColor, orbFilter, reactStroke;
      var rootStyle = getComputedStyle(document.body);
      var irisVar = rootStyle.getPropertyValue('--iris').trim();
      var glowVar = rootStyle.getPropertyValue('--iris-glow').trim();
      switch (state) {
        case 'listening': strokeColor = '#3ECFB8'; glowColor = 'rgba(62,207,184,0.15)'; orbFilter = 'drop-shadow(0 0 25px rgba(62,207,184,0.45))'; break;
        case 'thinking': strokeColor = '#ffffff'; glowColor = 'rgba(255,255,255,0.12)'; orbFilter = 'drop-shadow(0 0 20px rgba(255,255,255,0.35))'; break;
        case 'speaking': strokeColor = '#34D399'; glowColor = 'rgba(52,211,153,0.15)'; orbFilter = 'drop-shadow(0 0 25px rgba(52,211,153,0.45))'; break;
        default: strokeColor = irisVar || '#7C6AEF'; glowColor = glowVar || 'rgba(124,106,239,0.1)'; orbFilter = 'drop-shadow(0 0 15px ' + (glowVar || 'rgba(124,106,239,0.25)') + ')';
      }
      reactStroke = state === 'idle' ? '#ffffff' : strokeColor;
      ambient.style.background = glowColor;

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 500 500');
      svg.style.width = '100%';
      svg.style.height = '100%';
      svg.style.filter = orbFilter;
      svg.style.transition = 'filter 0.6s ease';

      var defs = document.createElementNS(svgNS, 'defs');
      function makeFilter(id, stdDev) {
        var f = document.createElementNS(svgNS, 'filter');
        f.setAttribute('id', id); f.setAttribute('x', '-20%'); f.setAttribute('y', '-20%');
        f.setAttribute('width', '140%'); f.setAttribute('height', '140%');
        var blur = document.createElementNS(svgNS, 'feGaussianBlur');
        blur.setAttribute('stdDeviation', stdDev); blur.setAttribute('result', 'b');
        f.appendChild(blur);
        var merge = document.createElementNS(svgNS, 'feMerge');
        var mn1 = document.createElementNS(svgNS, 'feMergeNode'); mn1.setAttribute('in', 'b');
        var mn2 = document.createElementNS(svgNS, 'feMergeNode'); mn2.setAttribute('in', 'SourceGraphic');
        merge.appendChild(mn1); merge.appendChild(mn2); f.appendChild(merge);
        return f;
      }
      defs.appendChild(makeFilter('og1', '12'));
      defs.appendChild(makeFilter('og2', '4'));
      var ft = makeFilter('otg', '4');
      ft.setAttribute('x', '-50%'); ft.setAttribute('y', '-50%');
      ft.setAttribute('width', '200%'); ft.setAttribute('height', '200%');
      defs.appendChild(ft);
      svg.appendChild(defs);

      var bgCircle = document.createElementNS(svgNS, 'circle');
      bgCircle.setAttribute('cx', '250'); bgCircle.setAttribute('cy', '250');
      bgCircle.setAttribute('r', '140'); bgCircle.setAttribute('fill', '#7C6AEF');
      bgCircle.setAttribute('fill-opacity', '0.03');
      svg.appendChild(bgCircle);

      var ringCCW = document.createElementNS(svgNS, 'circle');
      ringCCW.setAttribute('cx', '250'); ringCCW.setAttribute('cy', '250');
      ringCCW.setAttribute('r', '150'); ringCCW.setAttribute('fill', 'none');
      ringCCW.setAttribute('stroke', strokeColor); ringCCW.setAttribute('stroke-width', '10');
      ringCCW.setAttribute('filter', 'url(#og1)'); ringCCW.setAttribute('stroke-dasharray', '940 2');
      ringCCW.classList.add('orb-ring-ccw');
      ringCCW.style.transformOrigin = '250px 250px'; ringCCW.style.transition = 'stroke 0.6s ease';
      svg.appendChild(ringCCW);

      var ringCW = document.createElementNS(svgNS, 'circle');
      ringCW.setAttribute('cx', '250'); ringCW.setAttribute('cy', '250');
      ringCW.setAttribute('r', '125'); ringCW.setAttribute('fill', 'none');
      ringCW.setAttribute('stroke', reactStroke); ringCW.setAttribute('stroke-width', '5');
      ringCW.setAttribute('filter', 'url(#og2)'); ringCW.setAttribute('stroke-dasharray', '780 5');
      ringCW.classList.add('orb-ring-cw');
      ringCW.style.transformOrigin = '250px 250px'; ringCW.style.transition = 'stroke 0.6s ease';
      svg.appendChild(ringCW);

      var text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', '250'); text.setAttribute('y', '262');
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', reactStroke);
      text.setAttribute('filter', 'url(#otg)'); text.classList.add('orb-reactor');
      text.style.fontFamily = '"Space Grotesk",sans-serif'; text.style.fontSize = '46px';
      text.style.fontWeight = '700'; text.style.letterSpacing = '6px';
      text.style.textTransform = 'uppercase'; text.style.userSelect = 'none';
      text.style.transformOrigin = '250px 250px'; text.style.transition = 'fill 0.6s ease';
      text.textContent = 'NALLY';
      svg.appendChild(text);

      var lineCoords = [[250,100,250,116],[250,384,250,400],[100,250,116,250],[384,250,400,250]];
      lineCoords.forEach(function(l) {
        var line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1',l[0]); line.setAttribute('y1',l[1]);

    // ─── Think Function ──────────────────────────

    // think(null)                  — clears thought, returns to idle
    var _thinkTimers = [];
    function think(text) {
      _thinkTimers.forEach(clearTimeout);
      _thinkTimers = [];
      if (text === null || text === undefined) {

    // ─── Simulated Speaking Engine ───────────────
    // speak("Hello! This is Nally... How are you?")
    // Pulses the Orb in sync with each word.
    // ! and ? trigger emphasis flares.
    // , and . trigger brief pauses.
    var _speakTimers = [];
    var thinkPhrases = [
      "Processing your request...",
      "Analyzing input...",
      "Connecting to server...",
      "Retrieving data...",
      "Formulating response...",
      "Almost ready...",
    ];
    function speak(text) {
      _speakTimers.forEach(clearTimeout);
      _speakTimers = [];

      // Thinking phase with real-time thought
      var phrase = thinkPhrases[Math.floor(Math.random() * thinkPhrases.length)];
      think(phrase);

      var thinkTime = 600 + Math.random() * 600;
      var t = setTimeout(function() {
        // Clear thought, switch to speaking
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        orb.setState('speaking');
        statusEl.textContent = 'Speaking';
        statusEl.style.color = 'rgba(52,211,153,0.5)';

        // Split into tokens: words + punctuation
        var tokens = text.match(/[\w']+|[^\w\s]|\s+/g) || [];
        var delay = 0;

        for (var i = 0; i < tokens.length; i++) {
          var token = tokens[i];
          var isWord = /[\w']/.test(token);
          var isEmphasis = /[!?]/.test(token);
          var isPause = /[.,;:]/.test(token);
          var isSpace = /^\s+$/.test(token);

          if (isWord) {
            (function(w, d, emph) {
              var timer = setTimeout(function() {
                orb.pulseWord(emph);
                // Burst particles on emphasis words
                if (emph) orb.burstParticles(6, '#34D399');
              }, d);
              _speakTimers.push(timer);
            })(token, delay, isEmphasis);
            // Word duration: ~180ms base, longer for long words
            delay += Math.max(120, token.length * 45);
          } else if (isEmphasis) {
            // Emphasis punctuation: extra pause + flare
            (function(d) {
              var timer = setTimeout(function() {
                orb.pulseWord(true);
                orb.burstParticles(10, '#34D399');
              }, d);
              _speakTimers.push(timer);
            })(delay);
            delay += 300;
          } else if (isPause) {
            delay += 200; // comma/period pause
          } else if (isSpace) {
            delay += 30; // tiny gap between words
          }
        }

        // Done speaking
        var doneTimer = setTimeout(function() {
          orb.setState('idle');
          statusEl.textContent = '';
          statusEl.style.color = 'rgba(228,226,220,0.25)';
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
        }, delay + 200);
        _speakTimers.push(doneTimer);
      }, thinkTime);
      _speakTimers.push(t);
    }

    // ─── Markdown Renderer ────────────────────────
    // Configure marked with fallback
    if (typeof marked !== 'undefined') {
      marked.setOptions({
        breaks: true,
        gfm: true,
        highlight: function(code, lang) {
          if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
            try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
          }
          if (typeof hljs !== 'undefined') {
            try { return hljs.highlightAuto(code).value; } catch(e) {}
          }
          return code;
        }
      });
      // Custom renderer: wrap tables in scrollable div
      var origTable = new marked.Renderer();
      origTable.table = function() {
        var h = arguments[0], b = arguments[1];
        if (h && typeof h === 'object') { b = h.body; h = h.header; }
        return '<div class="table-wrap"><table>' + (h || '') + (b || '') + '</table></div>';
      };
      marked.setOptions({ renderer: origTable });
    }

    function renderMd(text) {
      if (!text || typeof text !== 'string') {
        console.warn('[renderMd] non-string input:', typeof text, text);
        return '';
      }
      var html = '';
      if (typeof marked !== 'undefined') {
        html = marked.parse(text);
      } else {
        // Fallback: comprehensive markdown if CDN failed
        html = text
          .replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
            var cls = lang ? ' class="language-' + lang + '"' : '';
            return '<pre><code' + cls + '>' + code.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
          })
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/~~(.+?)~~/g, '<del>$1</del>')
          .replace(/^\s*[-*]\s+\[[ x]\]\s+(.+)/gm, '<li><input type="checkbox" disabled> $1</li>')
          .replace(/^\s*[-*]\s+(.+)/gm, '<li>$1</li>')
          .replace(/^\s*\d+\.\s+(.+)/gm, '<li>$1</li>')
          .replace(/(<li>.*<\/li>)/gs, function(m) { return '<ul>' + m + '</ul>'; })
          .replace(/^>\s+(.+)/gm, '<blockquote>$1</blockquote>')
          .replace(/^---$/gm, '<hr>')
          .replace(/\n/g, '<br>');
        // Basic table support
        html = html.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)+)/gm, function(m, hdr, sep, body) {
          var ths = hdr.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<th>' + c.trim() + '</th>'; }).join('');
          var rows = body.trim().split('\n').map(function(row) {
            var tds = row.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<td>' + c.trim() + '</td>'; }).join('');
            return '<tr>' + tds + '</tr>';
          }).join('');
          return '<div class="table-wrap"><table><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        });
      }
      // Sanitize with DOMPurify if available
      if (typeof DOMPurify !== 'undefined') {
        return DOMPurify.sanitize(html, { ADD_TAGS: ['input'], ADD_ATTR: ['type', 'disabled', 'checked'] });
      }

    // ─── Chat Drawer (Desktop Window) ─────────────

    function autoSummary(name, args) {
      if (!args) return 'Running ' + name;
      if (name === 'RunCommand' && args.command) {
        var cmd = args.command.trim();
        if (cmd.startsWith('ls') || cmd.startsWith('dir')) return 'Listing directory contents';
        if (cmd.startsWith('cd ')) return 'Changing directory to ' + cmd.slice(3);
        if (cmd.startsWith('cat ') || cmd.startsWith('type ')) return 'Reading file ' + cmd.split(' ').pop();
        if (cmd.startsWith('mkdir')) return 'Creating directory ' + cmd.split(' ').pop();
        if (cmd.startsWith('rm ') || cmd.startsWith('del ')) return 'Deleting ' + cmd.split(' ').pop();
        if (cmd.startsWith('cp ') || cmd.startsWith('copy ')) return 'Copying files';
        if (cmd.startsWith('mv ') || cmd.startsWith('ren ') || cmd.startsWith('rename ')) return 'Renaming or moving files';
        if (cmd.startsWith('git ')) return 'Running git command';
        if (cmd.startsWith('npm ') || cmd.startsWith('yarn ') || cmd.startsWith('pip ')) return 'Running package manager';
        if (cmd.includes('curl') || cmd.includes('wget')) return 'Fetching remote content';
        if (cmd.includes('grep') || cmd.includes('find') || cmd.includes('search')) return 'Searching for files or text';
        if (cmd.includes('test') || cmd.includes('pytest') || cmd.includes('jest')) return 'Running tests';
        if (cmd.includes('build') || cmd.includes('compile')) return 'Building project';
        if (cmd.includes('install')) return 'Installing dependencies';
        if (cmd.includes('start') || cmd.includes('run') || cmd.includes('serve')) return 'Starting a service';
        if (cmd.includes('stop') || cmd.includes('kill')) return 'Stopping a process';
        if (cmd.includes('deploy')) return 'Deploying application';
        if (cmd.length > 60) cmd = cmd.substring(0, 57) + '...';
        return 'Running: ' + cmd;
      }
      if (name === 'ReadFile' && args.path) {
        var parts = args.path.replace(/\\/g, '/').split('/');
        return 'Reading ' + (parts[parts.length - 1] || args.path);
      }
      if (name === 'FileOps') {
        if (args.action === 'list') return 'Listing files in ' + (args.path || 'directory');
        if (args.action === 'write') return 'Writing to ' + (args.path || 'file');
        if (args.action === 'mkdir') return 'Creating folder ' + (args.path || 'directory');
        return 'Performing file operation';
      }
      if (name === 'SearchFiles' && args.pattern) return 'Searching for "' + args.pattern + '"';
      if (name === 'WebSearch' && args.query) return 'Searching the web for "' + args.query + '"';
      if (name === 'RunCode') return 'Executing code';
      if (name === 'CodeAnalysis') return 'Analyzing ' + (args.path || 'code');
      if (name === 'MemorySearch' && args.query) return 'Searching memory for "' + args.query + '"';
      if (name === 'MemoryStore') return 'Saving to memory';
      if (args.path) return 'Working with ' + args.path;
      if (args.query) return 'Processing "' + args.query + '"';
      if (args.command) return 'Running command';
      return 'Running ' + name;
    }

    function updateToolCard(id, resultText, isError) {
      var tc = toolCards[id];
      if (!tc) return;

      tc.card.classList.remove('running');
      tc.card.classList.add(isError ? 'error' : 'success');

      // Status: check or error icon
      tc.statusEl.innerHTML = isError
        ? '<span class="tool-card-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>'
        : '<span class="tool-card-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>';

      // Result zone
      if (resultText) {
        var truncated = resultText.substring(0, 5000);

        // Check for image file marker
        var imgMatch = truncated.match(/IMAGE_FILE:(.+)/);
        if (imgMatch) {
          var imgPath = imgMatch[1].trim();
          // Convert absolute path to URL
          var imgFilename = imgPath.split(/[/\\]/).pop();
          var imgUrl = '/generated/' + imgFilename;
          var metaText = truncated.replace(/IMAGE_FILE:.+/, '').trim();

          tc.resultCode.innerHTML = '';
          if (metaText) {
            var metaEl = document.createElement('div');
            metaEl.className = 'tool-card-code';
            metaEl.textContent = metaText;
            tc.resultCode.appendChild(metaEl);
          }
          var img = document.createElement('img');
          img.src = imgUrl;
          img.style.cssText = 'max-width:100%;border-radius:8px;margin-top:8px;cursor:pointer;';
          img.onload = function() { chatMessages.scrollTop = chatMessages.scrollHeight; };
          img.onerror = function() { img.alt = 'Image failed to load: ' + imgFilename; };
          img.addEventListener('click', function() { window.open(imgUrl, '_blank'); });
          tc.resultCode.appendChild(img);
        } else {
          tc.resultCode.textContent = truncated;
        }

        tc.resultSection.style.display = 'block';
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;
      delete toolCards[id];
    }

    // ─── Config ────────────────────────────────────
    var NALLY_API = 'http://localhost:5000';

    // Wait for marked.js to load (scripts are local, should be instant)
    function waitForMarked(cb, attempts) {
      attempts = attempts || 0;
      if (typeof marked !== 'undefined') {
        cb();
      } else if (attempts < 10) {
        setTimeout(function() { waitForMarked(cb, attempts + 1); }, 50);
      } else {
        console.warn('[waitForMarked] marked.js failed to load, proceeding with fallback');
        cb();
      }
    }

    function doLogin() {
      var input = document.getElementById('login-token-input');
      var token = input.value.trim();
      if (!token) return;
      loginErr.style.display = 'none';
      // Verify token by hitting the status endpoint
      fetch(NALLY_API + '/api/status', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(r) {
        if (!r.ok) throw new Error('bad');
        return r.json();
      }).then(function() {
        localStorage.setItem('nally-token', token);
        NALLY_TOKEN = token;
        loginOverlay.classList.add('hidden');
        setTimeout(function() { loginOverlay.remove(); }, 400);
        waitForMarked(loadHistory);
        setTimeout(subscribeEvents, 500);
      }).catch(function() {
        loginErr.style.display = 'block';
      });
    }

    document.getElementById('login-token-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    // Gate: if no token stored, show login; otherwise hide overlay
    if (!NALLY_TOKEN) {
      loginOverlay.classList.remove('hidden');
    } else {
      // Verify stored token is still valid
      fetch(NALLY_API + '/api/status', {
        headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN }
      }).then(function(r) {
        if (!r.ok) throw new Error('bad');
        loginOverlay.classList.add('hidden');
        setTimeout(function() { loginOverlay.remove(); }, 400);
        waitForMarked(loadHistory);
      }).catch(function() {
        // Token invalid — show login
        NALLY_TOKEN = '';
        localStorage.removeItem('nally-token');
      });
    }

    // ─── SSE Chat Client ──────────────────────────
    var chatAbort = null;

    function sendChat() {
      var text = chatInput.value.trim();
      if (!text) return;
      addChatMsg(text, false);
      chatInput.value = '';
      window._streamMsgEl = null;

      showTyping();
      think('Thinking...');

      // Abort any in-flight request
      if (chatAbort) chatAbort.abort();
      chatAbort = new AbortController();

      var streamMsgEl = null;

      fetch(NALLY_API + '/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + NALLY_TOKEN,
        },
        body: JSON.stringify({ message: text }),
        signal: chatAbort.signal,
      }).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        function readChunk() {
          reader.read().then(function(result) {
            if (result.done) {
              removeTyping();
              thoughtContent.textContent = '';
              thoughtWrap.classList.remove('visible');
              if (streamMsgEl) {
                streamMsgEl.innerHTML = renderMd(streamMsgEl.textContent);
                lucide.createIcons();
              }
              return;
            }

            buffer += decoder.decode(result.value, { stream: true });
            var lines = buffer.split('\n');
            buffer = lines.pop(); // keep incomplete line

            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim();
              if (!line.startsWith('data: ')) continue;
              var jsonStr = line.substring(6);
              if (jsonStr === '{"event": "done"}') continue;

              try {
                var evt = JSON.parse(jsonStr);
                handleSSE(evt, function(el) { streamMsgEl = el; });
              } catch (e) { console.error('SSE parse error:', e, jsonStr); }
            }

            readChunk();
          });
        }

        readChunk();
      }).catch(function(err) {
        if (err.name === 'AbortError') return;
        removeTyping();
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        addChatMsg('Backend offline — make sure NALLY server is running on port 5000.', true);
      });
    }

    function handleSSE(evt, setStreamEl) {
      console.log('SSE event:', evt.type, evt);
      switch (evt.type) {
        case 'tool_call':
          removeTyping();
          addToolCard(evt.name, evt.args, evt.id);
          think('Running ' + evt.name + '...');
          break;

        case 'tool_result':
          console.log('tool_result:', evt);
          updateToolCard(evt.tool_call_id, evt.result, false);
          think('Processing result...');
          if (evt.diff && evt.file_path) {
            console.log('DIFF FOUND:', evt.file_path, evt.diff.substring(0, 200));
            showDiff(evt.diff, evt.file_path);
          }
          break;

        case 'thought':
          think(evt.text);
          break;

        case 'stream_chunk':
          removeTyping();
          if (!window._streamMsgEl) {
            window._streamMsgEl = addChatMsgStream();
            setStreamEl(window._streamMsgEl);
          }
          if (typeof evt.text !== 'string') {
            console.warn('[stream_chunk] non-string evt.text:', typeof evt.text, evt);
          }
          window._streamMsgEl.textContent += (typeof evt.text === 'string' ? evt.text : '');
          chatMessages.scrollTop = chatMessages.scrollHeight;
          break;

        case 'response':
          removeTyping();
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
          if (typeof evt.text !== 'string') {
            console.warn('[response] non-string evt.text:', typeof evt.text, evt);
          }
          var respText = typeof evt.text === 'string' ? evt.text : String(evt.text || '');
          if (window._streamMsgEl) {
            // Update existing streaming message instead of creating a duplicate
            window._streamMsgEl.innerHTML = renderMd(respText);
            lucide.createIcons();
          } else {
            addChatMsg(respText, true);
          }
          window._streamMsgEl = null;
          speak(respText);
          break;

        case 'error':
          removeTyping();
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
          window._streamMsgEl = null;
          addChatMsg('Error: ' + evt.text, true);
          break;

        case 'stream_done':
          removeTyping();
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
          if (window._streamMsgEl) {
            window._streamMsgEl.innerHTML = renderMd(window._streamMsgEl.textContent);
            lucide.createIcons();
          }
          break;

        case 'confirmation_required':
          var approveCard = document.createElement('div');
          approveCard.className = 'tool-card pending expanded';

          var header = document.createElement('div');
          header.className = 'tool-card-header';
          header.style.cursor = 'default';

          // Label: summary (primary) + name (secondary)
          var label = document.createElement('div');
          label.className = 'tool-card-label';

          var summary = document.createElement('div');
          summary.className = 'tool-card-summary';
          summary.textContent = autoSummary(evt.name, evt.args);

          var nameEl = document.createElement('div');
          nameEl.className = 'tool-card-name';
          nameEl.textContent = evt.name || 'tool';

          label.appendChild(summary);
          label.appendChild(nameEl);

          // Status: approval icon
          var statusEl = document.createElement('div');
          statusEl.className = 'tool-card-status';
          statusEl.innerHTML = '<span style="color:#FBBF24"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></span>';

          header.appendChild(label);
          header.appendChild(statusEl);
          approveCard.appendChild(header);

          // Body with grid animation
          var body = document.createElement('div');
          body.className = 'tool-card-body';
          var inner = document.createElement('div');
          inner.className = 'tool-card-body-inner';

          var detail = document.createElement('div');
          detail.className = 'tool-card-detail';

          // Input zone
          var inputLabel = document.createElement('div');
          inputLabel.className = 'tool-card-zone-label';
          inputLabel.textContent = 'Input';
          var inputCode = document.createElement('div');
          inputCode.className = 'tool-card-code';
          inputCode.textContent = evt.args ? JSON.stringify(evt.args, null, 2) : 'No input';
          detail.appendChild(inputLabel);
          detail.appendChild(inputCode);

          // Show diff if available
          if (evt.diff && evt.file_path) showDiff(evt.diff, evt.file_path);

          // Approve / Deny buttons
          var btnWrap = document.createElement('div');
          btnWrap.className = 'tool-card-approve-btns';
          btnWrap.style.borderTop = '1px solid rgba(255,255,255,0.05)';

          var approveBtn = document.createElement('button');
          approveBtn.className = 'tool-approve-yes';
          approveBtn.textContent = 'Approve';

          var denyBtn = document.createElement('button');
          denyBtn.className = 'tool-approve-no';
          denyBtn.textContent = 'Deny';

          var tcId = evt.tool_call_id;
          approveBtn.addEventListener('click', function() { approveTool(tcId, true); approveCard.remove(); });
          denyBtn.addEventListener('click', function() { approveTool(tcId, false); approveCard.remove(); });

          btnWrap.appendChild(approveBtn);
          btnWrap.appendChild(denyBtn);
          detail.appendChild(btnWrap);

          inner.appendChild(detail);
          body.appendChild(inner);
          approveCard.appendChild(body);

          chatMessages.appendChild(approveCard);
          lucide.createIcons();
          chatMessages.scrollTop = chatMessages.scrollHeight;
          break;
      }
    }

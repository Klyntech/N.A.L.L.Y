    function getConnected() {
      try { return JSON.parse(localStorage.getItem('nally-svc') || '{}'); }
      catch(e) { return {}; }
    }
    function saveConnected(obj) { localStorage.setItem('nally-svc', JSON.stringify(obj)); }

    function renderServices() {
      var connected = getConnected();
      var grid = document.getElementById('svc-grid');
      grid.innerHTML = SERVICES.map(function(s) {
        var c = connected[s.id];
        var color = SVC_COLORS[s.id] || '#888';
        var isLight = s.lightIcon;
        var bg = isLight ? 'rgba(255,255,255,0.9)' : color;
        var fg = isLight ? '#000' : '#fff';
        var svg = SVC_ICONS[s.id] || '';
        var styledSvg = svg.replace('<svg', '<svg style="width:14px;height:14px;color:' + fg + '"');
        var badge = '';
        if (!s.mcp) {
          badge = '<span class="svc-badge coming-soon">Soon</span>';
        } else if (c) {
          badge = '<span class="svc-badge connected">Connected</span>';
        } else {
          badge = '<span class="svc-badge">Connect</span>';
        }
        var click = s.mcp ? 'connectService(\'' + s.id + '\')' : '';
        var cls = 'svc-card' + (c ? ' connected' : '') + (!s.mcp ? ' coming-soon-card' : '');
        return '<div class="' + cls + '" data-svc="' + s.id + '" onclick="' + click + '">'
          + '<div class="svc-icon" style="background:' + bg + '">' + styledSvg + '</div>'
          + '<span class="svc-name">' + s.name + '</span>'
          + badge
          + (s.mcp ? '<button class="svc-disconnect" onclick="event.stopPropagation();disconnectSvc(\'' + s.id + '\')">&times;</button>' : '')
          + '</div>';
      }).join('');
    }

    function findSvc(id) { return SERVICES.find(function(s){ return s.id === id; }); }
    function backendId(id) { var s = findSvc(id); return (s && s.backendId) ? s.backendId : id; }

    function connectService(id) {
      var svc = findSvc(id);
      if (!svc || !svc.mcp) return;
      var connected = getConnected();
      if (connected[id]) return;

      if (svc.auth === 'none') {
        // Auto-connect (filesystem, fetch)
        connected[id] = { at: Date.now() };
        saveConnected(connected);
        renderServices();
        return;
      }
      if (svc.auth === 'oauth') {
        showAuthModal(svc, 'oauth');
      } else {
        showAuthModal(svc, 'token');
      }
    }

    function disconnectSvc(id) {
      var connected = getConnected();
      delete connected[id];
      saveConnected(connected);
      // Also try backend disconnect
      fetch(NALLY_API + '/api/mcp/disconnect/' + backendId(id), {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN }
      }).catch(function(){});
      renderServices();
    }

    // ─── Auth Modal ─────────────────────────────
    var authOverlay = document.getElementById('auth-modal-overlay');
    var authIcon = document.getElementById('auth-modal-icon');
    var authTitle = document.getElementById('auth-modal-title');
    var authSub = document.getElementById('auth-modal-sub');
    var authSpinner = document.getElementById('auth-modal-spinner');
    var authSuccess = document.getElementById('auth-modal-success');
    var authBody = document.getElementById('auth-modal-body');

    function showAuthModal(svc, type) {
      var color = SVC_COLORS[svc.id] || '#888';
      var isLight = svc.lightIcon;
      var bg = isLight ? 'rgba(255,255,255,0.9)' : color;
      var fg = isLight ? '#000' : '#fff';
      var svg = SVC_ICONS[svc.id] || '';
      var styledSvg = svg.replace('<svg', '<svg style="width:20px;height:20px;color:' + fg + '"');
      authIcon.style.background = bg;
      authIcon.innerHTML = styledSvg;
      authTitle.textContent = 'Connect ' + svc.name;
      authSpinner.style.display = '';
      authSuccess.classList.remove('show');
      authBody.innerHTML = '';

      if (type === 'oauth') {
        authSub.textContent = 'Redirecting to ' + svc.name + '...';
        authOverlay.classList.add('open');
        // Hit backend to get OAuth URL, then redirect
        fetch(NALLY_API + '/api/mcp/connect/' + backendId(svc.id), {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN, 'Content-Type': 'application/json' }
        })
        .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, data: j }; }); })
        .then(function(res) {
          if (!res.ok) {
            authSpinner.style.display = 'none';
            authSub.textContent = res.data.detail || res.data.error || 'Backend error';
            authBody.innerHTML = '<button class="auth-modal-btn secondary" onclick="closeAuthModal()">Close</button>';
            return;
          }
          var data = res.data;
          if (data.status === 'connected') {
            authSpinner.style.display = 'none';
            authSuccess.classList.add('show');
            authSub.textContent = svc.name + ' already connected';
            authBody.innerHTML = '<button class="auth-modal-btn" onclick="closeAuth(\'' + svc.id + '\')">Done</button>';
            return;
          }
          if (data.auth_url) {
            authSub.textContent = 'Opening ' + svc.name + '...';
            // Open OAuth in popup
            var w = 600, h = 700;
            var left = (screen.width - w) / 2, top = (screen.height - h) / 2;
            var popup = window.open(data.auth_url, 'oauth_' + svc.id, 'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
            if (!popup) {
              authSpinner.style.display = 'none';
              authSub.textContent = 'Popup blocked — allow popups for this site';
              authBody.innerHTML = '<button class="auth-modal-btn" onclick="window.open(\'' + data.auth_url + '\')">Open in new tab</button><button class="auth-modal-btn secondary" onclick="closeAuthModal()">Close</button>';
              return;
            }
            // Poll for connection status
            pollConnection(svc.id);
          } else {
            authSpinner.style.display = 'none';
            var errMsg = data.detail || data.error || 'Failed to start OAuth flow';
            authSub.textContent = errMsg;
            authBody.innerHTML = '<button class="auth-modal-btn secondary" onclick="closeAuthModal()">Close</button>';
          }
        })
        .catch(function() {
          authSpinner.style.display = 'none';
          authSub.textContent = 'Backend unreachable';
          authBody.innerHTML = '<button class="auth-modal-btn secondary" onclick="closeAuthModal()">Close</button>';
        });
      } else {
        authSub.textContent = 'Paste your ' + (svc.tokenLabel || 'token') + ' below';
        authSpinner.style.display = 'none';
        authBody.innerHTML = '<input class="auth-token-input" id="auth-token-val" placeholder="' + (svc.tokenLabel || 'Token') + '" type="password" autofocus>'
          + '<button class="auth-modal-btn" onclick="submitToken(\'' + svc.id + '\')">Connect</button>'
          + '<button class="auth-modal-btn secondary" onclick="closeAuthModal()">Cancel</button>';
        authOverlay.classList.add('open');
        setTimeout(function(){ var el=document.getElementById('auth-token-val'); if(el) el.focus(); }, 100);
      }
    }

    function submitToken(id) {
      var val = document.getElementById('auth-token-val');
      if (!val || !val.value.trim()) return;
      var token = val.value.trim();
      authSpinner.style.display = '';
      authBody.innerHTML = '';
      authSub.textContent = 'Verifying...';

      // Submit to backend
      fetch(NALLY_API + '/api/mcp/token/' + backendId(id), {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      })
      .then(function(r) { return r.json(); })
      .then(function() {
        authSpinner.style.display = 'none';
        authSuccess.classList.add('show');
        var svc = findSvc(id);
        authSub.textContent = svc.name + ' connected successfully';
        authBody.innerHTML = '<button class="auth-modal-btn" onclick="closeAuth(\'' + id + '\')">Done</button>';
      })
      .catch(function() {
        // Still mark as connected locally
        authSpinner.style.display = 'none';
        authSuccess.classList.add('show');
        var svc = findSvc(id);
        authSub.textContent = svc.name + ' connected (local)';
        authBody.innerHTML = '<button class="auth-modal-btn" onclick="closeAuth(\'' + id + '\')">Done</button>';
      });
    }

    var _pollInterval = null;

    function pollConnection(id) {
      if (_pollInterval) clearInterval(_pollInterval);
      var checks = 0;
      _pollInterval = setInterval(function() {
        checks++;
        fetch(NALLY_API + '/api/mcp/services', {
          headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var svc = data.services ? data.services.find(function(s){ return s.name === id || s.id === id; }) : null;
          if (svc && svc.connected) {
            clearInterval(_pollInterval); _pollInterval = null;
            authSpinner.style.display = 'none';
            authSuccess.classList.add('show');
            authSub.textContent = findSvc(id).name + ' connected successfully';
            authBody.innerHTML = '<button class="auth-modal-btn" onclick="closeAuth(\'' + id + '\')">Done</button>';
          }
        })
        .catch(function(){});
        if (checks > 30) {
          clearInterval(_pollInterval); _pollInterval = null;
          authSpinner.style.display = 'none';
          authSub.textContent = 'Timed out — try again';
          authBody.innerHTML = '<button class="auth-modal-btn secondary" onclick="closeAuthModal()">Close</button>';
        }
      }, 1000);
    }

    function closeAuth(id) {
      var connected = getConnected();
      connected[id] = { at: Date.now() };
      saveConnected(connected);
      renderServices();
      closeAuthModal();
    }

    function closeAuthModal() {
      if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
      authOverlay.classList.remove('open');
      authBody.innerHTML = '';
    }

    // ─── Diff Viewer ─────────────────────────────
    var diffPanel = document.getElementById('diff-panel');
    var diffBody = document.getElementById('diff-body');
    var diffFile = document.getElementById('diff-file');
    var diffStats = document.getElementById('diff-stats');

    function showDiff(diffText, filePath) {
      // Only show on desktop
      if (window.innerWidth <= 640) return;

      diffFile.textContent = filePath || '';
      diffBody.innerHTML = '';

      var lines = diffText.split('\n');
      var adds = 0, dels = 0;

      lines.forEach(function(line) {
        var span = document.createElement('span');
        span.className = 'diff-line';
        if (line.startsWith('@@')) {
          span.classList.add('diff-line-hdr');
        } else if (line.startsWith('+')) {
          span.classList.add('diff-line-add');
          adds++;
        } else if (line.startsWith('-')) {
          span.classList.add('diff-line-del');
          dels++;
        } else if (line.startsWith('---') || line.startsWith('+++')) {
          span.classList.add('diff-line-hdr');
        } else {
          span.classList.add('diff-line-ctx');
        }
        span.textContent = line + '\n';
        diffBody.appendChild(span);
      });

      diffStats.innerHTML = '<span class="diff-stat-add">+' + adds + '</span><span class="diff-stat-del">-' + dels + '</span>';
      diffPanel.classList.add('open');
    }

    function closeDiff() {
      diffPanel.classList.remove('open');
    }

    function minimizeDiff() {
      diffPanel.classList.remove('open');
    }

    authOverlay.addEventListener('click', function(e) {
      if (e.target === authOverlay) closeAuthModal();
    });

    // Handle OAuth redirect
    (function() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('oauth') === 'success') {
        var svcId = (params.get('service') || '').toLowerCase();
        if (svcId) {
          var connected = getConnected();
          connected[svcId] = { at: Date.now() };
          saveConnected(connected);
          renderServices();
        }
        window.history.replaceState({}, '', window.location.pathname);
      }
    })();
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && authOverlay.classList.contains('open')) closeAuthModal();
      if (e.key === 'Escape' && diffPanel.classList.contains('open')) closeDiff();
    });

    // ─── Lock shortcut ─────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'L') {
        e.preventDefault();
        var lockToggle = document.getElementById('lock-toggle');
        lockToggle.checked = !lockToggle.checked;
        setLockMode(lockToggle.checked);
      }
    });

    // ─── Multi-Tab Sync (BroadcastChannel + SSE) ──
    var _lastSentMessage = '';  // echo prevention: track own messages
    var _syncChannel = null;
    var _evtSource = null;

    // 1. BroadcastChannel: instant sync for settings across tabs
    try {
      _syncChannel = new BroadcastChannel('nally-sync');
      _syncChannel.onmessage = function(e) {
        var d = e.data;
        if (!d || !d.type) return;
        if (d.type === 'theme') {
          document.body.className = '';
          document.body.classList.add('theme-' + d.value);
          if (document.getElementById('compact-toggle').checked) document.body.classList.add('compact');
          if (document.getElementById('lock-toggle').checked) document.body.classList.add('lock-mode');
          document.querySelectorAll('.theme-swatch').forEach(function(s) {
            s.classList.toggle('active', s.dataset.theme === d.value);
          });
        } else if (d.type === 'compact') {
          document.body.classList.toggle('compact', d.value);
          document.getElementById('compact-toggle').checked = d.value;
        } else if (d.type === 'lock') {
          document.body.classList.toggle('lock-mode', d.value);
          document.getElementById('lock-toggle').checked = d.value;
        } else if (d.type === 'clear') {
          chatMessages.innerHTML = '';
        } else if (d.type === 'history') {
          loadHistory();
        } else if (d.type === 'mcp') {
          renderServices();
        }
      };
    } catch(e) { console.warn('BroadcastChannel not supported'); }

    // Wrap settings functions to broadcast changes
    var _origSetTheme = setTheme;
    setTheme = function(name) {
      _origSetTheme(name);
      if (_syncChannel) _syncChannel.postMessage({ type: 'theme', value: name });
    };

    var _origSetCompact = setCompact;
    setCompact = function(on) {
      _origSetCompact(on);
      if (_syncChannel) _syncChannel.postMessage({ type: 'compact', value: on });
    };

    var _origSetLockMode = setLockMode;
    setLockMode = function(on) {
      _origSetLockMode(on);
      if (_syncChannel) _syncChannel.postMessage({ type: 'lock', value: on });
    };

    // Wrap clearChat to broadcast
    var _origClearChat = clearChat;
    clearChat = function() {
      _origClearChat();
      if (_syncChannel) _syncChannel.postMessage({ type: 'clear' });
    };

    // 2. Persistent SSE: subscribe to server-side events for real-time sync
    function subscribeEvents() {
      if (_evtSource) { _evtSource.close(); _evtSource = null; }
      try {
        _evtSource = new EventSource(NALLY_API + '/api/events?token=' + encodeURIComponent(NALLY_TOKEN));
        _evtSource.addEventListener('connected', function() {
          console.log('[sync] Connected to event stream');
        });
        _evtSource.addEventListener('message_added', function(e) {
          // Only re-fetch if another tab sent the message
          var data = {};
          try { data = JSON.parse(e.data); } catch(err) {}
          loadHistory();
        });
        _evtSource.addEventListener('history_cleared', function() {
          chatMessages.innerHTML = '';
        });
        _evtSource.addEventListener('approval_resolved', function() {
          // Refresh any pending approval cards
        });
        _evtSource.addEventListener('mcp_status', function() {
          renderServices();
        });
        _evtSource.onerror = function() {
          console.warn('[sync] SSE error, reconnecting in 3s...');
          _evtSource.close();
          _evtSource = null;
          // Don't reconnect if token is invalid
          if (!NALLY_TOKEN) return;
          setTimeout(subscribeEvents, 3000);
        };
      } catch(e) {
        console.warn('[sync] EventSource failed:', e);
        setTimeout(subscribeEvents, 5000);
      }
    }

    // Start SSE subscription after auth
    if (NALLY_TOKEN) {
      setTimeout(subscribeEvents, 500);
    }

    // ─── Init Lucide Icons ───────────────────────
    lucide.createIcons();
  </script>
</body>
</html>

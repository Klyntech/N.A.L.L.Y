  <!-- Mobile Settings Icon -->
  <div class="mobile-settings" onclick="toggleSettings(event)">
    <i data-lucide="settings"></i>
  </div>

  <!-- Desktop Settings Icon -->
  <div class="desktop-settings" onclick="toggleSettings(event)">
    <i data-lucide="settings"></i>
  </div>


  <script>
    var root = document.getElementById('root');
    var statusEl = document.getElementById('status-text');
    var thoughtWrap = document.getElementById('thought-wrap');
    var thoughtContent = document.getElementById('thought-content');
    var thoughtCollapsed = false;

    function toggleThought() {
      thoughtCollapsed = !thoughtCollapsed;
      thoughtWrap.classList.toggle('collapsed', thoughtCollapsed);
    }

    // ─── Orb Component (Vanilla JS) ──────────────
    function createOrb(opts) {
      opts = opts || {};
      var size = opts.size || 312;
      var state = opts.state || 'idle';
      var activated = opts.activated !== false;

      var wrapper = document.createElement('div');
      wrapper.className = 'orb-wrapper';
      wrapper.style.width = size + 'px';
      wrapper.style.height = size + 'px';

      var inner = document.createElement('div');
      inner.className = 'orb-inner orb-state-' + state;
      if (activated) inner.classList.add('breathe');

      var ambient = document.createElement('div');
      ambient.className = 'orb-ambient';
      inner.appendChild(ambient);

      if (activated) {
        for (var r = 0; r < 3; r++) {
          var rip = document.createElement('div');
          rip.className = 'ripple';
          rip.style.animationDelay = (r * 0.35) + 's';
          inner.appendChild(rip);
          rip.addEventListener('animationend', function() { this.remove(); });
        }
        var colors = ['#3ECFB8', '#7C6AEF', '#A78BFA'];
        for (var p = 0; p < 16; p++) {
          var angle = (p / 16) * Math.PI * 2;
          var dist = 60 + Math.random() * 80;
          var part = document.createElement('div');
          part.className = 'particle';
          part.style.setProperty('--px', Math.cos(angle) * dist + 'px');
          part.style.setProperty('--py', Math.sin(angle) * dist + 'px');
          part.style.animationDelay = (Math.random() * 0.3) + 's';
          part.style.background = colors[p % 3];
          part.style.boxShadow = '0 0 6px ' + colors[p % 3];
          inner.appendChild(part);
          part.addEventListener('animationend', function() { this.remove(); });
        }
      }

      var strokeColor, glowColor, orbFilter, reactStroke;
      var rootStyle = getComputedStyle(document.body);
      var irisVar = rootStyle.getPropertyValue('--iris').trim();
      var glowVar = rootStyle.getPropertyValue('--iris-glow').trim();
      switch (state) {
        case 'listening': strokeColor = '#3ECFB8'; glowColor = 'rgba(62,207,184,0.15)'; orbFilter = 'drop-shadow(0 0 25px rgba(62,207,184,0.45))'; break;
        case 'thinking': strokeColor = '#ffffff'; glowColor = 'rgba(255,255,255,0.12)'; orbFilter = 'drop-shadow(0 0 20px rgba(255,255,255,0.35))'; break;
        case 'speaking': strokeColor = '#34D399'; glowColor = 'rgba(52,211,153,0.15)'; orbFilter = 'drop-shadow(0 0 25px rgba(52,211,153,0.45))'; break;
        default: strokeColor = irisVar || '#7C6AEF'; glowColor = glowVar || 'rgba(124,106,239,0.1)'; orbFilter = 'drop-shadow(0 0 15px ' + (glowVar || 'rgba(124,106,239,0.25)') + ')';
      }
      reactStroke = state === 'idle' ? '#ffffff' : strokeColor;
      ambient.style.background = glowColor;

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 500 500');
      svg.style.width = '100%';
      svg.style.height = '100%';
      svg.style.filter = orbFilter;
      svg.style.transition = 'filter 0.6s ease';

      var defs = document.createElementNS(svgNS, 'defs');
      function makeFilter(id, stdDev) {
        var f = document.createElementNS(svgNS, 'filter');
        f.setAttribute('id', id); f.setAttribute('x', '-20%'); f.setAttribute('y', '-20%');
        f.setAttribute('width', '140%'); f.setAttribute('height', '140%');
        var blur = document.createElementNS(svgNS, 'feGaussianBlur');
        blur.setAttribute('stdDeviation', stdDev); blur.setAttribute('result', 'b');
        f.appendChild(blur);
        var merge = document.createElementNS(svgNS, 'feMerge');
        var mn1 = document.createElementNS(svgNS, 'feMergeNode'); mn1.setAttribute('in', 'b');
        var mn2 = document.createElementNS(svgNS, 'feMergeNode'); mn2.setAttribute('in', 'SourceGraphic');
        merge.appendChild(mn1); merge.appendChild(mn2); f.appendChild(merge);
        return f;
      }
      defs.appendChild(makeFilter('og1', '12'));
      defs.appendChild(makeFilter('og2', '4'));
      var ft = makeFilter('otg', '4');
      ft.setAttribute('x', '-50%'); ft.setAttribute('y', '-50%');
      ft.setAttribute('width', '200%'); ft.setAttribute('height', '200%');
      defs.appendChild(ft);
      svg.appendChild(defs);

      var bgCircle = document.createElementNS(svgNS, 'circle');
      bgCircle.setAttribute('cx', '250'); bgCircle.setAttribute('cy', '250');
      bgCircle.setAttribute('r', '140'); bgCircle.setAttribute('fill', '#7C6AEF');
      bgCircle.setAttribute('fill-opacity', '0.03');
      svg.appendChild(bgCircle);

      var ringCCW = document.createElementNS(svgNS, 'circle');
      ringCCW.setAttribute('cx', '250'); ringCCW.setAttribute('cy', '250');
      ringCCW.setAttribute('r', '150'); ringCCW.setAttribute('fill', 'none');
      ringCCW.setAttribute('stroke', strokeColor); ringCCW.setAttribute('stroke-width', '10');
      ringCCW.setAttribute('filter', 'url(#og1)'); ringCCW.setAttribute('stroke-dasharray', '940 2');
      ringCCW.classList.add('orb-ring-ccw');
      ringCCW.style.transformOrigin = '250px 250px'; ringCCW.style.transition = 'stroke 0.6s ease';
      svg.appendChild(ringCCW);

      var ringCW = document.createElementNS(svgNS, 'circle');
      ringCW.setAttribute('cx', '250'); ringCW.setAttribute('cy', '250');
      ringCW.setAttribute('r', '125'); ringCW.setAttribute('fill', 'none');
      ringCW.setAttribute('stroke', reactStroke); ringCW.setAttribute('stroke-width', '5');
      ringCW.setAttribute('filter', 'url(#og2)'); ringCW.setAttribute('stroke-dasharray', '780 5');
      ringCW.classList.add('orb-ring-cw');
      ringCW.style.transformOrigin = '250px 250px'; ringCW.style.transition = 'stroke 0.6s ease';
      svg.appendChild(ringCW);

      var text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', '250'); text.setAttribute('y', '262');
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', reactStroke);
      text.setAttribute('filter', 'url(#otg)'); text.classList.add('orb-reactor');
      text.style.fontFamily = '"Space Grotesk",sans-serif'; text.style.fontSize = '46px';
      text.style.fontWeight = '700'; text.style.letterSpacing = '6px';
      text.style.textTransform = 'uppercase'; text.style.userSelect = 'none';
      text.style.transformOrigin = '250px 250px'; text.style.transition = 'fill 0.6s ease';
      text.textContent = 'NALLY';
      svg.appendChild(text);

      var lineCoords = [[250,100,250,116],[250,384,250,400],[100,250,116,250],[384,250,400,250]];
      lineCoords.forEach(function(l) {
        var line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1',l[0]); line.setAttribute('y1',l[1]);
        line.setAttribute('x2',l[2]); line.setAttribute('y2',l[3]);
        line.setAttribute('stroke', strokeColor); line.setAttribute('stroke-width', '2');
        line.setAttribute('opacity', '0.6'); line.style.transition = 'stroke 0.6s ease';
        svg.appendChild(line);
      });

      inner.appendChild(svg);
      wrapper.appendChild(inner);

      // Mouse tilt
      if (!window.matchMedia('(pointer: coarse)').matches) {
        wrapper.addEventListener('mousemove', function(e) {
          var rect = wrapper.getBoundingClientRect();
          var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
          var dx = (e.clientX - cx) / (rect.width / 2);
          var dy = (e.clientY - cy) / (rect.height / 2);
          wrapper.style.transform = 'perspective(600px) rotateY(' + (Math.max(-1,Math.min(1,dx)) * 1.5) + 'deg) rotateX(' + (-Math.max(-1,Math.min(1,dy)) * 1.5) + 'deg)';
        });
        wrapper.addEventListener('mouseleave', function() {
          wrapper.style.transform = 'perspective(600px) rotateY(0deg) rotateX(0deg)';
        });
      }

      // ─── Apply state colors to SVG elements ────
      var thinkingEls = [];

      function applyColors(sc, gc, of, rs) {
        ambient.style.background = gc;
        svg.style.filter = of;
        ringCCW.setAttribute('stroke', sc);
        ringCW.setAttribute('stroke', rs);
        text.setAttribute('fill', rs);
        svg.querySelectorAll('line').forEach(function(l) { l.setAttribute('stroke', sc); });
      }

      function addThinkingElements() {
        removeThinkingElements();
        var rp = document.createElement('div');
        rp.className = 'orb-thinking-ring-pulse';
        inner.appendChild(rp);
        thinkingEls.push(rp);
        for (var i = 0; i < 2; i++) {
          var rip = document.createElement('div');
          rip.className = 'orb-thinking-ripple';
          rip.style.animationDelay = (i * 0.4) + 's';
          inner.appendChild(rip);
          thinkingEls.push(rip);
        }
      }

      function removeThinkingElements() {
        thinkingEls.forEach(function(el) { el.remove(); });
        thinkingEls = [];
      }

      // Public API
      return {
        el: wrapper,
        inner: inner,
        svg: svg,
        ambient: ambient,
        ringCW: ringCW,
        ringCCW: ringCCW,
        text: text,
        setState: function(newState) {
          state = newState;
          inner.className = 'orb-inner orb-state-' + state;
          if (activated) inner.classList.add('breathe');
          if (state === 'thinking') { addThinkingElements(); } else { removeThinkingElements(); }
          var sc, gc, of, rs;
          var rs2 = getComputedStyle(document.body);
          var iv = rs2.getPropertyValue('--iris').trim();
          var gv = rs2.getPropertyValue('--iris-glow').trim();
          switch (state) {
            case 'listening': sc='#3ECFB8'; gc='rgba(62,207,184,0.15)'; of='drop-shadow(0 0 25px rgba(62,207,184,0.45))'; break;
            case 'thinking': sc='#ffffff'; gc='rgba(255,255,255,0.12)'; of='drop-shadow(0 0 20px rgba(255,255,255,0.35))'; break;
            case 'speaking': sc='#34D399'; gc='rgba(52,211,153,0.15)'; of='drop-shadow(0 0 25px rgba(52,211,153,0.45))'; break;
            default: sc=iv||'#7C6AEF'; gc=gv||'rgba(124,106,239,0.1)'; of='drop-shadow(0 0 15px '+(gv||'rgba(124,106,239,0.25)')+')';
          }
          rs = state === 'idle' ? '#ffffff' : sc;
          applyColors(sc, gc, of, rs);
        },
        // Pulse the Orb for a single word
        pulseWord: function(isEmphasis) {
          inner.classList.remove('word-pulse', 'emphasis-flare');
          void inner.offsetWidth; // force reflow
          inner.classList.add(isEmphasis ? 'emphasis-flare' : 'word-pulse');
        },
        // Burst particles outward
        burstParticles: function(count, color) {
          for (var i = 0; i < (count || 8); i++) {
            var angle = (i / count) * Math.PI * 2;
            var dist = 40 + Math.random() * 60;
            var part = document.createElement('div');
            part.className = 'particle';
            part.style.setProperty('--px', Math.cos(angle) * dist + 'px');
            part.style.setProperty('--py', Math.sin(angle) * dist + 'px');
            part.style.animationDelay = '0s';
            part.style.background = color || '#34D399';
            part.style.boxShadow = '0 0 8px ' + (color || '#34D399');
            inner.appendChild(part);
            (function(el) { setTimeout(function() { el.remove(); }, 1100); })(part);
          }
        }
      };
    }

    // ─── Mount Orb ───────────────────────────────
    var orb = createOrb({ size: 312, state: 'idle', activated: true });
    document.getElementById('orb-mount').appendChild(orb.el);

    // ─── Mobile Detection ─────────────────────────
    var isMobile = window.matchMedia('(max-width: 640px)');

    function checkMobile() { return isMobile.matches; }
    isMobile.addEventListener('change', function() {
      if (!checkMobile() && drawerOpen) closeDrawer();
    });

    // ─── Think Function ──────────────────────────
    // think("Searching files...")  — shows text, sets thinking state
    // think(null)                  — clears thought, returns to idle
    var _thinkTimers = [];
    function think(text) {
      _thinkTimers.forEach(clearTimeout);
      _thinkTimers = [];
      if (text === null || text === undefined) {
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        orb.setState('idle');
        statusEl.textContent = '';
        statusEl.style.color = 'rgba(228,226,220,0.25)';
        return;
      }
      orb.setState('thinking');
      statusEl.textContent = 'Thinking';
      statusEl.style.color = 'var(--iris-glow)';
      thoughtContent.textContent = '';
      thoughtWrap.classList.add('visible');
      // Typewriter effect
      var i = 0;
      var typeTimer = setInterval(function() {
        if (i < text.length) {
          thoughtContent.textContent += text[i];
          i++;
        } else {
          clearInterval(typeTimer);
        }
      }, 30);
      _thinkTimers.push(typeTimer);
    }

    // ─── Simulated Speaking Engine ───────────────
    // speak("Hello! This is Nally... How are you?")
    // Pulses the Orb in sync with each word.
    // ! and ? trigger emphasis flares.
    // , and . trigger brief pauses.
    var _speakTimers = [];
    var thinkPhrases = [
      "Processing your request...",
      "Analyzing input...",
      "Connecting to server...",
      "Retrieving data...",
      "Formulating response...",
      "Almost ready...",
    ];
    function speak(text) {
      _speakTimers.forEach(clearTimeout);
      _speakTimers = [];

      // Thinking phase with real-time thought
      var phrase = thinkPhrases[Math.floor(Math.random() * thinkPhrases.length)];
      think(phrase);

      var thinkTime = 600 + Math.random() * 600;
      var t = setTimeout(function() {
        // Clear thought, switch to speaking
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        orb.setState('speaking');
        statusEl.textContent = 'Speaking';
        statusEl.style.color = 'rgba(52,211,153,0.5)';

        // Split into tokens: words + punctuation
        var tokens = text.match(/[\w']+|[^\w\s]|\s+/g) || [];
        var delay = 0;

        for (var i = 0; i < tokens.length; i++) {
          var token = tokens[i];
          var isWord = /[\w']/.test(token);
          var isEmphasis = /[!?]/.test(token);
          var isPause = /[.,;:]/.test(token);
          var isSpace = /^\s+$/.test(token);

          if (isWord) {
            (function(w, d, emph) {
              var timer = setTimeout(function() {
                orb.pulseWord(emph);
                // Burst particles on emphasis words
                if (emph) orb.burstParticles(6, '#34D399');
              }, d);
              _speakTimers.push(timer);
            })(token, delay, isEmphasis);
            // Word duration: ~180ms base, longer for long words
            delay += Math.max(120, token.length * 45);
          } else if (isEmphasis) {
            // Emphasis punctuation: extra pause + flare
            (function(d) {
              var timer = setTimeout(function() {
                orb.pulseWord(true);
                orb.burstParticles(10, '#34D399');
              }, d);
              _speakTimers.push(timer);
            })(delay);
            delay += 300;
          } else if (isPause) {
            delay += 200; // comma/period pause
          } else if (isSpace) {
            delay += 30; // tiny gap between words
          }
        }

        // Done speaking
        var doneTimer = setTimeout(function() {
          orb.setState('idle');
          statusEl.textContent = '';
          statusEl.style.color = 'rgba(228,226,220,0.25)';
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
        }, delay + 200);
        _speakTimers.push(doneTimer);
      }, thinkTime);
      _speakTimers.push(t);
    }

    // ─── Markdown Renderer ────────────────────────
    // Configure marked with fallback
    if (typeof marked !== 'undefined') {
      var origTable = new marked.Renderer();
      origTable.table = function() {
        var h = arguments[0], b = arguments[1];
        if (h && typeof h === 'object') { b = h.body; h = h.header; }
        return '<div class="table-wrap"><table>' + (h || '') + (b || '') + '</table></div>';
      };
      marked.setOptions({
        breaks: true,
        gfm: true,
        renderer: origTable,
        highlight: function(code, lang) {
          if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
            try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
          }
          if (typeof hljs !== 'undefined') {
            try { return hljs.highlightAuto(code).value; } catch(e) {}
          }
          return code;
        }
      });
    }

    function renderMd(text) {
      if (!text || typeof text !== 'string') {
        console.warn('[renderMd] non-string input:', typeof text, text);
        return '';
      }
      var html = '';
      try {
        if (typeof marked !== 'undefined') {
          html = marked.parse(text);
        } else {
          // Fallback: comprehensive markdown if CDN failed
          html = text
            .replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
              var cls = lang ? ' class="language-' + lang + '"' : '';
              return '<pre><code' + cls + '>' + code.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
            })
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/~~(.+?)~~/g, '<del>$1</del>')
            .replace(/^\s*[-*]\s+\[[ x]\]\s+(.+)/gm, '<li><input type="checkbox" disabled> $1</li>')
            .replace(/^\s*[-*]\s+(.+)/gm, '<li>$1</li>')
            .replace(/^\s*\d+\.\s+(.+)/gm, '<li>$1</li>')
            .replace(/(<li>.*<\/li>)/gs, function(m) { return '<ul>' + m + '</ul>'; })
            .replace(/^>\s+(.+)/gm, '<blockquote>$1</blockquote>')
            .replace(/^---$/gm, '<hr>')
            .replace(/\n/g, '<br>');
          // Basic table support
          html = html.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)+)/gm, function(m, hdr, sep, body) {
            var ths = hdr.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<th>' + c.trim() + '</th>'; }).join('');
            var rows = body.trim().split('\n').map(function(row) {
              var tds = row.split('|').filter(function(c) { return c.trim(); }).map(function(c) { return '<td>' + c.trim() + '</td>'; }).join('');
              return '<tr>' + tds + '</tr>';
            }).join('');
            return '<div class="table-wrap"><table><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
          });
        }
      } catch(e) {
        console.error('[renderMd] parse error:', e);
        html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
      }
      // Sanitize with DOMPurify if available
      if (typeof DOMPurify !== 'undefined') {
        return DOMPurify.sanitize(html, { ADD_TAGS: ['input'], ADD_ATTR: ['type', 'disabled', 'checked'] });
      }
      return html;
    }

    // ─── Chat Drawer (Desktop Window) ─────────────
    var chatDrawer = document.getElementById('chat-drawer');
    var chatMessages = document.getElementById('chat-messages');
    var chatInput = document.getElementById('chat-input');
    var titlebar = document.getElementById('drawer-titlebar');
    var drawerOpen = false;
    var isMaximized = false;
    var savedBounds = null;
    var typingEl = null;

    // ─── Textarea auto-resize + keyboard ──────────
    chatInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    chatInput.addEventListener('keydown', function(e) {
      // Enter: send (unless Shift is held)
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
        e.preventDefault();
        sendChat();
        return;
      }
      // Ctrl+Enter: also send
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        sendChat();
        return;
      }
    });

    function toggleDrawer() {
      drawerOpen = !drawerOpen;
      if (drawerOpen) {
        if (checkMobile()) {
          // Mobile: just show full-screen
          chatDrawer.style.transition = 'none';
          chatDrawer.style.opacity = '0';
          chatDrawer.classList.add('open');
          void chatDrawer.offsetWidth;
          chatDrawer.style.transition = 'opacity 0.25s ease';
          chatDrawer.style.opacity = '1';
          setTimeout(function() { chatInput.focus(); }, 300);
        } else {
          // Desktop: pop from Orb position
          var orbRect = orb.el.getBoundingClientRect();
          var orbCX = orbRect.left + orbRect.width / 2;
          var orbCY = orbRect.top + orbRect.height / 2;
          chatDrawer.style.transition = 'none';
          chatDrawer.style.left = orbCX + 'px';
          chatDrawer.style.top = orbCY + 'px';
          chatDrawer.style.transform = 'translate(-50%, -50%) scale(0.15)';
          chatDrawer.style.opacity = '0';
          chatDrawer.classList.add('open');
          void chatDrawer.offsetWidth;
          chatDrawer.style.transition = 'left 0.5s cubic-bezier(0.22,1,0.36,1), top 0.5s cubic-bezier(0.22,1,0.36,1), transform 0.5s cubic-bezier(0.22,1,0.36,1), opacity 0.4s ease';
          chatDrawer.style.left = '50%';
          chatDrawer.style.top = '50%';
          chatDrawer.style.transform = 'translate(-50%, -50%) scale(1)';
          chatDrawer.style.opacity = '1';
          setTimeout(function() {
            chatDrawer.style.transition = 'opacity 0.3s ease, box-shadow 0.3s ease';
            chatInput.focus();
          }, 510);
        }
      } else {
        closeDrawer();
      }
    }
    function closeDrawer() {
      if (checkMobile()) {
        chatDrawer.style.transition = 'opacity 0.2s ease';
        chatDrawer.style.opacity = '0';
        setTimeout(function() {
          chatDrawer.classList.remove('open', 'maximized');
          isMaximized = false;
          chatDrawer.style.transition = 'none';
          chatDrawer.style.opacity = '';
        }, 220);
      } else {
        var orbRect = orb.el.getBoundingClientRect();
        var orbCX = orbRect.left + orbRect.width / 2;
        var orbCY = orbRect.top + orbRect.height / 2;
        chatDrawer.style.transition = 'left 0.4s cubic-bezier(0.22,1,0.36,1), top 0.4s cubic-bezier(0.22,1,0.36,1), transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease';
        chatDrawer.style.left = orbCX + 'px';
        chatDrawer.style.top = orbCY + 'px';
        chatDrawer.style.transform = 'translate(-50%, -50%) scale(0.15)';
        chatDrawer.style.opacity = '0';
        setTimeout(function() {
          chatDrawer.classList.remove('open', 'maximized');
          isMaximized = false;
          chatDrawer.style.transition = 'none';
          chatDrawer.style.left = '50%';
          chatDrawer.style.top = '50%';
          chatDrawer.style.transform = 'translate(-50%, -50%)';
          chatDrawer.style.opacity = '';
        }, 410);
      }
      drawerOpen = false;
    }
    function minimizeDrawer() {
      closeDrawer();
    }
    function maximizeDrawer() {
      if (isMaximized) {
        chatDrawer.classList.remove('maximized');
        if (savedBounds) {
          chatDrawer.style.top = savedBounds.top;
          chatDrawer.style.left = savedBounds.left;
          chatDrawer.style.width = savedBounds.width;
          chatDrawer.style.height = savedBounds.height;
          chatDrawer.style.transform = 'none';
        }
        isMaximized = false;
      } else {
        savedBounds = {
          top: chatDrawer.style.top || '50%',
          left: chatDrawer.style.left || '50%',
          width: chatDrawer.style.width || '560px',
          height: chatDrawer.style.height || '480px',
        };
        chatDrawer.classList.add('maximized');
        isMaximized = true;
      }
    }

    // Double-click title bar to maximize/restore
    titlebar.addEventListener('dblclick', function(e) {
      if (e.target.classList.contains('dot')) return;
      maximizeDrawer();
    });

    // ─── Drag ─────────────────────────────────────
    var dragState = { active: false, offsetX: 0, offsetY: 0 };

    titlebar.addEventListener('mousedown', function(e) {
      if (checkMobile()) return;
      if (e.target.classList.contains('dot')) return;
      if (isMaximized) return;
      dragState.active = true;
      var rect = chatDrawer.getBoundingClientRect();
      dragState.offsetX = e.clientX - rect.left;
      dragState.offsetY = e.clientY - rect.top;
      chatDrawer.style.transform = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragState.active) return;
      var x = e.clientX - dragState.offsetX;
      var y = e.clientY - dragState.offsetY;
      chatDrawer.style.left = x + 'px';
      chatDrawer.style.top = y + 'px';
    });

    document.addEventListener('mouseup', function() {
      dragState.active = false;
    });

    // ─── Resize ───────────────────────────────────
    var resizeState = { active: false, dir: '', startX: 0, startY: 0, startW: 0, startH: 0, startL: 0, startT: 0 };

    document.querySelectorAll('.resize-handle').forEach(function(handle) {
      handle.addEventListener('mousedown', function(e) {
        if (checkMobile()) return;
        if (isMaximized) return;
        e.preventDefault();
        e.stopPropagation();
        var rect = chatDrawer.getBoundingClientRect();
        resizeState.active = true;
        resizeState.dir = handle.dataset.dir;
        resizeState.startX = e.clientX;
        resizeState.startY = e.clientY;
        resizeState.startW = rect.width;
        resizeState.startH = rect.height;
        resizeState.startL = rect.left;
        resizeState.startT = rect.top;
        chatDrawer.style.transform = 'none';
      });
    });

    document.addEventListener('mousemove', function(e) {
      if (!resizeState.active) return;
      var dx = e.clientX - resizeState.startX;
      var dy = e.clientY - resizeState.startY;
      var dir = resizeState.dir;
      var minW = 320, minH = 260;
      var newW = resizeState.startW, newH = resizeState.startH;
      var newL = resizeState.startL, newT = resizeState.startT;

      if (dir.includes('e')) newW = Math.max(minW, resizeState.startW + dx);
      if (dir.includes('w')) { newW = Math.max(minW, resizeState.startW - dx); newL = resizeState.startL + (resizeState.startW - newW); }
      if (dir.includes('s')) newH = Math.max(minH, resizeState.startH + dy);
      if (dir.includes('n')) { newH = Math.max(minH, resizeState.startH - dy); newT = resizeState.startT + (resizeState.startH - newH); }

      chatDrawer.style.width = newW + 'px';
      chatDrawer.style.height = newH + 'px';
      chatDrawer.style.left = newL + 'px';
      chatDrawer.style.top = newT + 'px';
    });

    document.addEventListener('mouseup', function() {
      resizeState.active = false;
    });

    // ─── Chat History ──────────────────────────────
    function loadHistory() {
      // Echo prevention: skip re-fetch if this tab is currently streaming
      if (window._streamMsgEl) return;
      fetch(NALLY_API + '/api/history', {
        headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN }
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.messages && data.messages.length) {
          data.messages.forEach(function(m) {
            if (m.role !== 'system' && m.role !== 'tool') {
              addChatMsg(m.content, m.role === 'assistant');
            }
          });
        }
      }).catch(function(){});
    }

    function clearChat() {
      fetch(NALLY_API + '/api/clear', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN }
      }).then(function() {
        chatMessages.innerHTML = '';
      }).catch(function(){});
    }

    // ─── Chat Logic ───────────────────────────────
    function addChatMsg(text, isNally) {
      if (typeof text !== 'string') text = String(text || '');
      var msg = document.createElement('div');
      msg.className = 'drawer-msg ' + (isNally ? 'nally' : 'user');

      if (isNally) {
        var name = document.createElement('div');
        name.className = 'msg-name';
        name.textContent = 'NALLY';
        msg.appendChild(name);
      }

      var textEl = document.createElement('div');
      textEl.className = 'msg-text';
      textEl.innerHTML = isNally ? renderMd(text) : text.replace(/</g, '&lt;').replace(/>/g, '&gt;');

      msg.appendChild(textEl);

      // Copy button for NALLY messages
      if (isNally) {
        var copyBtn = document.createElement('button');
        copyBtn.className = 'msg-copy';
        copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect x="92" y="92" width="100" height="100" rx="8" fill="none" stroke="currentColor" stroke-width="16"/><path d="M200,56V40a8,8,0,0,0-8-8H40A8,8,0,0,0,32,40V168a8,8,0,0,0,8,8H56" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/></svg>';
        copyBtn.title = 'Copy';
        copyBtn.addEventListener('click', function() {
          navigator.clipboard.writeText(text).then(function() {
            copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><polyline points="40 144 96 200 216 80" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            setTimeout(function() {
              copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect x="92" y="92" width="100" height="100" rx="8" fill="none" stroke="currentColor" stroke-width="16"/><path d="M200,56V40a8,8,0,0,0-8-8H40A8,8,0,0,0,32,40V168a8,8,0,0,0,8,8H56" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/></svg>';
            }, 1500);
          });
        });
        msg.appendChild(copyBtn);
      }

      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ─── Tool Cards ────────────────────────────────
    var toolCards = {};

    function toolIcon(name) {
      var icons = {
        ReadFile: 'file-text', FileOps: 'folder-cog', RunCommand: 'terminal',
        RunCode: 'play', CodeAnalysis: 'scan', SystemHealth: 'activity',
        WriteFile: 'file-plus', SearchFiles: 'search', WebSearch: 'globe',
        MemorySearch: 'brain', MemoryStore: 'database',
      };
      return icons[name] || 'zap';
    }

    function autoSummary(name, args) {
      if (!args) return 'Running ' + name;
      if (name === 'RunCommand' && args.command) {
        var cmd = args.command.trim();
        if (cmd.startsWith('ls') || cmd.startsWith('dir')) return 'Listing directory contents';
        if (cmd.startsWith('cd ')) return 'Changing directory to ' + cmd.slice(3);
        if (cmd.startsWith('cat ') || cmd.startsWith('type ')) return 'Reading file ' + cmd.split(' ').pop();
        if (cmd.startsWith('mkdir')) return 'Creating directory ' + cmd.split(' ').pop();
        if (cmd.startsWith('rm ') || cmd.startsWith('del ')) return 'Deleting ' + cmd.split(' ').pop();
        if (cmd.startsWith('cp ') || cmd.startsWith('copy ')) return 'Copying files';
        if (cmd.startsWith('mv ') || cmd.startsWith('ren ') || cmd.startsWith('rename ')) return 'Renaming or moving files';
        if (cmd.startsWith('git ')) return 'Running git command';
        if (cmd.startsWith('npm ') || cmd.startsWith('yarn ') || cmd.startsWith('pip ')) return 'Running package manager';
        if (cmd.includes('curl') || cmd.includes('wget')) return 'Fetching remote content';
        if (cmd.includes('grep') || cmd.includes('find') || cmd.includes('search')) return 'Searching for files or text';
        if (cmd.includes('test') || cmd.includes('pytest') || cmd.includes('jest')) return 'Running tests';
        if (cmd.includes('build') || cmd.includes('compile')) return 'Building project';
        if (cmd.includes('install')) return 'Installing dependencies';
        if (cmd.includes('start') || cmd.includes('run') || cmd.includes('serve')) return 'Starting a service';
        if (cmd.includes('stop') || cmd.includes('kill')) return 'Stopping a process';
        if (cmd.includes('deploy')) return 'Deploying application';
        if (cmd.length > 60) cmd = cmd.substring(0, 57) + '...';
        return 'Running: ' + cmd;
      }
      if (name === 'ReadFile' && args.path) {
        var parts = args.path.replace(/\\/g, '/').split('/');
        return 'Reading ' + (parts[parts.length - 1] || args.path);
      }
      if (name === 'FileOps') {
        if (args.action === 'list') return 'Listing files in ' + (args.path || 'directory');
        if (args.action === 'write') return 'Writing to ' + (args.path || 'file');
        if (args.action === 'mkdir') return 'Creating folder ' + (args.path || 'directory');
        return 'Performing file operation';
      }
      if (name === 'SearchFiles' && args.pattern) return 'Searching for "' + args.pattern + '"';
      if (name === 'WebSearch' && args.query) return 'Searching the web for "' + args.query + '"';
      if (name === 'RunCode') return 'Executing code';
      if (name === 'CodeAnalysis') return 'Analyzing ' + (args.path || 'code');
      if (name === 'MemorySearch' && args.query) return 'Searching memory for "' + args.query + '"';
      if (name === 'MemoryStore') return 'Saving to memory';
      if (args.path) return 'Working with ' + args.path;
      if (args.query) return 'Processing "' + args.query + '"';
      if (args.command) return 'Running command';
      return 'Running ' + name;
    }

    function addToolCard(name, args, id) {

        chatMessages.appendChild(skelEl);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        toolCards[id] = {
          card: null, statusEl: null, name: name,
          resultSection: null, resultCode: null,

        };

      }

      var card = document.createElement('div');
      card.className = 'tool-card running';

      // Header
      var header = document.createElement('div');
      header.className = 'tool-card-header';

      // Label: summary (primary) + name (secondary)
      var label = document.createElement('div');
      label.className = 'tool-card-label';

      var summary = document.createElement('div');
      summary.className = 'tool-card-summary';

      header.appendChild(label);

      card.appendChild(header);

      // Result zone (hidden until done)

      resultLabel.className = 'tool-card-zone-label';

      toolCards[id] = {

    }

    function updateToolCard(id, resultText, isError) {
      var tc = toolCards[id];
      if (!tc) return;

      // Image generation: only skeleton, no tool card
      if (tc.name === 'generate_image' && tc.skelEl) {
        if (isError) {
          tc.skelEl.style.opacity = '0.3';
          delete toolCards[id];
          return;
        }
        if (resultText) {
          var imgMatch = resultText.match(/IMAGE_FILE:(.+)/);
          if (imgMatch) {
            var imgPath = imgMatch[1].trim();
            var imgFilename = imgPath.split(/[/\\]/).pop();
            var imgUrl = '/generated/' + imgFilename;
            var img = document.createElement('img');
            img.src = imgUrl;
            img.style.cssText = 'cursor:pointer;';
            img.addEventListener('click', function() { window.open(imgUrl, '_blank'); });
            tc.skelEl.appendChild(img);
            img.onload = function() {
              tc.skelEl.classList.add('loaded');
              chatMessages.scrollTop = chatMessages.scrollHeight;
            };
            img.onerror = function() {
              tc.skelEl.style.opacity = '0.3';
            };
          } else {
            tc.skelEl.style.opacity = '0.3';
          }
        }
        delete toolCards[id];
        return;
      }

      tc.card.classList.remove('running');
      tc.card.classList.add(isError ? 'error' : 'success');

      // Status: check or error icon
      tc.statusEl.innerHTML = isError
        ? '<span class="tool-card-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>'
        : '<span class="tool-card-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>';

      // Result zone
      if (resultText) {
        var truncated = resultText.substring(0, 5000);

        // Check for image file marker
        var imgMatch = truncated.match(/IMAGE_FILE:(.+)/);
        if (imgMatch) {
          var imgPath = imgMatch[1].trim();
          // Convert absolute path to URL
          var imgFilename = imgPath.split(/[/\\]/).pop();
          var imgUrl = '/generated/' + imgFilename;
          var metaText = truncated.replace(/IMAGE_FILE:.+/, '').trim();

          tc.resultCode.innerHTML = '';
          if (metaText) {
            var metaEl = document.createElement('div');
            metaEl.className = 'tool-card-code';
            metaEl.textContent = metaText;
            tc.resultCode.appendChild(metaEl);
          }

          // Crossfade skeleton to image
          if (tc.skelEl) {
            var img = document.createElement('img');
            img.src = imgUrl;
            img.style.cssText = 'cursor:pointer;';
            img.addEventListener('click', function() { window.open(imgUrl, '_blank'); });
            tc.skelEl.appendChild(img);
            // Trigger crossfade after image loads
            img.onload = function() {
              tc.skelEl.classList.add('loaded');
              chatMessages.scrollTop = chatMessages.scrollHeight;
            };
            img.onerror = function() {
              tc.skelEl.classList.remove('loaded');
              tc.skelEl.querySelector('.img-skel-label').textContent = 'Failed to load';
            };
          } else {
            // Fallback: no skeleton, render inline
            var img = document.createElement('img');
            img.src = imgUrl;
            img.style.cssText = 'max-width:100%;border-radius:8px;margin-top:8px;cursor:pointer;';
            img.onload = function() { chatMessages.scrollTop = chatMessages.scrollHeight; };
            img.onerror = function() { img.alt = 'Image failed to load: ' + imgFilename; };
            img.addEventListener('click', function() { window.open(imgUrl, '_blank'); });
            tc.resultCode.appendChild(img);
          }
        } else {
          tc.resultCode.textContent = truncated;
        }

        tc.resultSection.style.display = 'block';
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;
      delete toolCards[id];
    }

    // ─── Config ────────────────────────────────────
    var NALLY_API = 'http://localhost:5000';
    var NALLY_TOKEN = localStorage.getItem('nally-token') || '';

    // ─── Login Gate ────────────────────────────────
    var loginOverlay = document.getElementById('login-overlay');
    var loginErr = document.getElementById('login-err');

    // Wait for marked.js to load (scripts are local, should be instant)
    function waitForMarked(cb, attempts) {
      attempts = attempts || 0;
      if (typeof marked !== 'undefined') {
        cb();
      } else if (attempts < 10) {
        setTimeout(function() { waitForMarked(cb, attempts + 1); }, 50);
      } else {
        console.warn('[waitForMarked] marked.js failed to load, proceeding with fallback');
        cb();
      }
    }

    function doLogin() {
      var input = document.getElementById('login-token-input');
      var token = input.value.trim();
      if (!token) return;
      loginErr.style.display = 'none';
      // Verify token by hitting the status endpoint
      fetch(NALLY_API + '/api/status', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(r) {
        if (!r.ok) throw new Error('bad');
        return r.json();
      }).then(function() {
        localStorage.setItem('nally-token', token);
        NALLY_TOKEN = token;
        loginOverlay.classList.add('hidden');
        setTimeout(function() { loginOverlay.remove(); }, 400);
        waitForMarked(loadHistory);
        setTimeout(subscribeEvents, 500);
      }).catch(function() {
        loginErr.style.display = 'block';
      });
    }

    document.getElementById('login-token-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    // Gate: if no token stored, show login; otherwise hide overlay
    if (!NALLY_TOKEN) {
      loginOverlay.classList.remove('hidden');
    } else {
      // Verify stored token is still valid
      fetch(NALLY_API + '/api/status', {
        headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN }
      }).then(function(r) {
        if (!r.ok) throw new Error('bad');
        loginOverlay.classList.add('hidden');
        setTimeout(function() { loginOverlay.remove(); }, 400);
        waitForMarked(loadHistory);
      }).catch(function() {
        // Token invalid — show login
        NALLY_TOKEN = '';
        localStorage.removeItem('nally-token');
      });
    }

    // ─── SSE Chat Client ──────────────────────────
    var chatAbort = null;

    // ─── WebSocket Client ─────────────────────────
    var nallyWs = null;
    var useWebSocket = false;

    function initWebSocket() {
      if (!NALLY_TOKEN || nallyWs) return;
      
      var wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var wsUrl = wsProtocol + '//' + location.host + '/ws/web:default';
      
      nallyWs = new NallyWebSocket(wsUrl, NALLY_TOKEN);
      
      nallyWs.on('connected', function() {
        console.log('[chat] WebSocket connected');
        useWebSocket = true;
      });
      
      nallyWs.on('disconnected', function() {
        console.log('[chat] WebSocket disconnected, falling back to SSE');
        useWebSocket = false;
      });
      
      nallyWs.on('thought', function(data) {
        think(data.text || 'Thinking...');
      });
      
      nallyWs.on('stream_chunk', function(data) {
        removeTyping();
        if (!window._streamMsgEl) {
          window._streamMsgEl = addChatMsgStream();
        }
        if (typeof data.text === 'string') {
          window._streamMsgEl.textContent += data.text;
        }
      });
      
      nallyWs.on('tool_call', function(data) {
        removeTyping();
        addToolCard(data.name, data.args, data.id);
        think('Running ' + data.name + '...');
      });
      
      nallyWs.on('tool_result', function(data) {
        updateToolCard(data.tool_call_id, data.result, false);
        think('Processing result...');
        if (data.diff && data.file_path) {
          showDiff(data.diff, data.file_path);
        }
      });
      
      nallyWs.on('response', function(data) {
        removeTyping();
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        
        if (window._streamMsgEl) {
          if (!window._streamMsgEl.querySelector('p, h1, h2, h3, h4, ul, ol, pre, blockquote, table')) {
            window._streamMsgEl.innerHTML = renderMd(window._streamMsgEl.textContent);
            lucide.createIcons();
          }
          window._streamMsgEl = null;
        } else {
          addChatMsg(data.text || '', true);
        }
      });
      
      nallyWs.on('error', function(data) {
        removeTyping();
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        if (data.text) {
          addChatMsg(data.text, true);
        }
      });

      nallyWs.on('busy', function(data) {
        think(data.text || 'Queued...');
      });

      nallyWs.on('done', function() {
        window._streamMsgEl = null;
      });
      
      nallyWs.on('user_message', function(data) {
        if (data.tab_id === _tabId) return;
        addChatMsg(data.text || '', false);
      });
      
      nallyWs.on('assistant_message', function(data) {
        if (data.tab_id === _tabId) return;
        addChatMsg(data.text || '', true);
      });
      
      nallyWs.on('thinking', function(data) {
        if (data.tab_id === _tabId) return;
        showTyping();
      });
      
      nallyWs.on('history_cleared', function() {
        chatMessages.innerHTML = '';
      });
      
      nallyWs.on('approval_resolved', function() {
        // Handled by tool card updates
      });
      
      nallyWs.on('mcp_status', function() {
        renderServices();
      });
      
      nallyWs.connect();
    }

    // Initialize WebSocket after auth
    if (NALLY_TOKEN) {
      setTimeout(initWebSocket, 500);
    }

    function sendChat() {
      var text = chatInput.value.trim();
      if (!text) return;
      addChatMsg(text, false);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      window._streamMsgEl = null;

      showTyping();
      think('Thinking...');

      // Use WebSocket if available
      if (useWebSocket && nallyWs && nallyWs.connected) {
        nallyWs.send(text, _tabId);
        return;
      }

      // Fallback to SSE
      if (chatAbort) chatAbort.abort();
      chatAbort = new AbortController();

      var streamMsgEl = null;

      fetch(NALLY_API + '/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + NALLY_TOKEN,
        },
        body: JSON.stringify({ message: text, tab_id: _tabId }),
        signal: chatAbort.signal,
      }).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        function readChunk() {
          reader.read().then(function(result) {
            if (result.done) {
              removeTyping();
              thoughtContent.textContent = '';
              thoughtWrap.classList.remove('visible');
              if (streamMsgEl && !streamMsgEl.querySelector('p, h1, h2, h3, h4, ul, ol, pre, blockquote, table')) {
                streamMsgEl.innerHTML = renderMd(streamMsgEl.textContent);
                lucide.createIcons();
              }
              return;
            }

            buffer += decoder.decode(result.value, { stream: true });
            var lines = buffer.split('\n');
            buffer = lines.pop(); // keep incomplete line

            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim();
              if (!line.startsWith('data: ')) continue;
              var jsonStr = line.substring(6);
              if (jsonStr === '{"event": "done"}') continue;

              try {
                var evt = JSON.parse(jsonStr);
                handleSSE(evt, function(el) { streamMsgEl = el; });
              } catch (e) { console.error('SSE parse error:', e, jsonStr); }
            }

            readChunk();
          });
        }

        readChunk();
      }).catch(function(err) {
        if (err.name === 'AbortError') return;
        removeTyping();
        thoughtContent.textContent = '';
        thoughtWrap.classList.remove('visible');
        addChatMsg('Backend offline — make sure NALLY server is running on port 5000.', true);
      });
    }

    function handleSSE(evt, setStreamEl) {
      console.log('SSE event:', evt.type, evt);
      switch (evt.type) {
        case 'busy':
          think(evt.text);
          break;

        case 'tool_call':
          removeTyping();
          addToolCard(evt.name, evt.args, evt.id);
          think('Running ' + evt.name + '...');
          break;

        case 'tool_result':
          console.log('tool_result:', evt);
          updateToolCard(evt.tool_call_id, evt.result, false);
          think('Processing result...');
          if (evt.diff && evt.file_path) {
            console.log('DIFF FOUND:', evt.file_path, evt.diff.substring(0, 200));
            showDiff(evt.diff, evt.file_path);
          }
          break;

        case 'thought':
          think(evt.text);
          break;

        case 'stream_chunk':
          removeTyping();
          if (!window._streamMsgEl) {
            window._streamMsgEl = addChatMsgStream();
            setStreamEl(window._streamMsgEl);
          }
          if (typeof evt.text !== 'string') {
            console.warn('[stream_chunk] non-string evt.text:', typeof evt.text, evt);
          }
          window._streamMsgEl.textContent += (typeof evt.text === 'string' ? evt.text : '');
          chatMessages.scrollTop = chatMessages.scrollHeight;
          break;

        case 'response':
          removeTyping();
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
          if (typeof evt.text !== 'string') {
            console.warn('[response] non-string evt.text:', typeof evt.text, evt);
          }
          var respText = typeof evt.text === 'string' ? evt.text : String(evt.text || '');
          if (window._streamMsgEl) {
            // Only re-render if stream_done hasn't already rendered it
            var alreadyRendered = window._streamMsgEl.querySelector('p, h1, h2, h3, h4, ul, ol, pre, blockquote, table, strong, em, code');
            if (!alreadyRendered) {
              window._streamMsgEl.innerHTML = renderMd(respText);
              lucide.createIcons();
            }
          } else {
            addChatMsg(respText, true);
          }
          window._streamMsgEl = null;
          speak(respText);
          break;

        case 'error':
          removeTyping();
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
          window._streamMsgEl = null;
          addChatMsg('Error: ' + evt.text, true);
          break;

        case 'stream_done':
          removeTyping();
          thoughtContent.textContent = '';
          thoughtWrap.classList.remove('visible');
          if (window._streamMsgEl) {
            window._streamMsgEl.innerHTML = renderMd(window._streamMsgEl.textContent);
            lucide.createIcons();
          }
          break;

        case 'confirmation_required':
          var approveCard = document.createElement('div');
          approveCard.className = 'tool-card pending expanded';

          var header = document.createElement('div');
          header.className = 'tool-card-header';
          header.style.cursor = 'default';

          // Label: summary (primary) + name (secondary)
          var label = document.createElement('div');
          label.className = 'tool-card-label';

          var summary = document.createElement('div');
          summary.className = 'tool-card-summary';
          summary.textContent = autoSummary(evt.name, evt.args);

          var nameEl = document.createElement('div');
          nameEl.className = 'tool-card-name';
          nameEl.textContent = evt.name || 'tool';

          label.appendChild(summary);
          label.appendChild(nameEl);

          // Status: approval icon
          var statusEl = document.createElement('div');
          statusEl.className = 'tool-card-status';
          statusEl.innerHTML = '<span style="color:#FBBF24"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></span>';

          header.appendChild(label);
          header.appendChild(statusEl);
          approveCard.appendChild(header);

          // Body with grid animation
          var body = document.createElement('div');
          body.className = 'tool-card-body';
          var inner = document.createElement('div');
          inner.className = 'tool-card-body-inner';

          var detail = document.createElement('div');
          detail.className = 'tool-card-detail';

          // Input zone
          var inputLabel = document.createElement('div');
          inputLabel.className = 'tool-card-zone-label';
          inputLabel.textContent = 'Input';
          var inputCode = document.createElement('div');
          inputCode.className = 'tool-card-code';
          inputCode.textContent = evt.args ? JSON.stringify(evt.args, null, 2) : 'No input';
          detail.appendChild(inputLabel);
          detail.appendChild(inputCode);

          // Show diff if available
          if (evt.diff && evt.file_path) showDiff(evt.diff, evt.file_path);

          // Approve / Deny buttons
          var btnWrap = document.createElement('div');
          btnWrap.className = 'tool-card-approve-btns';
          btnWrap.style.borderTop = '1px solid rgba(255,255,255,0.05)';

          var approveBtn = document.createElement('button');
          approveBtn.className = 'tool-approve-yes';
          approveBtn.textContent = 'Approve';

          var denyBtn = document.createElement('button');
          denyBtn.className = 'tool-approve-no';
          denyBtn.textContent = 'Deny';

          var tcId = evt.tool_call_id;
          approveBtn.addEventListener('click', function() { approveTool(tcId, true); approveCard.remove(); });
          denyBtn.addEventListener('click', function() { approveTool(tcId, false); approveCard.remove(); });

          btnWrap.appendChild(approveBtn);
          btnWrap.appendChild(denyBtn);
          detail.appendChild(btnWrap);

          inner.appendChild(detail);
          body.appendChild(inner);
          approveCard.appendChild(body);

          chatMessages.appendChild(approveCard);
          lucide.createIcons();
          chatMessages.scrollTop = chatMessages.scrollHeight;
          break;
      }
    }

    function approveTool(toolCallId, approved) {
      fetch(NALLY_API + '/api/approve', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + NALLY_TOKEN,
        },
        body: JSON.stringify({ tool_call_id: toolCallId, approved: approved }),
      });
    }

    function addChatMsgStream() {
      var msg = document.createElement('div');
      msg.className = 'drawer-msg nally';

      var name = document.createElement('div');
      name.className = 'msg-name';
      name.textContent = 'NALLY';
      msg.appendChild(name);

      var textEl = document.createElement('div');
      textEl.className = 'msg-text';
      textEl.textContent = '';
      msg.appendChild(textEl);

      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return textEl;
    }

    orb.el.addEventListener('click', function() {
      toggleDrawer();
    });

    // ─── Uptime Counter ──────────────────────────
    var startTime = Date.now();
    setInterval(function() {
      var elapsed = Math.floor((Date.now() - startTime) / 1000);
      var m = Math.floor(elapsed / 60);
      var h = Math.floor(m / 60);
      var s = elapsed % 60;
      var el = document.getElementById('settings-uptime');
      if (el) {
        el.textContent = h > 0 ? h + 'h ' + (m % 60) + 'm' : m + 'm ' + s + 's';
      }
    }, 1000);

    // ─── Settings Dropdown ────────────────────────
    var settingsDropdown = document.getElementById('settings-dropdown');
    var settingsOverlay = document.getElementById('settings-overlay');
    var settingsOpen = false;

    function positionDropdown() {
      var isMobile = window.innerWidth < 640;
      settingsDropdown.classList.remove('pos-desktop', 'pos-mobile');
      settingsDropdown.classList.add(isMobile ? 'pos-mobile' : 'pos-desktop');
    }

    function toggleSettings(e) {
      if (e) e.stopPropagation();
      if (settingsOpen) { closeSettings(); }
      else { openSettings(); }
    }

    function openSettings() {
      settingsOpen = true;
      positionDropdown();
      settingsOverlay.classList.add('open');
      settingsDropdown.classList.add('open');
      loadSettingsUI();
    }

    function closeSettings() {
      settingsOpen = false;
      settingsDropdown.classList.remove('open');
      settingsOverlay.classList.remove('open');
    }

    function toggleSection(head) {
      var section = head.parentElement;
      section.classList.toggle('open');
    }

    // Theme switcher
    function setTheme(name) {
      document.body.className = '';
      document.body.classList.add('theme-' + name);
      if (document.getElementById('compact-toggle').checked) document.body.classList.add('compact');
      if (document.getElementById('lock-toggle').checked) document.body.classList.add('lock-mode');
      localStorage.setItem('nally-theme', name);
      document.querySelectorAll('.theme-swatch').forEach(function(s) {
        s.classList.toggle('active', s.dataset.theme === name);
      });
    }

    // Compact mode
    function setCompact(on) {
      document.body.classList.toggle('compact', on);
      localStorage.setItem('nally-compact', on);
    }

    // Emergency stop
    function emergencyStop() {
      // Abort the SSE stream
      if (chatAbort) { chatAbort.abort(); chatAbort = null; }
      // Tell backend to abort
      fetch(NALLY_API + '/api/abort', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + NALLY_TOKEN }
      }).catch(function(){});
      // Clean up UI
      removeTyping();
      thoughtContent.textContent = '';
      thoughtWrap.classList.remove('visible');
      orb.setState('idle');
      var statusEl = document.getElementById('status-text');
      if (statusEl) { statusEl.textContent = ''; statusEl.style.color = ''; }

      var overlay = document.getElementById('auth-modal-overlay');
      var icon = document.getElementById('auth-modal-icon');
      var title = document.getElementById('auth-modal-title');
      var sub = document.getElementById('auth-modal-sub');
      var spinner = document.getElementById('auth-modal-spinner');
      var success = document.getElementById('auth-modal-success');
      var body = document.getElementById('auth-modal-body');
      icon.style.background = 'rgba(239,68,68,0.15)';
      icon.style.color = '#EF4444';
      icon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>';
      title.textContent = 'Emergency Stop';
      sub.textContent = 'All operations halted';
      spinner.style.display = 'none';
      success.classList.remove('show');
      body.innerHTML = '<button class="auth-modal-btn" onclick="closeAuthModal()">OK</button>';
      overlay.classList.add('open');
    }

    // Lock mode
    function setLockMode(on) {
      document.body.classList.toggle('lock-mode', on);
      localStorage.setItem('nally-lock', on);
    }

    // Load saved settings
    function loadSettingsUI() {
      var savedTheme = localStorage.getItem('nally-theme') || 'midnight';
      setTheme(savedTheme);
      var savedCompact = localStorage.getItem('nally-compact') === 'true';
      document.getElementById('compact-toggle').checked = savedCompact;
      document.body.classList.toggle('compact', savedCompact);

      var savedLock = localStorage.getItem('nally-lock') === 'true';
      document.getElementById('lock-toggle').checked = savedLock;
      document.body.classList.toggle('lock-mode', savedLock);

      // Backend status
      var statusEl = document.getElementById('settings-backend-status');
      fetch(NALLY_API + '/api/status', { method: 'GET', signal: AbortSignal.timeout(3000) })
        .then(function(r) { statusEl.textContent = 'Online'; statusEl.style.color = 'var(--green)'; })
        .catch(function() { statusEl.textContent = 'Offline'; statusEl.style.color = '#EF4444'; });

      // Uptime
      var uptimeEl = document.getElementById('settings-uptime');
      var elapsed = Math.floor((Date.now() - startTime) / 1000);
      var m = Math.floor(elapsed / 60);
      var h = Math.floor(m / 60);
      uptimeEl.textContent = h > 0 ? h + 'h ' + (m % 60) + 'm' : m + 'm ' + (elapsed % 60) + 's';

      renderServices();
    }
